<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mini Broker — Finnhub WebSocket (Live PnL)</title>

<!-- TradingView widget (optionnel) -->
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

<style>
  :root{--bg:#071423;--muted:#9aa4b2;--accent:#00c4a7;--radius:12px;font-family:Inter,system-ui,Arial;}
  body{margin:0;padding:14px;background:linear-gradient(180deg,#071025,#071423);color:#e6eef6;box-sizing:border-box}
  .layout{display:grid;grid-template-columns:1fr 360px;grid-template-rows:1fr 320px;gap:14px;height:calc(100vh - 28px)}
  .card{background:rgba(255,255,255,0.02);border-radius:var(--radius);padding:12px;box-shadow:0 8px 28px rgba(0,0,0,0.6);overflow:hidden}
  .header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .symbol-badge{background:rgba(255,255,255,0.03);padding:8px 12px;border-radius:10px;font-weight:700;color:var(--accent)}
  .controls{display:flex;gap:8px}
  .btn{padding:8px 12px;border-radius:8px;border:0;cursor:pointer;font-weight:700}
  .btn-buy{background:linear-gradient(90deg,#0ea5a3,#00c4a7);color:#022}
  .btn-sell{background:linear-gradient(90deg,#ff6b6b,#ff8a8a);color:#111}
  .small{font-size:13px;color:var(--muted)}
  .watchlist{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
  .wl-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
  .status{font-weight:700;padding:6px 10px;border-radius:8px}
  .status.connected{background:rgba(0,196,167,0.08);color:var(--accent)}
  .status.disconnected{background:rgba(255,99,99,0.06);color:#ff8a8a}
  table{width:100%;border-collapse:collapse}
  td,th{padding:8px;text-align:left;border-bottom:1px dashed rgba(255,255,255,0.03);font-size:13px}
  .positive{color:#0f5132;background:rgba(16,185,129,0.07);padding:6px;border-radius:6px;font-weight:700}
  .negative{color:#7c1d1d;background:rgba(255,99,99,0.06);padding:6px;border-radius:6px;font-weight:700}
  #tv_chart_container{height:420px;border-radius:8px;overflow:hidden;margin-top:8px}
  @media (max-width:1000px){ .layout{grid-template-columns:1fr;grid-template-rows:auto auto auto} .watchlist{max-height:200px} }
</style>
</head>
<body>
<div class="layout">
  <div class="card" id="mainCard">
    <div class="header-row">
      <div style="display:flex;gap:12px;align-items:center">
        <div class="symbol-badge" id="currentSymbolBadge">OANDA:EUR_USD</div>
        <div>
          <div style="font-weight:900" id="currentSymbolTitle">EUR / USD</div>
          <div class="small" id="currentPriceMini">Prix: —</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div id="wsStatus" class="status disconnected">WS: Disconnected</div>
        <div class="controls">
          <button id="refreshBtn" class="btn">Refresh</button>
          <button id="buyBtn" class="btn btn-buy">BUY</button>
          <button id="sellBtn" class="btn btn-sell">SELL</button>
        </div>
      </div>
    </div>

    <div id="tv_chart_container"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:800">Watchlist</div>
      <div class="small">Demo · Finnhub WS</div>
    </div>

    <div id="wlList" class="watchlist"></div>

    <div style="margin-top:10px">
      <div style="font-weight:800;margin-bottom:6px">Ordres Limites</div>
      <table>
        <thead><tr><th>Symbole</th><th>Side</th><th>Prix</th><th>Size</th><th></th></tr></thead>
        <tbody id="ordersBody"></tbody>
      </table>

      <div style="display:flex;gap:8px;margin-top:8px">
        <select id="ordSymbol" style="flex:1"></select>
        <select id="ordSide" style="width:80px"><option>BUY</option><option>SELL</option></select>
        <input id="ordPrice" placeholder="Prix" style="width:90px"/>
        <input id="ordSize" placeholder="Size" style="width:60px" value="1"/>
        <button id="addOrderBtn" class="btn btn-buy">Placer</button>
      </div>
    </div>
  </div>

  <div class="card" style="grid-column:1/3">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:800">Positions & Historique</div>
      <div class="small">Balance: <span id="simBalance">10000.00</span> USD · PnL total: <span id="totalPnl">0.00</span></div>
    </div>

    <div style="display:flex;gap:12px">
      <div style="flex:1">
        <div style="font-weight:700;margin-bottom:6px">Positions Ouvertes</div>
        <table><thead><tr><th>Symbole</th><th>Side</th><th>Entry</th><th>Actuel</th><th>PNL</th><th></th></tr></thead><tbody id="positionsBody"></tbody></table>
      </div>
      <div style="width:340px">
        <div style="font-weight:700;margin-bottom:6px">Historique</div>
        <table style="width:100%"><thead><tr><th>Symbole</th><th>Side</th><th>PNL</th></tr></thead><tbody id="historyBody"></tbody></table>
      </div>
    </div>
  </div>
</div>

<script>
/*
  Finnhub WebSocket integration:
  - Uses user-provided token to connect: wss://ws.finnhub.io?token=YOUR_TOKEN
  - Subscribe messages: { "type":"subscribe", "symbol":"AAPL" } (supports OANDA:EUR_USD, BINANCE:BTCUSDT, etc.)
  - Incoming messages: { "type":"trade", "data":[{ "s":"AAPL", "p":261.74, "t":158264... }, ...] }
  - This page subscribes to the watchlist and updates priceCache, positions PnL in real-time.
*/

/* ---------- CONFIG: remplacez la clé si besoin ---------- */
const API_KEY = 'd4g61b9r01qm5b343fo0d4g61b9r01qm5b343fog'; // VOTRE CLE FINNHUB fournie
const WS_ENDPOINT = 'wss://ws.finnhub.io';
const USE_WS = true;
const KEEPALIVE_INTERVAL = 25000;
const RECONNECT_MAX = 60000;

/* ---------- WATCHLIST (utiliser symboles compatibles Finnhub) ---------- */
const WATCHLIST = [
  { symbol: 'OANDA:EUR_USD', api: 'OANDA:EUR_USD', label: 'EUR / USD' },
  { symbol: 'OANDA:USD_JPY', api: 'OANDA:USD_JPY', label: 'USD / JPY' },
  { symbol: 'OANDA:GBP_USD', api: 'OANDA:GBP_USD', label: 'GBP / USD' },
  { symbol: 'OANDA:XAU_USD', api: 'OANDA:XAU_USD', label: 'XAU / USD' },
  { symbol: 'AAPL', api: 'AAPL', label: 'Apple (AAPL)' },
  { symbol: 'SPY', api: 'SPY', label: 'SPY (ETF)' }
];

/* ---------- STATE ---------- */
let currentSymbol = WATCHLIST[0];
let priceCache = {};    // { 'OANDA:EUR_USD': 1.12, 'AAPL': 150.2 }
let positions = [];     // open positions
let history = [];       // closed positions
let orders = [];        // local limit orders
let simBalance = 10000.00;

/* WS */
let ws = null;
let wsConnected = false;
let reconnectDelay = 1000;
let keepaliveTimer = null;

/* TradingView widget handle (optional) */
let tvWidget = null;

/* ---------- HELPERS ---------- */
function escapeId(s) { return s.replace(/[^\w]/g, '_'); }
function fmtPrice(x) { if (x === undefined || x === null) return '—'; return Number(x).toFixed(5).replace(/\.0+$|0+$/,'').replace(/\.$/,''); }
function fmtMoney(x) { return (x === undefined || x === null) ? '0.00' : Number(x).toFixed(2); }
function now(){ return new Date().toISOString(); }

/* ---------- UI BUILD ---------- */
const wlList = document.getElementById('wlList');
WATCHLIST.forEach(w => {
  const el = document.createElement('div'); el.className = 'wl-item';
  el.innerHTML = `<div><div style="font-weight:800">${w.label}</div><div class="small">${w.symbol}</div></div><div style="text-align:right"><div id="price_${escapeId(w.api)}" class="small">—</div></div>`;
  el.addEventListener('click', ()=> loadSymbol(w));
  wlList.appendChild(el);
});
const ordSymbol = document.getElementById('ordSymbol');
WATCHLIST.forEach(w => { const o=document.createElement('option'); o.value=w.api; o.text=w.label; ordSymbol.appendChild(o); });

/* ---------- TradingView ---------- */
function initTradingView(){
  try{ if(tvWidget && typeof tvWidget.remove === 'function'){ tvWidget.remove(); tvWidget=null; document.getElementById('tv_chart_container').innerHTML=''; } }catch(e){}
  if(typeof TradingView==='undefined'){ /* OK if not loaded */ return; }
  try{
    tvWidget = new TradingView.widget({
      container_id: 'tv_chart_container',
      autosize: true,
      symbol: currentSymbol.symbol,
      interval: '15',
      timezone: 'Etc/UTC',
      theme: 'dark',
      locale: 'fr'
    });
  }catch(e){ console.warn('TradingView init failed', e); }
}

/* load symbol into main view */
function loadSymbol(sym){
  currentSymbol = sym;
  document.getElementById('currentSymbolBadge').innerText = sym.symbol;
  document.getElementById('currentSymbolTitle').innerText = sym.label;
  const p = priceCache[sym.api];
  document.getElementById('currentPriceMini').innerText = 'Prix: ' + (p ? fmtPrice(p) : '—');
  initTradingView();
}

/* ---------- WS: connect / subscribe / ping / reconnect ---------- */
function setWsStatus(connected){
  const el = document.getElementById('wsStatus');
  wsConnected = !!connected;
  if(wsConnected){ el.className = 'status connected'; el.innerText = 'WS: Connected'; }
  else { el.className = 'status disconnected'; el.innerText = 'WS: Disconnected'; }
}

function buildWsUrl(){ return `${WS_ENDPOINT}?token=${API_KEY}`; }

function startKeepalive(){
  stopKeepalive();
  keepaliveTimer = setInterval(()=>{
    try{
      if(ws && ws.readyState === WebSocket.OPEN){
        // Finnhub accepts ping frames; sending JSON ping is okay but not necessary.
        // We'll send a simple JSON ping for visibility.
        ws.send(JSON.stringify({ type: 'ping' }));
      }
    }catch(e){ console.warn('keepalive send failed', e); }
  }, KEEPALIVE_INTERVAL);
}
function stopKeepalive(){ if(keepaliveTimer){ clearInterval(keepaliveTimer); keepaliveTimer=null; } }

function scheduleReconnect(){
  stopKeepalive();
  if(reconnectDelay > RECONNECT_MAX) reconnectDelay = RECONNECT_MAX;
  console.log(now(), `Reconnecting WS in ${reconnectDelay}ms`);
  setTimeout(()=>{ reconnectDelay = Math.min(RECONNECT_MAX, Math.floor(reconnectDelay * 1.8)); startWebSocket(); }, reconnectDelay);
}

function startWebSocket(){
  if(!USE_WS) return;
  try{
    const url = buildWsUrl();
    console.log(now(), 'Connecting to Finnhub WS ->', url);
    ws = new WebSocket(url);

    ws.addEventListener('open', ()=> {
      console.log(now(), 'WS OPEN');
      setWsStatus(true);
      reconnectDelay = 1000;
      // subscribe to all watchlist symbols
      WATCHLIST.forEach(w => {
        try { ws.send(JSON.stringify({ type: 'subscribe', symbol: w.api })); }
        catch(e){ console.warn('subscribe send failed', e); }
      });
      // request keepalive pings
      startKeepalive();
      // request an initial snapshot via REST for any missing prices
      WATCHLIST.forEach(async w => {
        if(priceCache[w.api] === undefined) {
          const p = await fetchPriceREST(w.api);
          if(p !== null) { priceCache[w.api]=p; updatePriceUI(w.api); }
        }
      });
    });

    ws.addEventListener('message', ev => {
      try{
        const msg = JSON.parse(ev.data);
        // handle different message types
        handleWsMessage(msg);
      }catch(e){ console.warn('WS parse error', e, ev.data); }
    });

    ws.addEventListener('close', evt => {
      console.warn(now(), 'WS CLOSED', evt.code, evt.reason);
      setWsStatus(false);
      scheduleReconnect();
    });

    ws.addEventListener('error', err => {
      console.error(now(), 'WS ERROR', err);
      setWsStatus(false);
      try{ ws.close(); }catch(e){}
      scheduleReconnect();
    });

  }catch(e){
    console.error(now(), 'startWebSocket exception', e);
    scheduleReconnect();
  }
}

/* ---------- WS message parsing ---------- */
function handleWsMessage(msg){
  if(!msg) return;
  // Finnhub shapes:
  // - Subscription acknowledgements: {"type":"ping"} or {"type":"error","msg":"..."}
  // - Trade data: {"type":"trade","data":[{ "s":"AAPL","p":261.74,"t":158264...}, ...]}
  // - Other messages: {"type":"bbo"...}
  if(Array.isArray(msg)) { msg.forEach(m => handleWsMessage(m)); return; }

  if(msg.type === 'ping') {
    // server ping; ignore
    return;
  }
  if(msg.type === 'error') {
    console.warn('WS error from server:', msg);
    return;
  }
  if(msg.type === 'trade' && Array.isArray(msg.data)) {
    msg.data.forEach(d => {
      const sym = d.s || d.symbol;
      const price = d.p || d.price;
      if(!sym || price === undefined) return;
      // Finnhub trade symbols often are e.g. "AAPL" or "OANDA:EUR_USD"
      const normalized = sym;
      priceCache[normalized] = Number(price);
      updatePriceUI(normalized);
      // update positions and orders
      updatePositionsForSymbol(normalized, Number(price));
      checkOrdersForSymbol(normalized);
      renderPositions(); renderTotals();
    });
    return;
  }
  // some messages could contain quote or other payloads
  if(msg.type && msg.data && typeof msg.data === 'object' && !Array.isArray(msg.data)) {
    // attempt to extract s/p
    const sym = msg.data.s || msg.data.symbol;
    const price = msg.data.p || msg.data.price || msg.data.c || null;
    if(sym && price !== null){
      const normalized = sym;
      priceCache[normalized] = Number(price);
      updatePriceUI(normalized);
      updatePositionsForSymbol(normalized, Number(price));
      checkOrdersForSymbol(normalized);
      renderPositions(); renderTotals();
    }
  }
}

/* ---------- REST fallback (one-shot) ---------- */
async function fetchPriceREST(symbolApi){
  // Finnhub REST quote endpoint: https://finnhub.io/api/v1/quote?symbol=AAPL&token=YOUR_TOKEN
  // For FX OANDA symbol may be "OANDA:EUR_USD" which Finnhub supports in quote endpoint as is.
  try{
    const url = `https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(symbolApi)}&token=${API_KEY}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const body = await res.json();
    // body.c is current price (close)
    if(body && body.c) return Number(body.c);
  }catch(e){}
  return null;
}

/* ---------- Price UI ---------- */
function updatePriceUI(normalizedApiSymbol){
  const el = document.getElementById('price_' + escapeId(normalizedApiSymbol));
  if(el) el.innerText = fmtPrice(priceCache[normalizedApiSymbol]);
  if(normalizedApiSymbol === currentSymbol.api) document.getElementById('currentPriceMini').innerText = 'Prix: ' + fmtPrice(priceCache[normalizedApiSymbol]);
}

/* ---------- Orders / Positions logic ---------- */
function computePnl(pos, currentPrice){
  const delta = (pos.side === 'BUY') ? (currentPrice - pos.entry) : (pos.entry - currentPrice);
  return Number(delta * pos.size);
}
function updatePositionsForSymbol(symbolApi, newPrice){
  let changed = false;
  positions.forEach(p => {
    if(p.symbol.api === symbolApi) {
      p.current = newPrice;
      p.pnl = computePnl(p, newPrice);
      changed = true;
    }
  });
  if(changed) { renderPositions(); renderTotals(); }
}

async function openPosition(symObj, side, size=1, entryPrice=null){
  let price = (entryPrice !== null) ? entryPrice : priceCache[symObj.api];
  if(price === undefined || price === null){
    const rest = await fetchPriceREST(symObj.api);
    if(rest !== null) price = rest;
  }
  if(price === undefined || price === null){
    alert('Prix non disponible pour ' + symObj.label);
    return;
  }
  const pos = { id: 'pos_' + Math.random().toString(36).slice(2,9), symbol: symObj, side, entry: price, size: Number(size), openAt: Date.now(), current: price, pnl: 0 };
  positions.push(pos);
  renderPositions(); renderTotals();
}

function closePosition(id){
  const idx = positions.findIndex(p => p.id === id); if(idx === -1) return;
  const pos = positions[idx];
  const closePrice = priceCache[pos.symbol.api] !== undefined ? priceCache[pos.symbol.api] : pos.current;
  const pnl = computePnl(pos, closePrice);
  history.unshift({ symbol: pos.symbol, side: pos.side, entry: pos.entry, close: closePrice, pnl, closedAt: Date.now() });
  simBalance += pnl;
  positions.splice(idx, 1);
  renderPositions(); renderHistory(); renderTotals();
}

/* Limit orders */
function addLimitOrder(symbolApi, side, price, size){
  orders.push({ id: 'ord_' + Math.random().toString(36).slice(2,9), symbol: symbolApi, side, price: Number(price), size: Number(size), placedAt: Date.now() });
  renderOrders();
}
function removeOrder(id){ orders = orders.filter(o => o.id !== id); renderOrders(); }
function checkOrdersForSymbol(symbolApi){
  const price = priceCache[symbolApi]; if(price === undefined) return;
  const toExec = orders.filter(o => o.symbol === symbolApi && ((o.side === 'BUY' && price <= o.price) || (o.side === 'SELL' && price >= o.price)));
  toExec.forEach(o => {
    const symObj = WATCHLIST.find(w => w.api === o.symbol) || { api: o.symbol, label: o.symbol, symbol: o.symbol };
    openPosition(symObj, o.side, o.size, o.price);
    removeOrder(o.id);
  });
}

/* ---------- Renderers ---------- */
function renderPositions(){
  const tbody = document.getElementById('positionsBody'); tbody.innerHTML = '';
  positions.forEach(pos => {
    const tr = document.createElement('tr');
    const cls = pos.pnl >= 0 ? 'positive' : 'negative';
    tr.innerHTML = `
      <td><strong>${pos.symbol.label}</strong><div class="small">${pos.symbol.symbol || pos.symbol.api}</div></td>
      <td>${pos.side}</td>
      <td>${fmtPrice(pos.entry)}</td>
      <td>${fmtPrice(pos.current)}</td>
      <td><span class="${cls}">${fmtMoney(pos.pnl)}</span></td>
      <td><button class="btn" onclick="closePosition('${pos.id}')">Close</button></td>
    `;
    tbody.appendChild(tr);
  });
  const details = document.getElementById('currentSymbolTitle');
  if(positions.length > 0) document.getElementById('posDetails')?.innerText = `${positions[0].symbol.label} · ${positions[0].side} · Entry ${fmtPrice(positions[0].entry)} · Current ${fmtPrice(positions[0].current)}`;
}

function renderHistory(){
  const tbody = document.getElementById('historyBody'); if(!tbody) return;
  tbody.innerHTML = '';
  history.forEach(h => {
    const tr = document.createElement('tr');
    const cls = h.pnl >= 0 ? 'positive' : 'negative';
    tr.innerHTML = `<td>${h.symbol.label}</td><td>${h.side}</td><td><span class="${cls}">${fmtMoney(h.pnl)}</span></td>`;
    tbody.appendChild(tr);
  });
}
function renderOrders(){
  const tbody = document.getElementById('ordersBody');
  tbody.innerHTML = '';
  orders.forEach(o => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${o.symbol}</td><td>${o.side}</td><td>${fmtPrice(o.price)}</td><td>${o.size}</td><td><button class="btn" onclick="removeOrder('${o.id}')">X</button></td>`;
    tbody.appendChild(tr);
  });
}
function renderTotals(){
  const totalPnl = positions.reduce((s,p) => s + computePnl(p, p.current), 0);
  document.getElementById('totalPnl').innerText = fmtMoney(totalPnl);
  document.getElementById('simBalance').innerText = fmtMoney(simBalance);
}

/* ---------- UI Handlers ---------- */
document.getElementById('addOrderBtn').addEventListener('click', ()=>{
  const sym = document.getElementById('ordSymbol').value;
  const side = document.getElementById('ordSide').value;
  const price = document.getElementById('ordPrice').value;
  const size = document.getElementById('ordSize').value || 1;
  if(!sym || !price) return alert('Remplis symbole et prix');
  addLimitOrder(sym, side, price, size);
});

document.getElementById('refreshBtn').addEventListener('click', ()=>{
  if(ws && ws.readyState === WebSocket.OPEN){
    // re-subscribe once to request snapshots if needed
    WATCHLIST.forEach(w => {
      try { ws.send(JSON.stringify({ type: 'subscribe', symbol: w.api })); } catch(e){ /* ignore */ }
    });
  } else {
    renderPositions(); renderOrders(); renderTotals();
  }
});

document.getElementById('buyBtn').addEventListener('click', async ()=> { await openPosition(currentSymbol, 'BUY', 1); });
document.getElementById('sellBtn').addEventListener('click', async ()=> { await openPosition(currentSymbol, 'SELL', 1); });

/* Expose removal/close for inline onclick */
window.removeOrder = removeOrder;
window.closePosition = closePosition;

/* ---------- INIT ---------- */
function init(){
  // populate ordSymbol already done
  initTradingView();
  renderPositions(); renderOrders(); renderHistory(); renderTotals();
  if(USE_WS) startWebSocket();
  // One-shot REST populate for initial UI
  WATCHLIST.forEach(async w => {
    if(priceCache[w.api] === undefined){
      const p = await fetchPriceREST(w.api);
      if(p !== null){ priceCache[w.api] = p; updatePriceUI(w.api); }
    }
  });
}
init();

/* ---------- Notes / Debug ----------
- Ouvrez la console (F12) si l'abonnement ne fonctionne : vous y verrez les messages WS entrants et potentiels messages d'erreur du serveur.
- Finnhub renvoie 'type':'trade' messages. On extrait 's' (symbol) et 'p' (price).
- Si un symbole ne fournit pas de trade messages (ex: certains indices), utilisez REST fallback ou changez le symbole vers une source disponible.
------------------------------------- */
</script>
</body>
</html>
