<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mini Broker — Live Trading</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        /* [Votre style CSS précédent reste identique] */
    </style>
</head>
<body>
<div class="app">
    <!-- [Votre structure HTML précédente reste identique] -->
</div>

<script>
// Configuration WebSocket & API
const WS_CONFIG = {
    API_KEY: 'c9140c9a72264e82bb9f5235b86b2806',
    ENDPOINT: 'wss://ws.twelvedata.com/v1/quotes',
    RECONNECT_DELAY_BASE: 1000,
    RECONNECT_DELAY_MAX: 30000
};

// Liste des symboles de trading
const TRADING_SYMBOLS = [
    {tv: 'OANDA:EURUSD', label: 'EUR / USD', api: 'EUR/USD'},
    {tv: 'OANDA:USDJPY', label: 'USD / JPY', api: 'USD/JPY'},
    {tv: 'OANDA:GBPUSD', label: 'GBP / USD', api: 'GBP/USD'},
    {tv: 'OANDA:XAUUSD', label: 'Gold', api: 'XAU/USD'}
];

class TradingApp {
    constructor() {
        this.state = {
            positions: [],
            priceCache: {},
            websocket: null,
            wsConnected: false,
            reconnectDelay: WS_CONFIG.RECONNECT_DELAY_BASE
        };

        this.initializeUI();
        this.startWebSocket();
    }

    initializeUI() {
        // Initialisation des écouteurs d'événements
        document.getElementById('buyBtn').addEventListener('click', () => this.handleTradeAction('BUY'));
        document.getElementById('sellBtn').addEventListener('click', () => this.handleTradeAction('SELL'));
    }

    startWebSocket() {
        const ws = new WebSocket(`${WS_CONFIG.ENDPOINT}?apikey=${WS_CONFIG.API_KEY}`);

        ws.onopen = () => {
            console.log('WebSocket connecté');
            this.state.wsConnected = true;
            this.subscribeToSymbols();
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                this.processWebSocketData(data);
            } catch (error) {
                console.error('Erreur de traitement WS:', error);
            }
        };

        ws.onclose = () => {
            console.log('WebSocket déconnecté');
            this.state.wsConnected = false;
            this.reconnectWebSocket();
        };

        this.state.websocket = ws;
    }

    subscribeToSymbols() {
        if (!this.state.websocket || this.state.websocket.readyState !== WebSocket.OPEN) return;

        const symbols = TRADING_SYMBOLS.map(s => s.api.replace('/', '')).join(',');
        const subscribeMessage = {
            action: 'subscribe',
            params: { symbols, channels: 'price' }
        };

        this.state.websocket.send(JSON.stringify(subscribeMessage));
    }

    processWebSocketData(data) {
        const payload = data.data?.[0] || data;
        const symbol = payload.s || payload.symbol;
        const price = payload.p || payload.price;

        if (!symbol || !price) return;

        const normalizedSymbol = this.normalizeSymbol(symbol);
        const numericPrice = Number(price);

        if (!isNaN(numericPrice)) {
            this.updatePriceCache(normalizedSymbol, numericPrice);
            this.updatePositionsPnL(normalizedSymbol, numericPrice);
        }
    }

    updatePriceCache(symbol, price) {
        this.state.priceCache[symbol] = price;
        this.updateWatchlistUI(symbol, price);
    }

    updateWatchlistUI(symbol, price) {
        const priceElement = document.getElementById(`price_${symbol.replace('/', '_')}`);
        if (priceElement) {
            priceElement.textContent = this.formatPrice(price);
        }
    }

    updatePositionsPnL(symbol, price) {
        const updatedPositions = this.state.positions.map(position => {
            if (position.symbol.api === symbol) {
                return {
                    ...position,
                    currentPrice: price,
                    pnl: this.calculatePnL(position, price)
                };
            }
            return position;
        });

        this.state.positions = updatedPositions;
        this.renderPositions();
    }

    handleTradeAction(side) {
        const symbol = TRADING_SYMBOLS.find(s => s.tv === document.getElementById('currentSymbolBadge').textContent);
        const price = this.state.priceCache[symbol.api];

        if (!price) {
            alert('Prix non disponible');
            return;
        }

        const newPosition = {
            id: `pos_${Date.now()}`,
            symbol,
            side,
            entryPrice: price,
            currentPrice: price,
            size: 1,
            pnl: 0
        };

        this.state.positions.push(newPosition);
        this.renderPositions();
    }

    calculatePnL(position, currentPrice) {
        const pnlMultiplier = position.side === 'BUY' ? 1 : -1;
        return (currentPrice - position.entryPrice) * pnlMultiplier * position.size;
    }

    renderPositions() {
        const positionsBody = document.getElementById('positionsBody');
        positionsBody.innerHTML = '';

        this.state.positions.forEach(position => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${position.symbol.label}</td>
                <td>${position.side}</td>
                <td>${this.formatPrice(position.entryPrice)}</td>
                <td>${this.formatPrice(position.currentPrice)}</td>
                <td>${this.formatMoney(position.pnl)}</td>
                <td>
                    <button onclick="tradingApp.closePosition('${position.id}')">Fermer</button>
                </td>
            `;
            positionsBody.appendChild(row);
        });
    }

    closePosition(positionId) {
        const index = this.state.positions.findIndex(p => p.id === positionId);
        if (index !== -1) {
            this.state.positions.splice(index, 1);
            this.renderPositions();
        }
    }

    reconnectWebSocket() {
        setTimeout(() => {
            this.state.reconnectDelay = Math.min(
                this.state.reconnectDelay * 2, 
                WS_CONFIG.RECONNECT_DELAY_MAX
            );
            this.startWebSocket();
        }, this.state.reconnectDelay);
    }

    normalizeSymbol(symbol) {
        symbol = symbol.toUpperCase();
        return symbol.includes('/') ? symbol : 
               symbol.length === 6 ? `${symbol.slice(0,3)}/${symbol.slice(3)}` : symbol;
    }

    formatPrice(price) {
        return price ? price.toFixed(4) : '—';
    }

    formatMoney(value) {
        return value ? value.toFixed(2) : '0.00';
    }
}

// Initialisation globale
const tradingApp = new TradingApp();
window.tradingApp = tradingApp;
</script>
</body>
</html>
