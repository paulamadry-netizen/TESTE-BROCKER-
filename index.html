<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmA Trading - Interface Moderne</title>

<!-- TradingView Widget -->
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
/* -------------------------------------------------
   🎨 THEME MODERNE / GLASS UI
--------------------------------------------------*/
:root {
    --bg-dark: #0d1117;
    --bg-panel: rgba(255,255,255,0.06);
    --bg-panel-hover: rgba(255,255,255,0.09);
    --primary: #3b82f6;
    --accent: #0ea5e9;
    --text: #e2e8f0;
    --border: rgba(255,255,255,0.08);
    --success: #10b981;
    --danger: #ef4444;
    --radius: 14px;
}

* {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: "Inter", sans-serif;
}

body {
    background: linear-gradient(135deg, #0d1117, #111827);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}


/* -------------------------------------------------
   HEADER
--------------------------------------------------*/

header {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
}

header h1 {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--primary);
}

.balance-box {
    background: rgba(255,255,255,0.07);
    padding: 10px 18px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    font-size: 1.2rem;
}


/* -------------------------------------------------
   LAYOUT
--------------------------------------------------*/

.main {
    display: flex;
    height: calc(100vh - 70px);
    gap: 12px;
    padding: 12px;
}

.left-panel {
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
}

.resizer {
    position: absolute;
    top: 0; right: 0;
    width: 8px;
    cursor: ew-resize;
}

.panel {
    background: var(--bg-panel);
    backdrop-filter: blur(14px);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.panel-title {
    padding: 12px 16px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
}

.panel-content {
    padding: 10px 15px;
    flex-grow: 1;
    overflow-y: auto;
}


/* -------------------------------------------------
   WATCHLIST
--------------------------------------------------*/

.asset-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    padding: 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: 0.15s;
}

.asset-row:hover {
    background: var(--bg-panel-hover);
}

.asset-row.selected {
    background: var(--primary);
    color: white;
    font-weight: bold;
}


/* -------------------------------------------------
   ORDER ENTRY
--------------------------------------------------*/

input, select {
    width: 100%;
    padding: 8px 10px;
    margin-top: 5px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
}

.order-btn {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    border: none;
    transition: 0.2s;
}

.buy { background: var(--success); color:white; }
.sell { background: var(--danger); color:white; }
.order-btn:hover { opacity: 0.9; }


/* -------------------------------------------------
   RIGHT PANEL / CHART
--------------------------------------------------*/

#chart-panel {
    flex-grow: 2;
}

#chart-container {
    width: 100%;
    height: 100%;
}

/* -------------------------------------------------
   TABS + TABLES
--------------------------------------------------*/

.tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
}

.tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    font-weight: 600;
}

.tab.active {
    background: var(--primary);
    color: white;
}

.tab-content {
    display: none;
    padding: 10px;
}

.tab-content.active {
    display: block;
}

.table {
    width: 100%;
    border-collapse: collapse;
}

.table th, .table td {
    border-bottom: 1px solid var(--border);
    padding: 8px;
}

.pnl-positive { color: var(--success); }
.pnl-negative { color: var(--danger); }

</style>
</head>

<body>

<header>
    <h1>AmA Trading</h1>
    <div class="balance-box">Solde : <span id="balance">$50 000.00</span></div>
</header>

<div class="main">

    <!-- LEFT PANEL -->
    <div class="left-panel" id="left-panel">
        <div class="resizer" id="resizer"></div>

        <!-- Watchlist -->
        <div class="panel" style="height: 45%;">
            <div class="panel-title">⭐ Watchlist</div>
            <div class="panel-content" id="watchlist"></div>
        </div>

        <!-- Order Entry -->
        <div class="panel" style="height: 55%;">
            <div class="panel-title">📊 Ordre : <span id="asset-title">EUR/USD</span></div>
            <div class="panel-content">
                
                <label>Type d’ordre</label>
                <select id="order-type">
                    <option value="market">Marché</option>
                    <option value="limit">Limite</option>
                </select>

                <label>Lots</label>
                <input type="number" id="lots" min="0.01" step="0.01" value="0.10">

                <div id="limit-box" style="display:none;">
                    <label>Prix Limite</label>
                    <input type="number" id="limit-price" step="0.00001">
                </div>

                <label>TP</label>
                <input type="number" id="tp" step="0.00001">

                <label>SL</label>
                <input type="number" id="sl" step="0.00001">

                <button class="order-btn buy" onclick="placeOrder('BUY')">Acheter</button>
                <button class="order-btn sell" onclick="placeOrder('SELL')">Vendre</button>

            </div>
        </div>

    </div>

    <!-- RIGHT PANEL -->
    <div class="panel" id="chart-panel">
        <div class="panel-title">📈 Graphique TradingView (<span id="chart-title">EUR/USD</span>)</div>
        <div id="chart-container"></div>
    </div>

</div>



<script>
/* ======================================================
   🔧 FIX TRADINGVIEW : VERSION 100% FONCTIONNELLE
======================================================*/

function loadChart(symbol) {
    document.getElementById("chart-container").innerHTML = "";

    const tvSymbol =
        symbol.includes("/") ? "FOREXCOM:" + symbol.replace("/", "") :
        symbol === "^GSPC" ? "SP:SPX" :
        symbol === "^DJI" ? "DJI" :
        symbol === "^IXIC" ? "NASDAQ:IXIC" :
        symbol === "XAU/USD" ? "FOREXCOM:XAUUSD" :
        symbol;

    new TradingView.widget({
        autosize: true,
        symbol: tvSymbol,
        interval: "60",
        timezone: "Europe/Paris",
        theme: "dark",
        style: "1",
        container_id: "chart-container",
        hide_side_toolbar: false,
        allow_symbol_change: false
    });
}


/* ======================================================
   WATCHLIST + PRIX
======================================================*/

const ASSETS = ["EUR/USD", "GBP/USD", "USD/JPY", "XAU/USD", "^GSPC", "^DJI"];

let quotes = {};

function renderWatchlist() {
    const wl = document.getElementById("watchlist");
    wl.innerHTML = "";

    ASSETS.forEach(s => {
        const row = document.createElement("div");
        row.className = "asset-row";
        row.innerHTML = `
            <span>${s}</span>
            <span>${quotes[s] ? quotes[s] : "---"}</span>
            <span>${quotes[s] ? (quotes[s] * 1.0001).toFixed(5) : "---"}</span>
        `;
        row.onclick = () => selectAsset(s);
        if (s === currentAsset) row.classList.add("selected");
        wl.appendChild(row);
    });
}


/* ======================================================
   SELECTION D’ASSET
======================================================*/

let currentAsset = "EUR/USD";

function selectAsset(sym) {
    currentAsset = sym;
    document.getElementById("asset-title").innerText = sym;
    document.getElementById("chart-title").innerText = sym;
    renderWatchlist();
    loadChart(sym);
}


/* ======================================================
   ORDRES (simples pour la démo)
======================================================*/

function placeOrder(type) {
    alert("Ordre " + type + " placé sur " + currentAsset);
}


/* ======================================================
   INIT
======================================================*/

document.getElementById("order-type").addEventListener("change", e => {
    document.getElementById("limit-box").style.display =
        e.target.value === "limit" ? "block" : "none";
});

selectAsset("EUR/USD"); // charge graphique

</script>

</body>
</html>
