<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Web Trader Demo — Indices & Forex</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #0b0e11;
        color: white;
        font-family: Inter, Arial, sans-serif;
    }

    #app {
        display: grid;
        grid-template-columns: 280px 1fr 380px;
        height: 100vh;
    }

    /* --- LEFT PANEL --- */
    #left {
        background: #111418;
        padding: 20px;
        border-right: 1px solid #222;
        overflow-y: auto;
    }

    h2 {
        margin-top: 0;
        font-size: 20px;
    }

    select, button {
        width: 100%;
        padding: 12px;
        border: none;
        background: #1a1f25;
        color: white;
        margin-bottom: 15px;
        border-radius: 8px;
        font-size: 16px;
    }

    button {
        background: #1c7dfd;
        cursor: pointer;
    }
    button:hover {
        background: #1464cc;
    }

    .sell {
        background: #d9534f;
    }
    .sell:hover {
        background: #b84743;
    }

    /* --- CENTER (TRADINGVIEW + PRICE) --- */
    #center {
        padding: 20px;
        position: relative;
    }

    #priceDisplay {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    /* --- RIGHT PANEL (POSITIONS) --- */
    #right {
        background: #111418;
        padding: 20px;
        border-left: 1px solid #222;
        overflow-y: auto;
    }

    .pos {
        padding: 12px;
        margin-bottom: 15px;
        background: #1a1f25;
        border-radius: 8px;
    }

    .green { color: #00d46a; }
    .red { color: #ff5555; }
</style>
</head>

<body>
<div id="app">

    <!-- LEFT PANEL -->
    <div id="left">
        <h2>Actif</h2>

        <select id="symbolSelect">
            <option value="SPY">S&P 500 (ETF)</option>
            <option value="QQQ">Nasdaq 100 (ETF)</option>
            <option value="DIA">Dow Jones (ETF)</option>

            <option disabled>──────────</option>

            <option value="EUR/USD">EUR/USD</option>
            <option value="GBP/USD">GBP/USD</option>
            <option value="USD/JPY">USD/JPY</option>
            <option value="USD/CAD">USD/CAD</option>
            <option value="AUD/USD">AUD/USD</option>
        </select>

        <button id="buyBtn">Acheter</button>
        <button class="sell" id="sellBtn">Vendre</button>
    </div>

    <!-- CENTER -->
    <div id="center">
        <div id="priceDisplay">--</div>
        <div id="tvChart" style="height: 80vh;"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="right">
        <h2>Positions ouvertes</h2>
        <div id="positions"></div>
    </div>

</div>

<script>
// ----------------------------------------------------------
// SETTINGS
// ----------------------------------------------------------
const TWELVE_KEY = "demo"; // ← Mets ta clé TwelveData

let lastPrice = 0;
let positions = [];
let currentSymbol = document.getElementById("symbolSelect").value;

function isForex(sym) {
    return sym.includes("/");
}

// ----------------------------------------------------------
// FETCH PRICE (ETFs + FOREX)
// ----------------------------------------------------------
async function fetchPrice(sym) {
    try {
        let url;

        if (isForex(sym)) {
            // FOREX Twelve Data format : EUR/USD → EURUSD
            const fx = sym.replace("/", "");
            url = `https://api.twelvedata.com/price?symbol=${fx}&apikey=${TWELVE_KEY}`;
        } else {
            // ETFs → SPY, QQQ, DIA (Twelve Data)
            url = `https://api.twelvedata.com/price?symbol=${sym}&apikey=${TWELVE_KEY}`;
        }

        const r = await fetch(url);
        const data = await r.json();

        if (!data.price) return null;
        return parseFloat(data.price);

    } catch (e) {
        console.error("Erreur prix :", e);
        return null;
    }
}

// ----------------------------------------------------------
// UPDATE PRICE
// ----------------------------------------------------------
async function updatePrice() {
    const price = await fetchPrice(currentSymbol);
    if (!price) return;

    lastPrice = price;
    document.getElementById("priceDisplay").innerText = price.toFixed(4);

    updatePnL();
}
setInterval(updatePrice, 1000);
updatePrice();

// ----------------------------------------------------------
// BUY / SELL
// ----------------------------------------------------------
function openPosition(type) {
    const pos = {
        symbol: currentSymbol,
        type,
        entry: lastPrice,
        size: 1,
        pnl: 0
    };
    positions.push(pos);
    renderPositions();
}

document.getElementById("buyBtn").onclick = () => openPosition("BUY");
document.getElementById("sellBtn").onclick = () => openPosition("SELL");

// ----------------------------------------------------------
// UPDATE POSITIONS PNL
// ----------------------------------------------------------
function updatePnL() {
    positions.forEach(p => {
        if (p.type === "BUY")
            p.pnl = (lastPrice - p.entry);
        else
            p.pnl = (p.entry - lastPrice);
    });
    renderPositions();
}

function renderPositions() {
    const box = document.getElementById("positions");
    box.innerHTML = "";

    positions.forEach(p => {
        const div = document.createElement("div");
        div.className = "pos";

        div.innerHTML = `
            <b>${p.symbol}</b><br>
            Type : ${p.type}<br>
            Entrée : ${p.entry}<br>
            PNL : <span class="${p.pnl>=0?"green":"red"}">${p.pnl.toFixed(4)}</span>
        `;
        box.appendChild(div);
    });
}

// ----------------------------------------------------------
// ON SYMBOL CHANGE
// ----------------------------------------------------------
document.getElementById("symbolSelect").onchange = e => {
    currentSymbol = e.target.value;
    loadTradingView(currentSymbol);
    updatePrice();
};

// ----------------------------------------------------------
// TRADINGVIEW LOADER
// ----------------------------------------------------------
function loadTradingView(sym) {
    document.getElementById("tvChart").innerHTML = "";

    let tvTicker = sym;

    if (isForex(sym)) {
        tvTicker = "FX:" + sym.replace("/", "");
    } else {
        tvTicker = "AMEX:" + sym;
    }

    new TradingView.widget({
        "container_id": "tvChart",
        "symbol": tvTicker,
        "interval": "5",
        "theme": "dark",
        "style": "1",
        "locale": "fr",
        "height": "100%",
    });
}
loadTradingView(currentSymbol);
</script>

<script src="https://s3.tradingview.com/tv.js"></script>
</body>
</html>
