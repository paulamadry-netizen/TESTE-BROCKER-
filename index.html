<script>
const SYMBOL_MAP = {
  SPX:{stooq:"^SPX",tv:"INDEX:SPX"},DJI:{stooq:"^DJI",tv:"INDEX:DJI"},NDX:{stooq:"^NDX",tv:"INDEX:NDX"},
  FTSE:{stooq:"^FTSE",tv:"INDEX:UKX"},DAX:{stooq:"^DAX",tv:"INDEX:DAX"},FCHI:{stooq:"^CAC",tv:"INDEX:FR40"},
  NKY:{stooq:"^NKY",tv:"INDEX:NKY"},EURUSD:{stooq:"EURUSD",tv:"FX:EURUSD"},GBPUSD:{stooq:"GBPUSD",tv:"FX:GBPUSD"},
  USDJPY:{stooq:"USDJPY",tv:"FX:USDJPY"},AUDUSD:{stooq:"AUDUSD",tv:"FX:AUDUSD"},USDCAD:{stooq:"USDCAD",tv:"FX:USDCAD"},
  GOLD:{stooq:"GC.F",tv:"TVC:GOLD"}
};

let positions = [];
let currentSymbol = "SPX";
let lastPrices = {}; // ➜ dictionnaire des prix en temps réel

// ----------------------------
// 📌 Fonction pour récupérer un prix Stooq
// ----------------------------
async function fetchStooqPrice(symbol){
  try{
    const url=`https://stooq.com/q/l/?s=${symbol}&f=sd2t2ohlcv&h&e=csv`;
    const res=await fetch(url);
    const text=await res.text();

    const line=text.split("\n")[1];
    if(!line) return null;

    const parts=line.split(",");
    const last=parseFloat(parts[6]);
    return isNaN(last)?null:last;

  }catch(err){
    return null;
  }
}

// ----------------------------
// 📌 Rafraîchissement des prix /s
// ----------------------------
async function refreshAllPrices(){

  // liste des symboles nécessaires
  const needed = new Set();
  needed.add(currentSymbol); // actif affiché
  positions.forEach(p => needed.add(p.symbol)); // actif des positions

  for(const sym of needed){
    const stooqSymbol = SYMBOL_MAP[sym].stooq;
    const price = await fetchStooqPrice(stooqSymbol);
    if(price) lastPrices[sym] = price;
  }

  // Mise à jour du prix affiché (seulement celui du symbole affiché)
  if(lastPrices[currentSymbol]){
    document.getElementById("priceDisplay").innerText =
      lastPrices[currentSymbol].toFixed(4);
  }

  updatePnL();
}

// lancer le refresh chaque seconde
setInterval(refreshAllPrices, 1000);
refreshAllPrices();

// ----------------------------
// 📌 Placer un ordre
// ----------------------------
async function placeOrder(side){
  const stooqSymbol = SYMBOL_MAP[currentSymbol].stooq;
  const price = await fetchStooqPrice(stooqSymbol);
  if(!price) return alert("Impossible de récupérer le prix.");

  const qty = parseInt(document.getElementById("lotInput").value)||1;

  const pos = {
    id: Date.now(),
    symbol: currentSymbol,
    side,
    qty,
    entry: price,
    pnl: 0
  };

  positions.push(pos);
  renderPositions();
}

// ----------------------------
// 📌 Fermer une position
// ----------------------------
function closePosition(id){
  positions = positions.filter(p => p.id !== id);
  renderPositions();
}

// ----------------------------
// 📌 Mise à jour PnL
// ----------------------------
function updatePnL(){
  let total = 0;

  positions.forEach(p => {
    const price = lastPrices[p.symbol];
    if(!price) return;

    const dir = p.side === "buy" ? 1 : -1;
    p.pnl = (price - p.entry) * dir * p.qty;
    total += p.pnl;
  });

  renderPositions(total);
}

// ----------------------------
// 📌 Affichage du tableau
// ----------------------------
function renderPositions(total = 0){
  const tbody = document.querySelector("#positionsTable tbody");
  tbody.innerHTML = "";

  positions.forEach(p => {
    const last = lastPrices[p.symbol] ?? null;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${p.symbol}</td>
      <td>${p.side}</td>
      <td>${p.qty}</td>
      <td>${p.entry.toFixed(4)}</td>
      <td>${last ? last.toFixed(4) : "—"}</td>
      <td style="color:${p.pnl>0?"#10b981":p.pnl<0?"#ef4444":"white"}">
        ${p.pnl.toFixed(4)}
      </td>
      <td>
        <button onclick="closePosition(${p.id})"
          style="background:#334155;color:white;border:0;padding:4px 8px;border-radius:6px;cursor:pointer;">
          ✖
        </button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  const t = document.getElementById("totalPnl");
  t.innerText = "PnL total : " + total.toFixed(4);
  t.style.color = total>0?"#10b981":total<0?"#ef4444":"#22d3ee";
}

// ----------------------------
// 📌 Changement d'actif
// ----------------------------
document.getElementById("symbolSelect").addEventListener("change", e => {
  currentSymbol = e.target.value;
  const tv = SYMBOL_MAP[currentSymbol].tv;

  document.getElementById("tradingviewIframe").src =
    `https://s.tradingview.com/widgetembed/?symbol=${encodeURIComponent(tv)}&interval=1&theme=dark&hide_side_toolbar=1`;

  refreshAllPrices();
});

// ----------------------------
// 📌 Fullscreen du chart
// ----------------------------
function toggleFullscreen(){
  document.getElementById("tradingviewIframe").classList.toggle("fullscreen");
}
</script>
