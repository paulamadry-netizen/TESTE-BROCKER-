<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Broker — Forex Live</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#9aa6bf;
      --accent:#2dd4bf;
      --danger:#ff6b6b;
      --glass: rgba(255,255,255,0.03);
      --glass-2: rgba(255,255,255,0.02);
      --text:#e6eef8;
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#071025 0%,#071427 100%);color:var(--text);}
    .app{display:flex;flex-direction:column;height:100vh;gap:12px;padding:14px;box-sizing:border-box;}
    .topbar{display:flex;align-items:center;justify-content:space-between;}
    .brand{display:flex;align-items:center;gap:10px;}
    .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#60a5fa);display:flex;align-items:center;justify-content:center;font-weight:700;color:#042;}
    .title{font-weight:600;font-size:18px;}
    .subtitle{font-size:13px;color:var(--muted);}
    .main{display:flex;gap:14px;flex:1;min-height:0;}
    .chart-area{flex:1.6;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:12px;padding:12px;box-shadow:0 6px 24px rgba(2,6,23,0.6);display:flex;flex-direction:column;}
    .side{width:320px;max-width:36%;background:var(--card);border-radius:12px;padding:12px;box-shadow:0 6px 20px rgba(2,6,23,0.6);display:flex;flex-direction:column;gap:10px;}
    .btn{padding:8px 12px;border-radius:8px;background:var(--glass);border:1px solid rgba(255,255,255,0.03);color:var(--text);cursor:pointer;font-weight:600;}
    .btn.buy{background:linear-gradient(90deg,#10b981,#34d399);color:#042;border:none;}
    .btn.sell{background:linear-gradient(90deg,#ef4444,#fb7185);color:white;border:none;}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.05);color:var(--muted);}
    #tv_chart_container{flex:1;min-height:380px;border-radius:10px;overflow:hidden;background:var(--glass-2);}
    .small-muted{color:var(--muted);font-size:13px;}
    .watchlist{display:flex;flex-direction:column;gap:8px;overflow:auto;}
    .watch-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px;cursor:pointer;transition:all .12s;}
    .watch-item:hover{transform:translateY(-3px);background:rgba(255,255,255,0.03);}
    .price-small{font-weight:600;}
    .tabs{display:flex;gap:8px;}
    .tab-btn{padding:8px 12px;border-radius:10px;cursor:pointer;background:transparent;color:var(--muted);border:1px solid transparent;font-weight:600;}
    .tab-btn.active{background:rgba(255,255,255,0.03);color:var(--text);border:1px solid rgba(255,255,255,0.05);}
    .panel{background:rgba(255,255,255,0.02);border-radius:10px;padding:10px;min-height:120px;overflow:auto;}
    .pos-row{display:flex;justify-content:space-between;align-items:center;padding:10px;margin-bottom:6px;border-radius:8px;background:rgba(255,255,255,0.02);}
    .pnl{font-weight:700;}
    @media(max-width:960px){.main{flex-direction:column;}.side{width:100%;}}
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">MB</div>
        <div>
          <div class="title">Mini Broker Forex</div>
          <div class="subtitle">Devises & Or en direct</div>
        </div>
      </div>
      <div class="controls">
        <div class="small-muted">Source : Twelve Data</div>
        <button class="btn ghost" id="refreshPrices">Rafraîchir</button>
      </div>
    </div>

    <div class="main">
      <div class="chart-area">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div>
            <div style="font-weight:700;" id="currentSymbol">EUR/USD</div>
            <div class="small-muted" id="currentPriceSmall">Prix : --</div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn buy" id="btnBuy">Acheter</button>
            <button class="btn sell" id="btnSell">Vendre</button>
          </div>
        </div>
        <div id="tv_chart_container"></div>

        <div style="margin-top:12px;">
          <div class="tabs">
            <div class="tab-btn active" data-tab="positions">Positions</div>
            <div class="tab-btn" data-tab="history">Historique</div>
          </div>
          <div class="panel" id="panelPositions">
            <div id="positionsList"><div class="small-muted">Aucune position ouverte.</div></div>
          </div>
          <div class="panel" id="panelHistory" style="display:none;">
            <div id="historyList"><div class="small-muted">Aucun historique.</div></div>
          </div>
        </div>
      </div>

      <aside class="side">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-weight:700;">Watchlist</div><div class="small-muted">Forex & Or</div></div>
          <div class="small-muted">Temps réel</div>
        </div>
        <div class="watchlist" id="watchlist"></div>
        <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;">
          <div class="small-muted">Dernière MAJ: <span id="lastUpdate">--</span></div>
          <button class="btn" id="btnRefreshWatch">Refresh</button>
        </div>

        <div style="margin-top:12px;font-weight:700;">Ordres Limites</div>
        <div id="limitOrdersList"><div class="small-muted">Aucun ordre limite.</div></div>
        <button class="btn" id="btnAddLimit">Ajouter Ordre Limite</button>
      </aside>
    </div>
  </div>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
const API_KEY='c9140c9a72264e82bb9f5235b86b2806';
const API_BASE='https://api.twelvedata.com';
const WATCHLIST=[
  {id:'EUR/USD',label:'EUR/USD'},
  {id:'USD/JPY',label:'USD/JPY'},
  {id:'GBP/USD',label:'GBP/USD'},
  {id:'AUD/USD',label:'AUD/USD'},
  {id:'USD/CAD',label:'USD/CAD'},
  {id:'USD/CHF',label:'USD/CHF'},
  {id:'NZD/USD',label:'NZD/USD'},
  {id:'XAU/USD',label:'Or (XAU/USD)'}
];
let currentSymbol='EUR/USD';
let tvWidget=null;
let lastPrices={};
let positions=[];
let history=[];
let limitOrders=[];
const fmt=(n,d=5)=>n==null?'--':Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const now=()=>new Date().toLocaleString('fr-FR');

function apiGetPrice(symbol){
  return fetch(`${API_BASE}/price?symbol=${encodeURIComponent(symbol)}&apikey=${API_KEY}`)
    .then(r=>r.json())
    .then(j=>{if(j&&j.price)return{price:Number(j.price),source:'twelvedata'};throw new Error('invalid');})
    .catch(()=>{const base=lastPrices[symbol]??1.1;const fake=base*(1+(Math.random()-0.5)*0.001);return{price:fake,source:'fallback'};});
}

function renderWatchlist(){
  const c=document.getElementById('watchlist');
  c.innerHTML='';
  WATCHLIST.forEach(w=>{
    const id=w.label.replace(/[^a-zA-Z0-9]/g,'_');
    const el=document.createElement('div');
    el.className='watch-item';
    el.innerHTML=`<div><div style="font-weight:700">${w.label}</div></div>
    <div style="text-align:right;">
      <div class="price-small" id="price_${id}">--</div>
      <div class="small-muted" id="src_${id}">--</div>
    </div>`;
    el.onclick=()=>setChartSymbol(w.id);
    c.appendChild(el);
  });
}

function renderLimitOrders(){
  const c=document.getElementById('limitOrdersList');
  if(!limitOrders.length)return c.innerHTML='<div class="small-muted">Aucun ordre limite.</div>';
  c.innerHTML='';
  limitOrders.forEach((o,i)=>{
    c.innerHTML+=`<div class="pos-row"><div>${o.symbol}
      <div class="small-muted">${o.side} @ ${fmt(o.price)}</div>
      <div class="small-muted">Qty:${o.qty}${o.sl?' / SL:'+fmt(o.sl):''}${o.tp?' / TP:'+fmt(o.tp):''}</div>
      </div><button class="btn ghost" onclick="cancelLimitOrder(${i})">Annuler</button></div>`;
  });
}

function addLimitOrder(){
  const side=prompt("Type d'ordre (BUY_LIMIT / SELL_LIMIT):",'BUY_LIMIT');
  if(!side)return;
  const price=Number(prompt("Prix cible:","1.1000"));
  if(!price)return;
  const qty=Number(prompt("Quantité:","1000"));
  if(!qty)return;
  const sl=Number(prompt("Stop Loss (vide si aucun):",""))||null;
  const tp=Number(prompt("Take Profit (vide si aucun):",""))||null;
  limitOrders.push({id:'limit_'+Date.now(),symbol:currentSymbol,side,price,qty,sl,tp});
  renderLimitOrders();
}
function cancelLimitOrder(i){limitOrders.splice(i,1);renderLimitOrders();}

function checkLimitOrders(){
  limitOrders.slice().forEach((o,i)=>{
    const cur=lastPrices[o.symbol];
    if(!cur)return;
    let exec=false;
    if(o.side==='BUY_LIMIT'&&cur<=o.price)exec=true;
    if(o.side==='SELL_LIMIT'&&cur>=o.price)exec=true;
    if(exec){
      const sideReal=o.side==='BUY_LIMIT'?'BUY':'SELL';
      openPosition({id:o.id,symbol:o.symbol,side:sideReal,qty:o.qty,entryPrice:o.price,sl:o.sl,tp:o.tp});
      limitOrders.splice(i,1);renderLimitOrders();
    }
  });
}

function computePnl(p,price){return(p.side==='BUY'?1:-1)*(price-p.entryPrice)*p.qty;}
function openPosition(o){positions.push(o);renderPositions();}
function closePosition(id){
  const p=positions.find(x=>x.id===id);if(!p)return;
  const cur=lastPrices[p.symbol]??p.entryPrice;
  const pnl=computePnl(p,cur);
  history.unshift({...p,exitPrice:cur,pnl});
  positions=positions.filter(x=>x.id!==id);
  renderPositions();renderHistory();
}

function renderPositions(){
  const l=document.getElementById('positionsList');
  if(!positions.length)return l.innerHTML='<div class="small-muted">Aucune position ouverte.</div>';
  l.innerHTML='';
  positions.forEach(p=>{
    const cur=lastPrices[p.symbol]??p.entryPrice;
    const pnl=computePnl(p,cur);
    l.innerHTML+=`<div class="pos-row">
      <div>${p.symbol}<div class="small-muted">Entrée ${fmt(p.entryPrice)} / Actuel ${fmt(cur)}</div>
      ${p.sl?'<div class="small-muted">SL:'+fmt(p.sl)+'</div>':''}
      ${p.tp?'<div class="small-muted">TP:'+fmt(p.tp)+'</div>':''}
      </div>
      <div style="text-align:right;">
        <div class="pnl" style="color:${pnl>=0?'#34d399':'#fb7185'}">${pnl>=0?'+':''}${fmt(pnl,2)}</div>
        <button class="btn ghost" onclick="closePosition('${p.id}')">Fermer</button>
      </div></div>`;
  });
}

function renderHistory(){
  const l=document.getElementById('historyList');
  if(!history.length)return l.innerHTML='<div class="small-muted">Aucun historique.</div>';
  l.innerHTML='';
  history.forEach(h=>{
    l.innerHTML+=`<div class="pos-row"><div>${h.symbol}<div class="small-muted">${fmt(h.entryPrice)}→${fmt(h.exitPrice)}</div></div>
    <div style="text-align:right;"><div class="pnl" style="color:${h.pnl>=0?'#34d399':'#fb7185'}">${h.pnl>=0?'+':''}${fmt(h.pnl,2)}</div><div>${h.side}</div></div></div>`;
  });
}

async function handleOrder(side){
  const qty=Number(prompt(`Ordre ${side} - ${currentSymbol}\nQuantité :`,'1000'));
  if(!qty)return;
  const sl=Number(prompt("Stop Loss (vide si aucun):",""))||null;
  const tp=Number(prompt("Take Profit (vide si aucun):",""))||null;
  const res=await apiGetPrice(currentSymbol);
  openPosition({id:'pos_'+Date.now(),symbol:currentSymbol,side,qty,entryPrice:res.price,sl,tp});
}

function initTradingView(sym){
  document.getElementById('tv_chart_container').innerHTML='';
  tvWidget=new TradingView.widget({
    autosize:true,
    symbol:sym,
    interval:"60",
    theme:"dark",
    locale:"fr",
    container_id:"tv_chart_container",
    enable_publishing:false
  });
  document.getElementById('currentSymbol').textContent=sym;
}

function setChartSymbol(sym){currentSymbol=sym;initTradingView(sym);}

async function refreshWatchPrices(){
  await Promise.all(WATCHLIST.map(async w=>{
    const res=await apiGetPrice(w.id);
    lastPrices[w.id]=res.price;
    const id=w.label.replace(/[^a-zA-Z0-9]/g,'_');
    document.getElementById('price_'+id).textContent=fmt(res.price,res.price>100?2:5);
    document.getElementById('src_'+id).textContent=res.source;
  }));
  document.getElementById('lastUpdate').textContent=now();
  if(lastPrices[currentSymbol]){
    document.getElementById('currentPriceSmall').textContent='Prix : '+fmt(lastPrices[currentSymbol]);
  }
  checkLimitOrders();
  positions.forEach(p=>{
    const cur=lastPrices[p.symbol];
    if(!cur)return;
    if(p.sl&&((p.side==='BUY'&&cur<=p.sl)||(p.side==='SELL'&&cur>=p.sl)))closePosition(p.id);
    if(p.tp&&((p.side==='BUY'&&cur>=p.tp)||(p.side==='SELL'&&cur<=p.tp)))closePosition(p.id);
  });
}

document.getElementById('btnBuy').onclick=()=>handleOrder('BUY');
document.getElementById('btnSell').onclick=()=>handleOrder('SELL');
document.getElementById('btnRefreshWatch').onclick=refreshWatchPrices;
document.getElementById('refreshPrices').onclick=refreshWatchPrices;
document.getElementById('btnAddLimit').onclick=addLimitOrder;
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('panelPositions').style.display=b.dataset.tab==='positions'?'block':'none';
  document.getElementById('panelHistory').style.display=b.dataset.tab==='history'?'block':'none';
});

async function boot(){
  renderWatchlist();
  initTradingView(currentSymbol);
  await refreshWatchPrices();
  renderPositions();
  renderHistory();
  renderLimitOrders();
  setInterval(refreshWatchPrices,10000);
}
window.closePosition=closePosition;
window.cancelLimitOrder=cancelLimitOrder;
boot();
  </script>
</body>
</html>
