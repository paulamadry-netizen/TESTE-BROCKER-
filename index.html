<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmA Trading (XTB config)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-dark: #121417;
            --bg-medium: #1c2025;
            --bg-light: #2c3138;
            --color-text: #e0e0e0;
            --color-text-light: #9aa0a6;
            --color-green: #00a859;
            --color-red: #ff3347;
            --color-primary: #3b82f6;
            --border-color: #3e444d;
            --font-family: 'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        .header {
            padding: 12px 20px;
            background-color: var(--bg-medium);
            border-bottom: 1px solid var(--border-color);
            font-size: 1.5em;
            font-weight: 700;
            color: var(--color-primary);
            text-align: center;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .left-panel {
            width: 300px;
            background-color: var(--bg-medium);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .balance-bar {
            padding: 15px;
            background-color: var(--bg-light);
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            color: var(--color-primary);
            text-align: center;
        }

        .watchlist-header {
            padding: 10px 15px;
            background-color: var(--bg-medium);
            font-weight: 700;
            font-size: 1em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
        }

        .watchlist {
            flex: 1;
            overflow-y: auto;
        }

        .asset-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--bg-medium);
            transition: background-color 0.15s;
        }

        .asset-item:hover, .asset-item.active {
            background-color: var(--bg-light);
            color: white;
        }

        .symbol {
            font-weight: 600;
        }

        .price {
            font-weight: 600;
            text-align: right;
            min-width: 80px;
        }

        .limit-order-panel {
            padding: 15px;
            background-color: var(--bg-medium);
            border-top: 1px solid var(--border-color);
        }

        .limit-order-panel h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.1em;
            text-align: center;
            color: var(--color-text);
            border-bottom: 2px solid var(--color-primary);
            padding-bottom: 6px;
        }

        .order-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85em;
            margin-bottom: 4px;
            color: var(--color-text-light);
            font-weight: 600;
        }

        .order-form input,
        .order-form select {
            padding: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-light);
            color: var(--color-text);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .order-form input:focus,
        .order-form select:focus {
            border-color: var(--color-primary);
        }

        .order-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 8px;
        }

        .order-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1em;
            transition: transform 0.1s, opacity 0.2s;
        }

        .buy-btn {
            background-color: var(--color-green);
            color: #fff;
        }

        .sell-btn {
            background-color: var(--color-red);
            color: #fff;
        }

        .buy-btn:hover,
        .sell-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .lot-info {
            grid-column: 1 / -1;
            text-align: center;
            padding: 8px;
            background-color: var(--bg-light);
            border-radius: 6px;
            margin-top: 8px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chart {
            flex: 1;
            background-color: black;
        }

        .bottom-tabs {
            background-color: var(--bg-medium);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 280px;
        }

        .tabs-header {
            display: flex;
            background-color: var(--bg-light);
        }

        .tab-button {
            padding: 12px 20px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--color-text-light);
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: border-color 0.2s, color 0.2s;
        }

        .tab-button.active {
            border-bottom-color: var(--color-primary);
            color: white;
        }

        .tabs-content {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead th {
            text-align: left;
            padding: 8px;
            color: var(--color-text-light);
            font-weight: 600;
        }

        tbody td {
            padding: 8px;
            border-top: 1px solid var(--border-color);
        }

        .pnl-positive {
            color: var(--color-green);
            font-weight: 700;
        }

        .pnl-negative {
            color: var(--color-red);
            font-weight: 700;
        }

        .action-button {
            padding: 5px 10px;
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.2s;
        }

        .action-button:hover {
            background-color: #3172d5;
        }

        /* Modal pour éditer la position */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: var(--bg-medium);
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            max-width: 90%;
        }

        .modal h4 {
            margin: 0 0 10px 0;
        }

        .modal .row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .modal input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-light);
            border-radius: 6px;
            color: var(--color-text);
        }

        .modal .modal-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--color-text);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .left-panel { width: 100%; height: 200px; order: 2; }
            .main { order: 1; }
            .bottom-tabs { height: 350px; }
        }

    </style>
</head>
<body>

    <div class="header">AmA Trading 🚀</div>

    <div class="container">
        <div class="left-panel">
            <div class="balance-bar">
                SOLDE DISPONIBLE : <span id="currentBalance">50 000.00 $</span>
            </div>
            <div class="watchlist-header">WATCHLIST</div>
            <div class="watchlist" id="watchlist"></div>
            <div class="limit-order-panel">
                <h3 id="order-panel-asset">Passer un ordre (EURUSD)</h3>
                <form id="orderForm" class="order-form" onsubmit="return false;">
                    <div class="form-group">
                        <label for="lotSize">Lots (volume)</label>
                        <input type="number" id="lotSize" value="1.0" min="0.01" step="0.01" required />
                    </div>
                    <div class="form-group">
                        <label for="orderType">Type d'ordre</label>
                        <select id="orderType">
                            <option value="market">Au marché</option>
                            <option value="limit">Limite</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="limitPrice">Prix limite (si limite)</label>
                        <input type="number" id="limitPrice" placeholder="Prix cible" disabled />
                    </div>
                    <div class="form-group">
                        <label for="stopLoss">Stop Loss (SL)</label>
                        <input type="number" id="stopLoss" placeholder="Prix SL (optionnel)" />
                    </div>
                    <div class="form-group">
                        <label for="takeProfit">Take Profit (TP)</label>
                        <input type="number" id="takeProfit" placeholder="Prix TP (optionnel)" />
                    </div>
                    <div id="lotInfo" class="lot-info">1.0 lot EURUSD ≈ …</div>
                    <div class="order-actions">
                        <button type="button" class="buy-btn" onclick="placeOrder('buy')">ACHETER</button>
                        <button type="button" class="sell-btn" onclick="placeOrder('sell')">VENDRE</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="main">
            <div class="chart">
                <iframe
                    id="tradingViewChart"
                    src="https://fr.tradingview.com/widgetembed/?symbol=FX_IDC%3AEURUSD&interval=60&theme=dark&style=1&locale=fr&toolbar_bg=%231c2025&enable_publishing=false&allow_symbol_change=true&container_id=tradingview_widget"
                    frameborder="0" allowfullscreen
                    style="width:100%; height:100%;"
                ></iframe>
            </div>

            <div class="bottom-tabs">
                <div class="tabs-header">
                    <button class="tab-button active" onclick="showTab('positions')">Positions (<span id="posCount">0</span>)</button>
                    <button class="tab-button" onclick="showTab('history')">Historique (<span id="histCount">0</span>)</button>
                </div>
                <div class="tabs-content">
                    <div id="positions" class="tab-pane active">
                        <table>
                            <thead>
                                <tr>
                                    <th>Actif</th>
                                    <th>Sens</th>
                                    <th>Lots</th>
                                    <th>Ouverture</th>
                                    <th>SL / TP</th>
                                    <th>PnL (USD)</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="activePositionsTable">
                                <tr><td colspan="7" style="text-align:center; color: var(--color-text-light);">Aucune position ouverte.</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="history" class="tab-pane">
                        <table>
                            <thead>
                                <tr>
                                    <th>Actif</th>
                                    <th>Sens</th>
                                    <th>Lots</th>
                                    <th>Ouverture</th>
                                    <th>Fermeture</th>
                                    <th>Résultat</th>
                                </tr>
                            </thead>
                            <tbody id="positionHistoryTable">
                                <tr><td colspan="6" style="text-align:center; color: var(--color-text-light);">Pas d’historique.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal pour modifier position -->
    <div id="modalBackdrop" class="modal-backdrop">
        <div class="modal">
            <h4 id="modalTitle">Modifier la position</h4>
            <div id="modalSub" style="font-size:13px; color: var(--color-text-light); margin-bottom: 10px;"></div>
            <div class="row">
                <div class="form-group">
                    <label>Stop Loss (SL)</label>
                    <input id="modalSL" type="number" placeholder="Prix SL" />
                </div>
                <div class="form-group">
                    <label>Take Profit (TP)</label>
                    <input id="modalTP" type="number" placeholder="Prix TP" />
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Lots (réduire / vendre partiellement)</label>
                    <input id="modalLots" type="number" step="0.01" placeholder="Ex: 0.5" />
                </div>
            </div>
            <div class="modal-actions">
                <button class="action-button" onclick="saveModal()">Enregistrer</button>
                <button class="btn-ghost" onclick="closeModal()">Annuler</button>
                <button class="btn-ghost" style="margin-left:auto;" onclick="closePositionFromModal()">Fermer/Vendre</button>
            </div>
        </div>
    </div>

    <script>
    // ====== Configuration des actifs selon XTB ======
    const ASSETS = {
        'EURUSD': { group: 'Forex', tv_symbol: 'FX_IDC:EURUSD', lot_notional: 100000, pip_size: 0.0001, current_price: 1.0750 },
        'GBPUSD': { group: 'Forex', tv_symbol: 'FX_IDC:GBPUSD', lot_notional: 100000, pip_size: 0.0001, current_price: 1.2500 },
        'USDJPY': { group: 'Forex', tv_symbol: 'FX_IDC:USDJPY', lot_notional: 100000, pip_size: 0.01, current_price: 150.00 },
        'AUDUSD': { group: 'Forex', tv_symbol: 'FX_IDC:AUDUSD', lot_notional: 100000, pip_size: 0.0001, current_price: 0.6500 },
        'USDCAD': { group: 'Forex', tv_symbol: 'FX_IDC:USDCAD', lot_notional: 100000, pip_size: 0.0001, current_price: 1.3500 },
        'US100': { group: 'Index', tv_symbol: 'NASDAQ:NDX', lot_notional: 25, pip_size: 1, current_price: 17500.00 }, // d’après XTB spec table : multiplier 25 pour DE30 -> logique similaire pour indices (source Spec PDF) :contentReference[oaicite:0]{index=0}  
        'US30': { group: 'Index', tv_symbol: 'DOWJONES:DJI', lot_notional: 10, pip_size: 1, current_price: 38000.00 },
        'DE40': { group: 'Index', tv_symbol: 'XETR:DAX', lot_notional: 25, pip_size: 1, current_price: 18000.00 }, // 25 selon spec XTB :contentReference[oaicite:1]{index=1}  
        'UK100': { group: 'Index', tv_symbol: 'LSE:UKX', lot_notional: 10, pip_size: 1, current_price: 7800.00 },
        'FR40': { group: 'Index', tv_symbol: 'EURONEXT:PX1', lot_notional: 10, pip_size: 1, current_price: 8000.00 },
        'XAUUSD': { group: 'Metal', tv_symbol: 'TVC:GOLD', lot_notional: 100, pip_size: 0.01, current_price: 2000.00 }, // XTB : 1 lot = 100 oz (cf doc XTB ressources CFD) :contentReference[oaicite:2]{index=2}  
    };

    const TV_BASE = "https://fr.tradingview.com/widgetembed/?interval=60&theme=dark&style=1&locale=fr&toolbar_bg=%231c2025&enable_publishing=false&allow_symbol_change=true&container_id=tradingview_widget&symbol=";

    let currentAsset = 'EURUSD';
    let balance = 50000;
    let positions = [];
    let history = [];
    let positionId = 1;

    const DOM = {
        balance: document.getElementById('currentBalance'),
        watchlist: document.getElementById('watchlist'),
        chart: document.getElementById('tradingViewChart'),
        orderAsset: document.getElementById('order-panel-asset'),
        lotInfo: document.getElementById('lotInfo'),
        lotSize: document.getElementById('lotSize'),
        orderType: document.getElementById('orderType'),
        limitPrice: document.getElementById('limitPrice'),
        stopLoss: document.getElementById('stopLoss'),
        takeProfit: document.getElementById('takeProfit'),
        posTable: document.getElementById('activePositionsTable'),
        histTable: document.getElementById('positionHistoryTable'),
        posCount: document.getElementById('posCount'),
        histCount: document.getElementById('histCount'),
        modalBackdrop: document.getElementById('modalBackdrop'),
        modalTitle: document.getElementById('modalTitle'),
        modalSub: document.getElementById('modalSub'),
        modalSL: document.getElementById('modalSL'),
        modalTP: document.getElementById('modalTP'),
        modalLots: document.getElementById('modalLots'),
    };

    function updateBalanceDisplay() {
        DOM.balance.textContent = balance.toFixed(2) + ' $';
    }

    function renderWatchlist() {
        DOM.watchlist.innerHTML = '';
        for (const sym in ASSETS) {
            const asset = ASSETS[sym];
            const decimals = (asset.group === 'Index' || asset.group === 'Metal') ? 2 : 5;
            const div = document.createElement('div');
            div.className = 'asset-item' + (sym === currentAsset ? ' active' : '');
            div.dataset.symbol = sym;
            div.onclick = () => selectAsset(sym);
            div.innerHTML = `<span class="symbol">${sym}</span><span class="price" id="price-${sym}">${asset.current_price.toFixed(decimals)}</span>`;
            DOM.watchlist.appendChild(div);
        }

        setInterval(updatePrices, 3000);
    }

    function updatePrices() {
        for (const sym in ASSETS) {
            const asset = ASSETS[sym];
            // petite simulation de fluctuation
            let fluct = (Math.random() - 0.5) * (asset.group === 'Index' ? 5 : 0.001);
            asset.current_price = Math.max(asset.current_price + fluct, 0);
            const el = document.getElementById(`price-${sym}`);
            if (el) {
                const old = parseFloat(el.getAttribute('data-old') || asset.current_price);
                const decimals = (asset.group === 'Index' || asset.group === 'Metal') ? 2 : 5;
                el.textContent = asset.current_price.toFixed(decimals);
                if (asset.current_price > old) el.style.color = 'var(--color-green)';
                else if (asset.current_price < old) el.style.color = 'var(--color-red)';
                el.setAttribute('data-old', asset.current_price);
            }
        }
    }

    function selectAsset(sym) {
        currentAsset = sym;
        const asset = ASSETS[sym];
        DOM.chart.src = TV_BASE + asset.tv_symbol;
        document.querySelectorAll('.asset-item').forEach(el => el.classList.remove('active'));
        document.querySelector(`.asset-item[data-symbol="${sym}"]`).classList.add('active');
        DOM.orderAsset.textContent = `Passer un ordre (${sym})`;
        DOM.lotInfo.textContent = `1.0 lot ${sym} ≈ ${asset.lot_notional.toLocaleString('fr-FR')} unités (notionnel)`;
    }

    DOM.orderType.addEventListener('change', (e) => {
        if (e.target.value === 'limit') {
            DOM.limitPrice.disabled = false;
        } else {
            DOM.limitPrice.disabled = true;
            DOM.limitPrice.value = '';
        }
    });

    function placeOrder(direction) {
        const sym = currentAsset;
        const asset = ASSETS[sym];
        const lots = parseFloat(DOM.lotSize.value);
        const orderType = DOM.orderType.value;
        const limit = parseFloat(DOM.limitPrice.value);
        const sl = parseFloat(DOM.stopLoss.value);
        const tp = parseFloat(DOM.takeProfit.value);

        if (isNaN(lots) || lots <= 0) {
            alert("Volume invalide");
            return;
        }

        const notional = lots * asset.lot_notional;
        if (notional > balance) {
            alert(`Marge insuffisante : exposition ${notional.toFixed(2)} > solde ${balance.toFixed(2)}`);
            return;
        }

        const price = asset.current_price;

        if (orderType === 'market') {
            const pos = {
                id: positionId++,
                symbol: sym,
                direction,
                lots,
                openPrice: price,
                sl: isNaN(sl) ? null : sl,
                tp: isNaN(tp) ? null : tp,
                pnl: 0
            };
            positions.push(pos);
            updatePositions();
        } else {
            if (isNaN(limit) || limit <= 0) {
                alert("Prix limite invalide");
                return;
            }
            alert(`Ordre limite en ${direction} ${lots} lots sur ${sym} à ${limit}`);
            // Pour la simulation, on ne l'exécute pas automatiquement
        }
    }

    function updatePositions() {
        const tbody = DOM.posTable;
        tbody.innerHTML = '';
        if (positions.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color: var(--color-text-light);">Aucune position ouverte.</td></tr>`;
        } else {
            for (const pos of positions) {
                const asset = ASSETS[pos.symbol];
                const current = asset.current_price;
                // Calcul PnL simplifié
                const change = pos.direction === 'buy' ? current - pos.openPrice : pos.openPrice - current;
                const pips = change / asset.pip_size;
                const pnl = pips * (asset.lot_notional * asset.pip_size) * pos.lots;
                pos.pnl = pnl;

                const sl = pos.sl !== null ? pos.sl : '-';
                const tp = pos.tp !== null ? pos.tp : '-';

                const tr = document.createElement('tr');
                tr.onclick = () => openEditModal(pos.id);
                tr.innerHTML = `
                    <td>${pos.symbol}</td>
                    <td style="color:${pos.direction === 'buy' ? 'var(--color-green)' : 'var(--color-red)'}; font-weight:600;">${pos.direction.toUpperCase()}</td>
                    <td>${pos.lots.toFixed(2)}</td>
                    <td>${pos.openPrice.toFixed( (asset.group === 'Index' || asset.group === 'Metal') ? 2 : 5 )}</td>
                    <td>SL: ${sl} / TP: ${tp}</td>
                    <td class="${pos.pnl >= 0 ? 'pnl-positive' : 'pnl-negative'}">${pos.pnl.toFixed(2)} $</td>
                    <td><button class="action-button" onclick="event.stopPropagation(); closePosition(${pos.id})">Fermer</button></td>
                `;
                tbody.appendChild(tr);
            }
        }
        DOM.posCount.textContent = positions.length;
    }

    function updateHistory() {
        const tbody = DOM.histTable;
        tbody.innerHTML = '';
        if (history.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--color-text-light);">Pas d’historique.</td></tr>`;
        } else {
            for (const h of history) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${h.symbol}</td>
                    <td style="color:${h.direction === 'buy' ? 'var(--color-green)' : 'var(--color-red)'}; font-weight:600;">${h.direction.toUpperCase()}</td>
                    <td>${h.lots.toFixed(2)}</td>
                    <td>${h.openPrice.toFixed(5)}</td>
                    <td>${h.closePrice.toFixed(5)}</td>
                    <td class="${h.result >= 0 ? 'pnl-positive' : 'pnl-negative'}">${h.result.toFixed(2)} $</td>
                `;
                tbody.appendChild(tr);
            }
        }
        DOM.histCount.textContent = history.length;
    }

    function showTab(id) {
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.querySelector(`.tab-button[onclick="showTab('${id}')"]`).classList.add('active');
        document.getElementById(id).classList.add('active');
    }

    // Modal
    let editingId = null;
    function openEditModal(id) {
        const pos = positions.find(p => p.id === id);
        if (!pos) return;
        editingId = id;
        DOM.modalTitle.textContent = `Position #${id} (${pos.symbol})`;
        DOM.modalSub.textContent = `${pos.direction.toUpperCase()} • ${pos.lots.toFixed(2)} lots • Ouverture à ${pos.openPrice}`;
        DOM.modalSL.value = pos.sl !== null ? pos.sl : '';
        DOM.modalTP.value = pos.tp !== null ? pos.tp : '';
        DOM.modalLots.value = '';
        DOM.modalBackdrop.style.display = 'flex';
    }

    function closeModal() {
        DOM.modalBackdrop.style.display = 'none';
        editingId = null;
    }

    function saveModal() {
        if (editingId === null) return;
        const pos = positions.find(p => p.id === editingId);
        if (!pos) return;
        const newSL = parseFloat(DOM.modalSL.value);
        const newTP = parseFloat(DOM.modalTP.value);
        const newLots = parseFloat(DOM.modalLots.value);

        pos.sl = isNaN(newSL) ? pos.sl : newSL;
        pos.tp = isNaN(newTP) ? pos.tp : newTP;

        if (!isNaN(newLots) && newLots > 0 && newLots < pos.lots) {
            // close partiellement
            const fraction = (pos.lots - newLots) / pos.lots;
            const pnlPart = pos.pnl * fraction;
            // on crédite le PnL partiel
            balance += pnlPart;
            history.push({
                symbol: pos.symbol,
                direction: pos.direction,
                lots: pos.lots - newLots,
                openPrice: pos.openPrice,
                closePrice: ASSETS[pos.symbol].current_price,
                result: pnlPart
            });
            pos.lots = newLots;
        }

        updatePositions();
        updateHistory();
        updateBalanceDisplay();
        closeModal();
    }

    function closePosition(id) {
        const idx = positions.findIndex(p => p.id === id);
        if (idx === -1) return;
        const pos = positions[idx];
        // calcul PnL
        const asset = ASSETS[pos.symbol];
        const current = asset.current_price;
        const change = pos.direction === 'buy' ? current - pos.openPrice : pos.openPrice - current;
        const pips = change / asset.pip_size;
        const pnl = pips * (asset.lot_notional * asset.pip_size) * pos.lots;

        positions.splice(idx, 1);
        history.push({
            symbol: pos.symbol,
            direction: pos.direction,
            lots: pos.lots,
            openPrice: pos.openPrice,
            closePrice: current,
            result: pnl
        });
        balance += pnl;

        updatePositions();
        updateHistory();
        updateBalanceDisplay();
    }

    // Init
    function init() {
        renderWatchlist();
        selectAsset(currentAsset);
        updateBalanceDisplay();
        updatePositions();
        updateHistory();
    }

    init();
    </script>

</body>
