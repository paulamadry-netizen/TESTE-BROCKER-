<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Broker Pro Firm - Trading Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* CSS */
        :root {
            --bg-dark: #1e2126;
            --bg-medium: #2a2e35;
            --bg-light: #3a3f47;
            --color-text: #e0e0e0;
            --color-green: #00a859;
            --color-red: #ff3347;
            --color-primary: #1e88e5;
            --border-color: #444;
            --font-family: 'Roboto', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        /* --- LAYOUT GRID --- */
        .container {
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: 1fr auto; /* Row 1: Main Content, Row 2: Tabs */
            width: 100%;
            height: 100%;
        }

        .left-panel {
            grid-area: 1 / 1 / 3 / 2; /* Full height on the left */
            display: flex;
            flex-direction: column;
            background-color: var(--bg-medium);
            border-right: 1px solid var(--border-color);
        }

        .main-chart {
            grid-area: 1 / 2 / 2 / 3;
            background-color: black;
        }

        .bottom-tabs {
            grid-area: 2 / 2 / 3 / 3;
            background-color: var(--bg-medium);
            border-top: 1px solid var(--border-color);
            height: 250px;
        }

        /* --- WATCHLIST --- */
        .watchlist-header {
            padding: 10px;
            background-color: var(--bg-light);
            font-weight: bold;
            font-size: 1.1em;
            text-align: center;
        }

        .watchlist {
            flex-grow: 1;
            overflow-y: auto;
            border-bottom: 1px solid var(--border-color);
        }

        .asset-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--bg-light);
            transition: background-color 0.2s;
        }

        .asset-item:hover, .asset-item.active {
            background-color: var(--bg-light);
        }

        .asset-item .symbol {
            font-weight: bold;
        }

        .asset-item .price {
            color: var(--color-green); /* Simulating price change */
        }

        /* --- LIMIT ORDER TABLE --- */
        .limit-order-panel {
            padding: 15px;
            background-color: var(--bg-medium);
            border-top: 1px solid var(--border-color);
        }

        .limit-order-panel h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1em;
            text-transform: uppercase;
            color: var(--color-primary);
        }

        .order-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .order-form input, .order-form select {
            padding: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-light);
            color: var(--color-text);
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .order-form button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .order-form button:hover {
            opacity: 0.9;
        }

        .buy-btn {
            background-color: var(--color-green);
        }

        .sell-btn {
            background-color: var(--color-red);
        }

        .lot-info {
            grid-column: span 2;
            text-align: center;
            padding: 8px 0;
            background-color: var(--bg-light);
            border-radius: 4px;
            margin-top: 5px;
        }
        
        /* --- BOTTOM TABS (POSITIONS/HISTORY) --- */
        .tabs-header {
            display: flex;
            background-color: var(--bg-light);
            border-bottom: 1px solid var(--border-color);
        }

        .tab-button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background-color: transparent;
            color: var(--color-text);
            font-weight: bold;
            border-bottom: 3px solid transparent;
            transition: border-bottom 0.2s;
        }

        .tab-button.active {
            border-bottom-color: var(--color-primary);
            color: var(--color-primary);
        }

        .tabs-content {
            padding: 15px;
            overflow-y: auto;
            height: calc(100% - 40px); /* Adjust height based on header */
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        /* --- TABLE STYLES --- */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th, .data-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            background-color: var(--bg-light);
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .pnl-positive { color: var(--color-green); font-weight: bold; }
        .pnl-negative { color: var(--color-red); font-weight: bold; }
        .action-button {
            padding: 5px 10px;
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }

        /* --- BALANCE INFO --- */
        .balance-bar {
            padding: 10px 15px;
            background-color: var(--bg-light);
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            border-top: 1px solid var(--border-color);
        }

        .balance-bar span {
            color: var(--color-green);
        }
    </style>
</head>
<body>

    <audio id="orderTakenSound" src="[Placeholder for Order Taken Sound - E.g., a short 'ding']" preload="auto"></audio>
    <audio id="orderRejectedSound" src="[Placeholder for Order Rejected Sound - E.g., a short 'buzz']" preload="auto"></audio>

    <div class="container">
        
        <div class="left-panel">
            <div class="balance-bar">
                SOLDE DISPONIBLE: <span id="currentBalance">50,000.00 $</span>
            </div>

            <div class="watchlist-header">
                WATCHLIST
            </div>
            <div class="watchlist" id="watchlist">
                </div>

            <div class="limit-order-panel">
                <h3 id="order-panel-asset">Prendre un Ordre (EURUSD)</h3>
                
                <form id="orderForm" class="order-form">
                    <input type="number" id="lotSize" value="1" min="0.1" step="0.1" required>
                    <select id="orderType" required>
                        <option value="market">Au Marché</option>
                        <option value="limit">Ordre Limite</option>
                    </select>

                    <input type="number" id="limitPrice" placeholder="Prix Limite (si Limit)" disabled>
                    <input type="number" id="stopLoss" placeholder="Stop Loss (Optionnel)">
                    <input type="number" id="takeProfit" placeholder="Take Profit (Optionnel)">
                    <div id="lotInfo" class="lot-info">1 Lot sur EURUSD ≈ 100,000 $</div>

                    <button type="button" class="buy-btn" onclick="placeOrder('buy')">ACHETER</button>
                    <button type="button" class="sell-btn" onclick="placeOrder('sell')">VENDRE</button>
                </form>
            </div>
        </div>

        <div class="main-chart">
            <iframe id="tradingViewChart"
                src="https://fr.tradingview.com/widgetembed/?symbol=FX_IDC%3AEURUSD&interval=60&theme=dark&style=1&locale=fr&toolbar_bg=%23f1f3f6&enable_publishing=false&allow_symbol_change=true&container_id=tradingview_widget"
                frameborder="0"
                allowfullscreen
                style="width: 100%; height: 100%;">
            </iframe>
        </div>

        <div class="bottom-tabs">
            <div class="tabs-header">
                <button class="tab-button active" onclick="showTab('positions')">Positions (0)</button>
                <button class="tab-button" onclick="showTab('history')">Historique de Position (0)</button>
            </div>
            
            <div class="tabs-content">
                <div id="positions" class="tab-pane active">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Actif</th>
                                <th>Sens</th>
                                <th>Lots</th>
                                <th>Ouverture</th>
                                <th>Stop Loss</th>
                                <th>Take Profit</th>
                                <th>PnL (USD)</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="activePositionsTable">
                            <tr><td colspan="8" style="text-align: center;">Aucune position ouverte.</td></tr>
                        </tbody>
                    </table>
                </div>

                <div id="history" class="tab-pane">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Actif</th>
                                <th>Sens</th>
                                <th>Lots</th>
                                <th>Ouverture</th>
                                <th>Fermeture</th>
                                <th>Résultat</th>
                            </tr>
                        </thead>
                        <tbody id="positionHistoryTable">
                            <tr><td colspan="6" style="text-align: center;">Aucun historique de position.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // JAVASCRIPT

        // ----------------------------------------------------
        // --- CONFIGURATION & DATA SIMULATION ---
        // ----------------------------------------------------
        const ASSETS = {
            'EURUSD': { group: 'Forex', tv_symbol: 'FX_IDC:EURUSD', lot_value_usd: 100000, market_coherence: 1.0, current_price: 1.0750 },
            'GBPUSD': { group: 'Forex', tv_symbol: 'FX_IDC:GBPUSD', lot_value_usd: 100000, market_coherence: 1.2, current_price: 1.2500 },
            'USDJPY': { group: 'Forex', tv_symbol: 'FX_IDC:USDJPY', lot_value_usd: 100000, market_coherence: 0.9, current_price: 150.00 },
            'AUDUSD': { group: 'Forex', tv_symbol: 'FX_IDC:AUDUSD', lot_value_usd: 100000, market_coherence: 0.8, current_price: 0.6500 },
            'USDCAD': { group: 'Forex', tv_symbol: 'FX_IDC:USDCAD', lot_value_usd: 100000, market_coherence: 1.1, current_price: 1.3500 },
            'US100':  { group: 'Index', tv_symbol: 'NASDAQ:NDX', lot_value_usd: 20, market_coherence: 20.0, current_price: 17500.00 }, // Mini lot value approx.
            'US30':   { group: 'Index', tv_symbol: 'DOWJONES:DJI', lot_value_usd: 10, market_coherence: 15.0, current_price: 38000.00 },
            'DE40':   { group: 'Index', tv_symbol: 'XETR:DAX', lot_value_usd: 25, market_coherence: 18.0, current_price: 18000.00 },
            'UK100':  { group: 'Index', tv_symbol: 'LSE:UKX', lot_value_usd: 50, market_coherence: 10.0, current_price: 7800.00 },
            'FR40':   { group: 'Index', tv_symbol: 'EURONEXT:PX1', lot_value_usd: 10, market_coherence: 12.0, current_price: 8000.00 },
            'XAUUSD': { group: 'Metal', tv_symbol: 'TVC:GOLD', lot_value_usd: 100000, market_coherence: 1.0, current_price: 2000.00 } // GOLD
        };

        const TV_BASE_URL = "https://fr.tradingview.com/widgetembed/?interval=60&theme=dark&style=1&locale=fr&toolbar_bg=%23f1f3f6&enable_publishing=false&allow_symbol_change=true&container_id=tradingview_widget&symbol=";
        
        // J'utilise une clé API bidon ici. L'API KEY NE DOIT JAMAIS ÊTRE EXPOSÉE CÔTÉ CLIENT.
        const API_KEY_SIMULATION = '1fc6cd30be484552ad303afda1087501'; 
        
        let currentAsset = 'EURUSD';
        let balance = 50000.00;
        let positions = [];
        let history = [];
        let positionIdCounter = 1;
        let pnlInterval;

        // ----------------------------------------------------
        // --- UTILITY FUNCTIONS ---
        // ----------------------------------------------------

        function updateBalance(amount) {
            balance += amount;
            document.getElementById('currentBalance').textContent = balance.toFixed(2) + ' $';
        }

        function playSound(type) {
            const soundElement = document.getElementById(type === 'taken' ? 'orderTakenSound' : 'orderRejectedSound');
            if (soundElement) {
                // Pour que ça marche, il faut des fichiers audio valides. Ici, on simule l'action.
                console.log(`Playing sound: ${type}`);
                // soundElement.play().catch(e => console.error("Audio playback error:", e));
            }
        }

        // Simule le prix actuel (remplace l'appel API)
        function fetchCurrentPrice(symbol) {
            // Dans un vrai scénario, cela appellerait TwelveData ou IG Markets.
            // Ici, on simule une petite fluctuation aléatoire autour du prix de base.
            const basePrice = ASSETS[symbol].current_price;
            const fluctuation = (Math.random() - 0.5) * 0.001 * ASSETS[symbol].market_coherence; 
            return basePrice + fluctuation;
        }

        // ----------------------------------------------------
        // --- WATCHLIST & CHART LOGIC ---
        // ----------------------------------------------------

        function renderWatchlist() {
            const watchlistEl = document.getElementById('watchlist');
            watchlistEl.innerHTML = '';

            Object.keys(ASSETS).forEach(symbol => {
                const asset = ASSETS[symbol];
                const item = document.createElement('div');
                item.className = `asset-item ${symbol === currentAsset ? 'active' : ''}`;
                item.setAttribute('data-symbol', symbol);
                item.innerHTML = `
                    <span class="symbol">${symbol}</span>
                    <span class="price" id="price-${symbol}">${asset.current_price.toFixed(4)}</span>
                `;
                item.onclick = () => selectAsset(symbol);
                watchlistEl.appendChild(item);
            });
            // Simuler la fluctuation des prix dans la Watchlist
            setInterval(updateWatchlistPrices, 3000);
        }

        function updateWatchlistPrices() {
            Object.keys(ASSETS).forEach(symbol => {
                const price = fetchCurrentPrice(symbol);
                ASSETS[symbol].current_price = price;
                const priceEl = document.getElementById(`price-${symbol}`);
                if (priceEl) {
                    priceEl.textContent = price.toFixed(ASSETS[symbol].group === 'Index' ? 2 : 4);
                }
            });
            // Si le marché est fermé (simulation), arrêter les mises à jour
            if (isMarketClosed()) {
                // log.message("Market closed. PnL stopped.");
                // Arrêter aussi le PnL des positions
            }
        }

        function selectAsset(symbol) {
            // Mettre à jour la variable globale
            currentAsset = symbol;
            
            // 1. Mettre à jour l'iFrame TradingView
            const tvSymbol = ASSETS[symbol].tv_symbol;
            document.getElementById('tradingViewChart').src = TV_BASE_URL + tvSymbol;

            // 2. Mettre à jour l'affichage de la Watchlist (actif)
            document.querySelectorAll('.asset-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`.asset-item[data-symbol="${symbol}"]`).classList.add('active');

            // 3. Mettre à jour le panneau de prise d'ordre
            const assetInfo = ASSETS[symbol];
            document.getElementById('order-panel-asset').textContent = `Prendre un Ordre (${symbol})`;
            document.getElementById('lotInfo').textContent = 
                `1 Lot sur ${symbol} ≈ ${assetInfo.lot_value_usd.toLocaleString('en-US', { style: 'currency', currency: 'USD' })}`;
        }

        // ----------------------------------------------------
        // --- ORDER MANAGEMENT ---
        // ----------------------------------------------------
        
        function placeOrder(direction) {
            const symbol = currentAsset;
            const lotSize = parseFloat(document.getElementById('lotSize').value);
            const orderType = document.getElementById('orderType').value;
            const limitPrice = parseFloat(document.getElementById('limitPrice').value);
            const stopLoss = parseFloat(document.getElementById('stopLoss').value);
            const takeProfit = parseFloat(document.getElementById('takeProfit').value);
            const assetInfo = ASSETS[symbol];
            const currentPrice = fetchCurrentPrice(symbol);

            // 1. Vérification des Lots/Marge
            const requiredMargin = lotSize * assetInfo.lot_value_usd;
            if (requiredMargin > balance) {
                alert(`REFUSÉ: Marge insuffisante. ${lotSize} Lots sur ${symbol} nécessite ${requiredMargin.toFixed(2)}$ de capital, mais votre solde est de ${balance.toFixed(2)}$.`);
                playSound('rejected');
                return;
            }

            // 2. Traitement de l'Ordre
            if (orderType === 'market') {
                const newPosition = {
                    id: positionIdCounter++,
                    symbol: symbol,
                    direction: direction,
                    lots: lotSize,
                    openPrice: currentPrice,
                    sl: isNaN(stopLoss) ? null : stopLoss,
                    tp: isNaN(takeProfit) ? null : takeProfit,
                    openTime: new Date(),
                    pnl: 0.00
                };
                positions.push(newPosition);
                updatePositionsDisplay();
                playSound('taken');
            } else if (orderType === 'limit') {
                if (isNaN(limitPrice) || limitPrice <= 0) {
                     alert("REFUSÉ: Vous devez spécifier un Prix Limite valide pour un ordre Limite.");
                     playSound('rejected');
                     return;
                }
                // Dans une vraie app, on ajouterait l'ordre à une liste d'ordres en attente
                alert(`Ordre Limite de ${lotSize} lots ${direction.toUpperCase()} sur ${symbol} au prix de ${limitPrice.toFixed(4)} placé.`);
                // On pourrait ajouter une fonction pour simuler l'exécution d'ordre limite
                playSound('taken');
            }
        }
        
        // ----------------------------------------------------
        // --- PnL, STOP & TP LOGIC ---
        // ----------------------------------------------------
        
        function calculateAndCheckPnL() {
            if (positions.length === 0) return;

            const currentPrices = {}; // Cache des prix pour éviter les appels multiples

            positions = positions.filter(pos => {
                let currentPrice;
                // Fetch price only for assets in active positions
                if (currentPrices[pos.symbol] === undefined) {
                    currentPrice = fetchCurrentPrice(pos.symbol);
                    currentPrices[pos.symbol] = currentPrice;
                } else {
                    currentPrice = currentPrices[pos.symbol];
                }
                
                const assetInfo = ASSETS[pos.symbol];
                const multiplier = assetInfo.lot_value_usd * assetInfo.market_coherence / 100000; // Simplification pour la simulation
                
                let pipsChange;
                if (pos.direction === 'buy') {
                    pipsChange = currentPrice - pos.openPrice;
                } else {
                    pipsChange = pos.openPrice - currentPrice;
                }

                // Calcul du PnL (simplifié pour la démo)
                let pnl = pipsChange * pos.lots * multiplier * 10000; // Multiplier par 10000 pour simuler le pips
                pos.pnl = pnl;

                // 1. Check Stop Loss
                if (pos.sl && pos.direction === 'buy' && currentPrice <= pos.sl) {
                    closePosition(pos.id, 'SL', currentPrice);
                    return false; // Remove position
                }
                if (pos.sl && pos.direction === 'sell' && currentPrice >= pos.sl) {
                    closePosition(pos.id, 'SL', currentPrice);
                    return false; // Remove position
                }
                
                // 2. Check Take Profit
                if (pos.tp && pos.direction === 'buy' && currentPrice >= pos.tp) {
                    closePosition(pos.id, 'TP', currentPrice);
                    return false; // Remove position
                }
                if (pos.tp && pos.direction === 'sell' && currentPrice <= pos.tp) {
                    closePosition(pos.id, 'TP', currentPrice);
                    return false; // Remove position
                }

                return true; // Keep position
            });

            updatePositionsDisplay();
        }

        function closePosition(id, reason = 'Manuelle', closePrice = null) {
            const index = positions.findIndex(p => p.id === id);
            if (index === -1) return;

            const closedPos = positions.splice(index, 1)[0];
            const finalPnl = closedPos.pnl; // PnL déjà calculé

            // Mettre à jour le solde
            updateBalance(finalPnl);

            // Ajouter à l'historique
            history.push({
                ...closedPos,
                closePrice: closePrice || fetchCurrentPrice(closedPos.symbol),
                closeTime: new Date(),
                result: finalPnl,
                reason: reason
            });

            updatePositionsDisplay();
            updateHistoryDisplay();
            alert(`Position #${id} (${closedPos.symbol}) fermée (${reason}). PnL: ${finalPnl.toFixed(2)}$`);
        }
        
        function isMarketClosed() {
            // Implémentation réelle nécessiterait de vérifier les heures d'ouverture/fermeture par actif.
            // Pour la démo: Marché fermé le weekend (simulé).
            const day = new Date().getDay();
            // return day === 0 || day === 6; // Dimanche ou Samedi
            return false; // Simulé toujours ouvert pour la démo
        }

        // ----------------------------------------------------
        // --- DISPLAY UPDATES (POSITIONS & HISTORY) ---
        // ----------------------------------------------------

        function updatePositionsDisplay() {
            const tableBody = document.getElementById('activePositionsTable');
            tableBody.innerHTML = '';
            
            if (positions.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Aucune position ouverte.</td></tr>';
            } else {
                positions.forEach(pos => {
                    const row = tableBody.insertRow();
                    row.innerHTML = `
                        <td>${pos.symbol}</td>
                        <td style="color: ${pos.direction === 'buy' ? 'var(--color-green)' : 'var(--color-red)'}; font-weight: bold;">${pos.direction.toUpperCase()}</td>
                        <td>${pos.lots}</td>
                        <td>${pos.openPrice.toFixed(4)}</td>
                        <td>${pos.sl ? pos.sl.toFixed(4) : 'N/A'}</td>
                        <td>${pos.tp ? pos.tp.toFixed(4) : 'N/A'}</td>
                        <td class="${pos.pnl >= 0 ? 'pnl-positive' : 'pnl-negative'}">${pos.pnl.toFixed(2)}</td>
                        <td><button class="action-button" onclick="closePosition(${pos.id})">Fermer</button></td>
                    `;
                });
            }
            // Mettre à jour le compteur dans l'onglet
            document.querySelector('.tabs-header button:nth-child(1)').textContent = `Positions (${positions.length})`;
        }

        function updateHistoryDisplay() {
            const tableBody = document.getElementById('positionHistoryTable');
            tableBody.innerHTML = '';
            
            if (history.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Aucun historique de position.</td></tr>';
            } else {
                history.forEach(pos => {
                    const row = tableBody.insertRow();
                    row.innerHTML = `
                        <td>${pos.symbol}</td>
                        <td style="color: ${pos.direction === 'buy' ? 'var(--color-green)' : 'var(--color-red)'}; font-weight: bold;">${pos.direction.toUpperCase()}</td>
                        <td>${pos.lots}</td>
                        <td>${pos.openPrice.toFixed(4)}</td>
                        <td>${pos.closePrice.toFixed(4)}</td>
                        <td class="${pos.result >= 0 ? 'pnl-positive' : 'pnl-negative'}">${pos.result.toFixed(2)}$ (${pos.reason})</td>
                    `;
                });
            }
            // Mettre à jour le compteur dans l'onglet
            document.querySelector('.tabs-header button:nth-child(2)').textContent = `Historique de Position (${history.length})`;
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            
            document.querySelector(`.tabs-header button[onclick="showTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // ----------------------------------------------------
        // --- INITIALIZATION ---
        // ----------------------------------------------------

        document.addEventListener('DOMContentLoaded', () => {
            renderWatchlist();
            selectAsset(currentAsset); // Initialise le graphique et l'info lot
            updateBalance(0); // Affiche le solde initial (50K)

            // Démarrer la boucle de calcul PnL (toutes les 1 seconde)
            pnlInterval = setInterval(calculateAndCheckPnL, 1000); 

            // Événement pour le champ Prix Limite
            document.getElementById('orderType').addEventListener('change', (e) => {
                const limitPriceInput = document.getElementById('limitPrice');
                limitPriceInput.disabled = e.target.value !== 'limit';
                if (e.target.value !== 'limit') {
                    limitPriceInput.value = '';
                }
            });

            // Fermeture des positions si le marché est fermé (vérification toutes les heures)
            // setInterval(() => {
            //     if (isMarketClosed()) {
            //         positions.forEach(pos => closePosition(pos.id, 'Market Close'));
            //     }
            // }, 3600000); // 1 heure
        });

    </script>
</body>
</html>
