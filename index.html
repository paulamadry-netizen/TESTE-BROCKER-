<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mini Broker — Forex Live</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* ------------------------------ */
/* THEME */
/* ------------------------------ */
:root{
  --bg:#0f1724;
  --card:#0b1220;
  --muted:#9aa6bf;
  --accent:#2dd4bf;
  --danger:#ff6b6b;
  --glass: rgba(255,255,255,0.03);
  --text:#e6eef8;
}

/* ------------------------------ */
/* GLOBAL */
/* ------------------------------ */
html,body{
  margin:0;
  height:100%;
  color:var(--text);
  font-family:Inter,Arial;
  background:linear-gradient(180deg,#071025,#071427);
}

.app{
  display:flex;
  flex-direction:column;
  height:100vh;
  padding:14px;
  gap:12px;
}

/* ------------------------------ */
/* TOP BAR */
/* ------------------------------ */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* ------------------------------ */
/* BUTTONS */
/* ------------------------------ */
.btn{
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  border:1px solid rgba(255,255,255,0.05);
  background:var(--glass);
  color:white;
}
.btn.buy{background:linear-gradient(90deg,#10b981,#34d399);border:none;}
.btn.sell{background:linear-gradient(90deg,#ef4444,#fb7185);border:none;}
.btn.ghost{background:transparent;color:var(--muted);}

/* ------------------------------ */
/* LAYOUT */
/* ------------------------------ */
.main{
  display:flex;
  flex:1;
  gap:14px;
  min-height:0;
}

.chart-area{
  flex:1.6;
  border-radius:12px;
  padding:12px;
  background:var(--glass);
  box-shadow:0 6px 24px rgba(0,0,0,0.6);
  display:flex;
  flex-direction:column;
}

#tv_chart_container{
  flex:1;
  min-height:380px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(255,255,255,0.02);
}

/* ------------------------------ */
/* SIDEBAR */
/* ------------------------------ */
.side{
  width:330px;
  background:var(--card);
  padding:12px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:0 6px 24px rgba(0,0,0,0.5);
}

/* ------------------------------ */
/* POSITIONS */
/* ------------------------------ */
.pos-row{
  padding:10px;
  border-radius:8px;
  background:rgba(255,255,255,0.03);
  margin-bottom:6px;
  cursor:pointer;
}
.pnl{font-weight:700;}

/* ------------------------------ */
/* ORDER EDIT PANEL */
/* ------------------------------ */
#editPanel{
  position:fixed;
  top:0;
  right:-400px;
  width:330px;
  height:100vh;
  background:#0b1220;
  box-shadow:-4px 0 20px rgba(0,0,0,0.4);
  padding:20px;
  transition:0.3s;
  display:flex;
  flex-direction:column;
  gap:12px;
}
#editPanel.active{
  right:0;
}

/* ------------------------------ */
/* INPUTS */
/* ------------------------------ */
input[type="number"]{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:none;
  background:#111a2e;
  color:white;
  margin-bottom:10px;
}

select{
  padding:8px;
  background:#111a2e;
  color:white;
  border:none;
  border-radius:8px;
}

/* ------------------------------ */
@media(max-width:960px){
  .main{flex-direction:column;}
  .side{width:100%;}
}
</style>
</head>
<body>

<div class="app">

  <!-- ------------------------------ -->
  <!-- TOP BAR -->
  <!-- ------------------------------ -->
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="logo">MB</div>
      <div>
        <div style="font-weight:700;">Mini Broker Forex</div>
        <div class="small-muted">Cours en direct</div>
      </div>
    </div>

    <div>
      <button class="btn ghost" id="refreshPrices">Rafraîchir</button>
    </div>
  </div>

  <!-- ------------------------------ -->
  <!-- MAIN -->
  <!-- ------------------------------ -->
  <div class="main">

    <div class="chart-area">

      <!-- -------- TRADE BAR WITH LOTS -------- -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div>
          <div id="currentSymbol" style="font-size:18px;font-weight:700;">EUR/USD</div>
          <div class="small-muted" id="currentPriceSmall">Prix : --</div>
        </div>

        <div style="display:flex;align-items:center;gap:10px;">
          
          <!-- SELECTEUR DE LOTS -->
          <select id="lotSize">
            <option value="100">0.01</option>
            <option value="1000" selected>0.10</option>
            <option value="10000">1.00</option>
            <option value="20000">2.00</option>
            <option value="50000">5.00</option>
          </select>

          <button class="btn buy" id="btnBuy">Acheter</button>
          <button class="btn sell" id="btnSell">Vendre</button>
        </div>
      </div>

      <div id="tv_chart_container"></div>

      <h3 style="margin-top:14px;">Positions Ouvertes</h3>
      <div id="positionsList" class="panel small-muted">Aucune position.</div>

      <h3>Historique</h3>
      <div id="historyList" class="panel small-muted">Aucun trade.</div>

      <h3>Ordres Limite</h3>
      <div id="limitOrdersList" class="panel small-muted">Aucun ordre limite.</div>
      <button class="btn" id="btnAddLimit">+ Ajouter Ordre Limite</button>

    </div>

    <aside class="side">
      <h3>Watchlist</h3>
      <div id="watchlist" style="display:flex;flex-direction:column;gap:6px;"></div>
      <button class="btn ghost" id="btnRefreshWatch">Refresh</button>
    </aside>

  </div>
</div>

<!-- ------------------------------ -->
<!-- PANEL EDIT SL/TP -->
<!-- ------------------------------ -->
<div id="editPanel">
  <h2>Modifier position</h2>
  <div id="editInfo" class="small-muted">--</div>

  SL :  
  <input id="editSL" type="number" step="0.00001">

  TP :  
  <input id="editTP" type="number" step="0.00001">

  <button class="btn" id="saveEdit">Enregistrer</button>
  <button class="btn ghost" id="closeEdit">Annuler</button>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
