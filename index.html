<style>
/* Reset & Base */
*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    font-family: 'Inter', Arial, sans-serif;
    background: #1C212E; /* Darker, more neutral background */
    color: #E0E3EB; /* Light grey for general text */
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* App Container */
.app {
    max-width: 1500px; /* Slightly wider */
    margin: 0 auto;
    padding: 16px;
    flex-grow: 1;
}

/* Header */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #2A2F3F; /* Darker header background */
    padding: 14px 24px;
    border-radius: 12px; /* Slightly less rounded */
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4); /* More pronounced shadow */
    margin-bottom: 16px;
}
.brand {
    font-size: 28px; /* Slightly larger */
    font-weight: 800; /* Bolder */
    letter-spacing: 0.5px;
    color: #4CAF50; /* Green brand color */
}
.brand span {
    color: #BBDEFB; /* Light blue accent */
}
header .controls {
    display: flex;
    gap: 18px; /* Increased gap */
    align-items: center;
    flex-wrap: wrap;
}
select, input {
    padding: 8px 12px; /* More padding */
    border-radius: 8px; /* Slightly more rounded inputs */
    background: #3B4050; /* Darker input background */
    color: #E0E3EB;
    border: 1px solid #5A6075; /* Subtler border */
    font-size: 15px;
    transition: all 0.2s ease;
}
select:focus, input:focus {
    border-color: #4CAF50; /* Highlight on focus */
    outline: none;
    box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
}
.price {
    font-weight: 700;
    color: #BBDEFB; /* Light blue for price */
    font-size: 17px;
}
.price span {
    color: #4CAF50; /* Green for actual price value */
}
label {
    color: #A9B1C2; /* Lighter label text */
    font-size: 15px;
}

/* Layout */
.layout {
    display: grid;
    grid-template-columns: 1fr 400px; /* Slightly wider sidebar */
    gap: 18px; /* Increased gap between sections */
    flex-grow: 1;
}

/* Chart & Panel Base Styles */
.chart, .sidebar .panel {
    background: #2A2F3F; /* Darker panel background */
    border-radius: 12px;
    padding: 18px; /* More padding */
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45); /* Stronger shadow */
    border: 1px solid #3B4050; /* Subtle border for panels */
}

/* Chart Specifics */
.chart h3 {
    margin: 0 0 10px 0;
    color: #BBDEFB; /* Light blue heading */
    font-size: 20px;
    font-weight: 600;
}
.chart iframe {
    width: 100%;
    height: 520px; /* Taller chart */
    border: 0;
    border-radius: 10px;
    background: #1C212E; /* Ensure iframe background matches overall dark theme */
}
.fullscreen {
    position: fixed !important;
    top: 0;
    left: 0;
    width: 100vw !important;
    height: 100vh !important;
    z-index: 9999; /* Higher z-index */
    background: #1C212E;
    border-radius: 0 !important;
    padding: 0 !important; /* Remove padding in fullscreen */
}
.full-btn {
    float: right;
    background: #3B4050;
    border: 1px solid #5A6075;
    color: #BBDEFB;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s ease;
}
.full-btn:hover {
    background: #4A4F60;
    color: #FFF;
}

/* Trade Box Buttons */
.tradebox {
    display: flex;
    gap: 12px; /* Slightly increased gap */
    margin-top: 20px; /* More space above buttons */
}
button.buy, button.sell {
    flex: 1;
    font-weight: bold;
    border: none;
    padding: 14px 22px; /* More padding */
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 17px;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
button.buy {
    background: #4CAF50; /* Green buy button */
    color: white;
}
button.sell {
    background: #F44336; /* Red sell button */
    color: white;
}
button.buy:hover {
    background: #5CB85C; /* Lighter green on hover */
    box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
}
button.sell:hover {
    background: #EF5350; /* Lighter red on hover */
    box-shadow: 0 4px 12px rgba(244, 67, 54, 0.4);
}

/* Sidebar & Positions Table */
.sidebar h3 {
    color: #BBDEFB;
    margin: 0 0 15px 0;
    font-size: 20px;
    font-weight: 600;
}
table {
    width: 100%;
    border-collapse: separate; /* Use separate to allow border-radius on cells */
    border-spacing: 0; /* Remove default spacing */
    font-size: 14px;
    background: #3B4050; /* Darker table background */
    border-radius: 8px;
    overflow: hidden; /* Ensures rounded corners are visible */
}
th, td {
    padding: 10px 12px; /* More padding in table cells */
    text-align: left;
    border-bottom: 1px solid #4A4F60; /* Subtle row separator */
    color: #E0E3EB;
}
th {
    background: #3B4050; /* Slightly different header background */
    color: #A9B1C2;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 13px;
}
tr:nth-child(even) { /* Changed to even for better contrast on dark theme */
    background: #303542; /* Slightly different row background */
}
tr:last-child td {
    border-bottom: none; /* No border on last row */
}
/* Specific styles for PnL column */
td:nth-child(6) {
    font-weight: 600;
}

/* Close Position Button */
td button {
    background: #5A6075;
    color: #E0E3EB;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s ease;
    font-size: 13px;
    line-height: 1;
}
td button:hover {
    background: #6D748A;
}

/* Total PnL */
.total-pnl {
    margin-top: 15px;
    text-align: right;
    font-weight: 700;
    font-size: 18px; /* Larger total PnL */
    color: #BBDEFB;
    padding-top: 10px;
    border-top: 1px solid #3B4050; /* Separator for total PnL */
}
.total-pnl[style*="color: rgb(16, 185, 129)"] { /* Green for positive */
    color: #4CAF50 !important;
}
.total-pnl[style*="color: rgb(239, 68, 68)"] { /* Red for negative */
    color: #F44336 !important;
}

/* Footer */
footer {
    margin-top: 25px;
    font-size: 13px;
    text-align: center;
    color: #7B879C; /* Softer footer text */
    padding: 10px 0;
}

/* Scrollbar Styles (for modern look) */
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}
::-webkit-scrollbar-track {
    background: #2A2F3F;
    border-radius: 10px;
}
::-webkit-scrollbar-thumb {
    background: #5A6075;
    border-radius: 10px;
    border: 2px solid #2A2F3F;
}
::-webkit-scrollbar-thumb:hover {
    background: #6D748A;
}

</style>
