<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mini Broker — Forex Live</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* ------------------------------ */
/* THEME */
/* ------------------------------ */
:root{
  --bg:#0f1724;
  --card:#0b1220;
  --muted:#9aa6bf;
  --accent:#2dd4bf;
  --danger:#ff6b6b;
  --glass: rgba(255,255,255,0.03);
  --text:#e6eef8;
}

/* ------------------------------ */
/* GLOBAL */
/* ------------------------------ */
html,body{
  margin:0;
  height:100%;
  color:var(--text);
  font-family:Inter,Arial;
  background:linear-gradient(180deg,#071025,#071427);
}

.app{
  display:flex;
  flex-direction:column;
  height:100vh;
  padding:14px;
  gap:12px;
}

/* ------------------------------ */
/* TOP BAR */
/* ------------------------------ */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  width:44px;
  height:44px;
  border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#60a5fa);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:18px;
}

.small-muted{color:var(--muted);font-size:13px;}
.btn{
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  border:1px solid rgba(255,255,255,0.05);
  background:var(--glass);
  color:white;
}
.btn.buy{background:linear-gradient(90deg,#10b981,#34d399);border:none;color:#042;}
.btn.sell{background:linear-gradient(90deg,#ef4444,#fb7185);border:none;}
.btn.ghost{background:transparent;color:var(--muted);}

/* ------------------------------ */
/* LAYOUT */
/* ------------------------------ */
.main{display:flex;flex:1;gap:14px;min-height:0;}
.chart-area{
  flex:1.6;
  border-radius:12px;
  padding:12px;
  background:var(--glass);
  box-shadow:0 6px 24px rgba(0,0,0,0.6);
  display:flex;
  flex-direction:column;
}

#tv_chart_container{
  flex:1;
  min-height:380px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(255,255,255,0.02);
}

/* ------------------------------ */
/* SIDEBAR */
/* ------------------------------ */
.side{
  width:330px;
  background:var(--card);
  padding:12px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:0 6px 24px rgba(0,0,0,0.5);
}
.watch-item{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
}
.watch-item:hover{background:rgba(255,255,255,0.03);}

/* ------------------------------ */
/* POSITIONS */
/* ------------------------------ */
.pos-row{
  padding:10px;
  border-radius:8px;
  background:rgba(255,255,255,0.03);
  margin-bottom:6px;
  cursor:pointer;
}
.pnl{
  font-weight:700;
}

/* ------------------------------ */
/* PANEL EDIT SL/TP */
/* ------------------------------ */
#editPanel{
  position:fixed;
  top:0;
  right:-400px;
  width:330px;
  height:100vh;
  background:#0b1220;
  box-shadow:-4px 0 20px rgba(0,0,0,0.4);
  padding:20px;
  transition:0.3s;
  display:flex;
  flex-direction:column;
  gap:12px;
}
#editPanel.active{
  right:0;
}

input[type="number"]{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:none;
  background:#111a2e;
  color:white;
  margin-bottom:10px;
}

/* ------------------------------ */
@media(max-width:960px){
  .main{flex-direction:column;}
  .side{width:100%;}
}
</style>
</head>
<body>

<div class="app">

  <!-- ------------------------------ -->
  <!-- TOP BAR -->
  <!-- ------------------------------ -->
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="logo">MB</div>
      <div>
        <div style="font-weight:700;">Mini Broker Forex</div>
        <div class="small-muted">Cours en direct</div>
      </div>
    </div>

    <div>
      <button class="btn ghost" id="refreshPrices">Rafraîchir</button>
    </div>
  </div>

  <!-- ------------------------------ -->
  <!-- MAIN -->
  <!-- ------------------------------ -->
  <div class="main">

    <!-- ---------- CHART ZONE ----------- -->
    <div class="chart-area">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div>
          <div id="currentSymbol" style="font-size:18px;font-weight:700;">EUR/USD</div>
          <div class="small-muted" id="currentPriceSmall">Prix : --</div>
        </div>

        <div style="display:flex;gap:10px;">
          <button class="btn buy" id="btnBuy">Acheter</button>
          <button class="btn sell" id="btnSell">Vendre</button>
        </div>
      </div>

      <div id="tv_chart_container"></div>

      <h3 style="margin-top:14px;">Positions Ouvertes</h3>
      <div id="positionsList" class="panel small-muted">Aucune position.</div>

      <h3>Historique</h3>
      <div id="historyList" class="panel small-muted">Aucun trade.</div>

      <h3>Ordres Limite</h3>
      <div id="limitOrdersList" class="panel small-muted">Aucun ordre limite.</div>
      <button class="btn" id="btnAddLimit">+ Ajouter Ordre Limite</button>

    </div>

    <!-- ---------- SIDEBAR ----------- -->
    <aside class="side">

      <h3>Watchlist</h3>
      <div id="watchlist" style="display:flex;flex-direction:column;gap:6px;"></div>
      <button class="btn ghost" id="btnRefreshWatch">Refresh</button>

    </aside>

  </div>
</div>

<!-- ------------------------------ -->
<!-- SL/TP EDIT PANEL -->
<!-- ------------------------------ -->
<div id="editPanel">
  <h2>Modifier position</h2>
  <div id="editInfo" class="small-muted">--</div>

  SL :  
  <input id="editSL" type="number" step="0.00001">

  TP :  
  <input id="editTP" type="number" step="0.00001">

  <button class="btn" id="saveEdit">Enregistrer</button>
  <button class="btn ghost" id="closeEdit">Annuler</button>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
/* =======================================================================
   VARIABLES
======================================================================= */
const API_KEY="c9140c9a72264e82bb9f5235b86b2806";
const API_BASE="https://api.twelvedata.com";

const WATCHLIST=[
  "EUR/USD","GBP/USD","USD/JPY","AUD/USD","USD/CHF","USD/CAD","NZD/USD","XAU/USD"
];

let lastPrices={};
let positions=[];
let history=[];
let limitOrders=[];

let editingPosition=null;

/* =======================================================================
   UTILS
======================================================================= */
const fmt=(n,d=5)=>n==null?"--":Number(n).toLocaleString("en-US",{maximumFractionDigits:d});
const now=()=>new Date().toLocaleString("fr-FR");

/* =======================================================================
   API PRICE
======================================================================= */
function apiGetPrice(symbol){
  return fetch(`${API_BASE}/price?symbol=${encodeURIComponent(symbol)}&apikey=${API_KEY}`)
    .then(r=>r.json())
    .then(j=>{
      if(j.price) return Number(j.price);
      throw 0;
    })
    .catch(()=>{
      const base=lastPrices[symbol]??1.1;
      return base*(1+(Math.random()-0.5)*0.002);
    });
}

/* =======================================================================
   WATCHLIST RENDER
======================================================================= */
function renderWatchlist(){
  const c=document.getElementById("watchlist");
  c.innerHTML="";

  WATCHLIST.forEach(sym=>{
    const id=sym.replace(/[^a-zA-Z0-9]/g,"_");
    const el=document.createElement("div");
    el.className="watch-item";
    el.innerHTML=`
      <div>${sym}</div>
      <div id="price_${id}" style="font-weight:600;">--</div>
    `;
    el.onclick=()=>setChartSymbol(sym);
    c.appendChild(el);
  });
}

/* =======================================================================
   POSITION FUNCTIONS
======================================================================= */
function openPosition(side){
  apiGetPrice(currentSymbol).then(price=>{
    const p={
      id:"pos"+Date.now(),
      symbol:currentSymbol,
      side,
      qty:1000,
      entryPrice:price,
      sl:null,
      tp:null
    };
    positions.push(p);
    renderPositions();
  });
}

function computePnl(p){
  const cur=lastPrices[p.symbol] ?? p.entryPrice;
  return (p.side==="BUY"?1:-1) * (cur - p.entryPrice) * p.qty;
}

function closePosition(id){
  const p=positions.find(x=>x.id===id);
  if(!p) return;

  const exit = lastPrices[p.symbol] ?? p.entryPrice;
  const pnl = computePnl(p);

  history.unshift({...p,exitPrice:exit,pnl});
  positions = positions.filter(x=>x.id!==id);

  renderPositions();
  renderHistory();
}

function renderPositions(){
  const c=document.getElementById("positionsList");
  if(!positions.length){c.innerHTML="Aucune position.";return;}

  c.innerHTML="";
  positions.forEach(p=>{
    const cur=lastPrices[p.symbol] ?? p.entryPrice;
    const pnl=computePnl(p);

    const el=document.createElement("div");
    el.className="pos-row";
    el.innerHTML=`
      <div style="display:flex;justify-content:space-between;">
        <div>
          <b>${p.symbol}</b> (${p.side})
          <div class="small-muted">Entrée : ${fmt(p.entryPrice)} | Actuel : ${fmt(cur)}</div>
          ${p.sl ? `<div class="small-muted">SL: ${fmt(p.sl)}</div>` : ""}
          ${p.tp ? `<div class="small-muted">TP: ${fmt(p.tp)}</div>` : ""}
        </div>
        <div style="text-align:right;">
          <div class="pnl" style="color:${pnl>=0?'#34d399':'#fb7185'}">${fmt(pnl,2)}</div>
        </div>
      </div>
    `;

    el.onclick=()=>openEditPanel(p);

    c.appendChild(el);
  });
}

/* =======================================================================
   EDIT SL/TP PANEL
======================================================================= */
function openEditPanel(p){
  editingPosition=p;

  document.getElementById("editInfo").textContent=
    `${p.symbol} (${p.side}) — Entrée ${fmt(p.entryPrice)}`;

  document.getElementById("editSL").value=p.sl ?? "";
  document.getElementById("editTP").value=p.tp ?? "";

  document.getElementById("editPanel").classList.add("active");
}

function saveEdit(){
  if(!editingPosition) return;
  editingPosition.sl = Number(document.getElementById("editSL").value) || null;
  editingPosition.tp = Number(document.getElementById("editTP").value) || null;

  document.getElementById("editPanel").classList.remove("active");
  renderPositions();
}
document.getElementById("saveEdit").onclick=saveEdit;
document.getElementById("closeEdit").onclick=()=>document.getElementById("editPanel").classList.remove("active");

/* =======================================================================
   LIMIT ORDERS
======================================================================= */
function addLimitOrder(){
  const type = prompt("Type (BUY_LIMIT / SELL_LIMIT) :");
  if(!type) return;

  const price = Number(prompt("Prix limite :"));
  if(!price) return;

  limitOrders.push({
    id:"lim"+Date.now(),
    symbol:currentSymbol,
    side:type,
    price,
    qty:1000,
    sl:null,
    tp:null
  });

  renderLimitOrders();
}

function renderLimitOrders(){
  const c=document.getElementById("limitOrdersList");
  if(!limitOrders.length){c.innerHTML="Aucun ordre limite.";return;}

  c.innerHTML="";
  limitOrders.forEach(o=>{
    c.innerHTML+=`
      <div class="pos-row">
        <div>
          <b>${o.symbol}</b> — ${o.side}
          <div class="small-muted">Prix : ${fmt(o.price)}</div>
        </div>
      </div>
    `;
  });
}

/* =======================================================================
   HISTORY
======================================================================= */
function renderHistory(){
  const c=document.getElementById("historyList");
  if(!history.length){c.innerHTML="Aucun trade.";return;}

  c.innerHTML="";
  history.forEach(h=>{
    c.innerHTML+=`
      <div class="pos-row">
        <div>
          <b>${h.symbol}</b> (${h.side})
          <div class="small-muted">${fmt(h.entryPrice)} → ${fmt(h.exitPrice)}</div>
        </div>
        <div class="pnl" style="color:${h.pnl>=0?'#34d399':'#fb7185'}">${fmt(h.pnl,2)}</div>
      </div>
    `;
  });
}

/* =======================================================================
   TRADINGVIEW
======================================================================= */
let currentSymbol="EUR/USD";
let tvWidget=null;

function setChartSymbol(sym){
  currentSymbol=sym;
  document.getElementById("currentSymbol").textContent=sym;

  document.getElementById("tv_chart_container").innerHTML="";
  tvWidget=new TradingView.widget({
    autosize:true,
    symbol:sym,
    interval:"60",
    theme:"dark",
    locale:"fr",
    container_id:"tv_chart_container"
  });
}

/* =======================================================================
   REFRESH PRICES
======================================================================= */
async function refreshPrices(){
  for(const sym of WATCHLIST){
    const price = await apiGetPrice(sym);
    lastPrices[sym]=price;

    const id=sym.replace(/[^a-zA-Z0-9]/g,"_");
    const lbl=document.getElementById("price_"+id);
    if(lbl) lbl.textContent=fmt(price, sym.includes("XAU")?2:5);
  }

  document.getElementById("currentPriceSmall").textContent=
    "Prix : "+fmt(lastPrices[currentSymbol]);

  renderPositions();
  renderLimitOrders();
}

document.getElementById("refreshPrices").onclick=refreshPrices;
document.getElementById("btnRefreshWatch").onclick=refreshPrices;

/* =======================================================================
   BUY / SELL DIRECTS
======================================================================= */
document.getElementById("btnBuy").onclick=()=>openPosition("BUY");
document.getElementById("btnSell").onclick=()=>openPosition("SELL");

/* =======================================================================
   INIT
======================================================================= */
function boot(){
  renderWatchlist();
  setChartSymbol("EUR/USD");
  refreshPrices();
  setInterval(refreshPrices,10000);
}
document.getElementById("btnAddLimit").onclick=addLimitOrder;

boot();
</script>

</body>
</html>
