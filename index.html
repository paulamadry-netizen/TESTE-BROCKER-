<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mini-Broker Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- TradingView -->
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

<!-- STYLES EXACTS ORIGINE -->
<style>
body {
    margin: 0;
    background: #010409;
    color: #fff;
    font-family: Arial, sans-serif;
}
header {
    background: #161b22;
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #30363d;
}
.tabs {
    display: flex;
    justify-content: center;
    background: #0d1117;
    border-bottom: 1px solid #30363d;
}
.tab {
    padding: 15px;
    cursor: pointer;
    color: #8b949e;
}
.tab.active {
    color: #fff;
    border-bottom: 3px solid #58a6ff;
}
#main {
    display: flex;
    height: calc(100vh - 100px);
}
#broker, #ordersTab, #historyTab {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: none;
}
#ordersTab, #historyTab {
    background: #0d1117;
    border-left: 1px solid #30363d;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}
table th, table td {
    padding: 10px;
    border-bottom: 1px solid #30363d;
    text-align: center;
}
.buy-row {
    background: rgba(46, 160, 67, 0.1);
}
.sell-row {
    background: rgba(248, 81, 73, 0.1);
}
.panel {
    margin-bottom: 20px;
    padding: 15px;
    background: #0d1117;
    border: 1px solid #30363d;
}
.panel h2 {
    margin: 0 0 10px;
}
input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    background: #161b22;
    border: 1px solid #30363d;
    color: #fff;
    border-radius: 5px;
}
button {
    width: 100%;
    padding: 12px;
    margin: 5px 0;
    border: none;
    cursor: pointer;
    font-weight: bold;
    border-radius: 5px;
}
.buyBtn {
    background: #238636;
    color: #fff;
}
.sellBtn {
    background: #da3633;
    color: #fff;
}
#chart {
    height: 50vh;
    border: 1px solid #30363d;
    border-radius: 5px;
    margin-bottom: 20px;
}
</style>
</head>

<body>

<header>
    <h1>Mini-Broker Pro</h1>
    <div>
        <input id="symbolInput" placeholder="Entrer un symbole (ex: BTC/USD)" style="width:200px;">
        <button onclick="setChartSymbol()">Changer</button>
    </div>
</header>

<div class="tabs">
    <div class="tab active" data-tab="trade">Trading</div>
    <div class="tab" data-tab="orders">Ordres en cours</div>
    <div class="tab" data-tab="history">Historique</div>
</div>

<div id="main">

    <!-- BROKER -->
    <div id="broker" style="display:block;">
        <div id="chart"></div>

        <div class="panel">
            <h2 id="symbolDisplay">Symbole</h2>
            <p>Prix Actuel: <span id="currentPrice">--</span></p>

            <label>Lots</label>
            <input id="lotInput" type="number" value="1">

            <label>Stop Loss</label>
            <input id="slInput" type="number" placeholder="SL">

            <label>Take Profit</label>
            <input id="tpInput" type="number" placeholder="TP">

            <button class="buyBtn" id="btnBuy">BUY Market</button>
            <button class="sellBtn" id="btnSell">SELL Market</button>

            <label>Prix limite :</label>
            <input id="priceInput" type="number" placeholder="Entrer prix">

            <button class="buyBtn" id="btnBuyLimit">BUY Limit</button>
            <button class="sellBtn" id="btnSellLimit">SELL Limit</button>
        </div>
    </div>

    <!-- ORDERS -->
    <div id="ordersTab">
        <h2>Ordres en cours</h2>
        <table id="ordersTable">
            <thead>
                <tr>
                    <th>ID</th><th>Heure</th><th>Type</th><th>Side</th><th>Prix</th>
                    <th>SL</th><th>TP</th><th>Lots</th><th>Status</th><th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- HISTORY -->
    <div id="historyTab">
        <h2>Historique</h2>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>ID</th><th>Type</th><th>Side</th><th>Entry</th><th>Exit</th>
                    <th>Lots</th><th>PNL</th><th>Heure</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script>
// ======================
// Variables
// ======================
let symbol = "BTC/USD";
let currentPrice = 0;
let orders = [];
let history = [];
let orderID = 1;

// ======================
// Initialisation TradingView
// ======================
function initChart() {
    new TradingView.widget({
        "width": "100%",
        "height": "100%",
        "symbol": symbol.replace("/", ""),
        "interval": "1",
        "timezone": "Europe/Paris",
        "theme": "dark",
        "style": "1",
        "locale": "fr",
        "container_id": "chart",
        "hide_side_toolbar": false,
    });

    simulatePrice();
}

function simulatePrice() {
    setInterval(() => {
        currentPrice += (Math.random() - 0.5) * 0.5;
        if (currentPrice <= 0) currentPrice = 1;
        document.getElementById("currentPrice").textContent = currentPrice.toFixed(2);
        checkOrders();
    }, 800);
}

// ======================
// Change Symbol
// ======================
function setChartSymbol() {
    const input = document.getElementById("symbolInput").value;
    if (!input) return;
    symbol = input;
    document.getElementById("symbolDisplay").textContent = symbol;
    initChart();
}

// ======================
// Tabs
// ======================
document.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(e => e.classList.remove("active"));
        t.classList.add("active");

        document.getElementById("broker").style.display = "none";
        document.getElementById("ordersTab").style.display = "none";
        document.getElementById("historyTab").style.display = "none";

        if (t.dataset.tab === "trade") document.getElementById("broker").style.display = "block";
        if (t.dataset.tab === "orders") document.getElementById("ordersTab").style.display = "block";
        if (t.dataset.tab === "history") document.getElementById("historyTab").style.display = "block";
    });
});

// ======================
// Market Order
// ======================
function marketOrder(side) {
    const lots = parseFloat(document.getElementById("lotInput").value);
    const sl = parseFloat(document.getElementById("slInput").value) || null;
    const tp = parseFloat(document.getElementById("tpInput").value) || null;

    const order = {
        id: orderID++,
        time: new Date().toLocaleTimeString(),
        type: "market",
        side,
        lots,
        entry: currentPrice,
        sl,
        tp,
        status: "running"
    };

    orders.push(order);
    updateOrdersTable();
}

// ======================
// Limit Order
// ======================
function limitOrder(side) {
    const price = parseFloat(document.getElementById("priceInput").value);
    const lots = parseFloat(document.getElementById("lotInput").value);
    const sl = parseFloat(document.getElementById("slInput").value) || null;
    const tp = parseFloat(document.getElementById("tpInput").value) || null;

    const order = {
        id: orderID++,
        time: new Date().toLocaleTimeString(),
        type: "limit",
        side,
        lots,
        sl,
        tp,
        entry: price,
        status: "pending"
    };

    orders.push(order);
    updateOrdersTable();
}

// ======================
// Vérification des ordres
// ======================
function checkOrders() {
    for (let i = orders.length - 1; i >= 0; i--) {
        let o = orders[i];

        if (o.type === "limit" && o.status === "pending") {
            if ((o.side === "BUY" && currentPrice <= o.entry) ||
                (o.side === "SELL" && currentPrice >= o.entry)) {
                o.entry = currentPrice;
                o.status = "running";
            }
        }

        if (o.status === "running") {
            if (o.tp && ((o.side === "BUY" && currentPrice >= o.tp) || (o.side === "SELL" && currentPrice <= o.tp))) {
                closeOrder(i);
            }
            if (o.sl && ((o.side === "BUY" && currentPrice <= o.sl) || (o.side === "SELL" && currentPrice >= o.sl))) {
                closeOrder(i);
            }
        }
    }

    updateOrdersTable();
}

// ======================
// Fermer un ordre
// ======================
function closeOrder(i) {
    const o = orders[i];
    o.exit = currentPrice;
    o.pnl = (o.side === "BUY" ? (o.exit - o.entry) : (o.entry - o.exit)) * o.lots;

    history.push(o);
    orders.splice(i, 1);

    updateOrdersTable();
    updateHistoryTable();
}

// ======================
// Update Tables
// ======================
function updateOrdersTable() {
    const tbody = document.querySelector("#ordersTable tbody");
    tbody.innerHTML = "";

    orders.forEach(o => {
        const tr = document.createElement("tr");
        tr.className = o.side === "BUY" ? "buy-row" : "sell-row";

        tr.innerHTML = `
            <td>${o.id}</td>
            <td>${o.time}</td>
            <td>${o.type}</td>
            <td>${o.side}</td>
            <td>${o.entry.toFixed(2)}</td>
            <td>${o.sl ?? "-"}</td>
            <td>${o.tp ?? "-"}</td>
            <td>${o.lots}</td>
            <td>${o.status}</td>
            <td><button onclick="forceClose(${o.id})" style="background:red;color:white;">Fermer</button></td>
        `;
        tbody.appendChild(tr);
    });
}

function forceClose(id) {
    const i = orders.findIndex(o => o.id === id);
    if (i !== -1) closeOrder(i);
}

function updateHistoryTable() {
    const tbody = document.querySelector("#historyTable tbody");
    tbody.innerHTML = "";

    history.forEach(o => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${o.id}</td>
            <td>${o.type}</td>
            <td>${o.side}</td>
            <td>${o.entry.toFixed(2)}</td>
            <td>${o.exit.toFixed(2)}</td>
            <td>${o.lots}</td>
            <td>${o.pnl.toFixed(2)}</td>
            <td>${o.time}</td>
        `;
        tbody.appendChild(tr);
    });
}

// ======================
// Buttons
// ======================
document.getElementById("btnBuy").onclick = () => marketOrder("BUY");
document.getElementById("btnSell").onclick = () => marketOrder("SELL");
document.getElementById("btnBuyLimit").onclick = () => limitOrder("BUY");
document.getElementById("btnSellLimit").onclick = () => limitOrder("SELL");

// Start
initChart();
</script>

</body>
</html>
