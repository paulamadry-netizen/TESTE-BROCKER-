<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mini Broker</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        height: 100vh;
        overflow: hidden;
    }
    #left { flex: 1; display: flex; flex-direction: column; }
    #chart { flex: 1; min-height: 60vh; }
    #bottom {
        height: 40vh;
        background: #1a1a1a;
        padding: 10px;
        overflow-y: auto;
    }
    #tabs { display: flex; margin-bottom: 10px; }
    .tab {
        padding: 10px 20px;
        cursor: pointer;
        background: #222;
        margin-right: 10px;
        border-radius: 5px;
    }
    .tab.active { background: #444; }
    #positions, #history { display: none; }
    table { width: 100%; border-collapse: collapse; color: white; }
    th, td { padding: 8px; border-bottom: 1px solid #333; }
    #sidebar {
        width: 260px;
        background: #1a1a1a;
        padding: 10px;
        overflow-y: auto;
        border-left: 1px solid #333;
    }
    .item {
        padding: 10px;
        background: #222;
        border-radius: 5px;
        margin-bottom: 10px;
        cursor: pointer;
    }
    .item:hover { background: #333; }

    #orderButtons {
        display: flex;
        gap: 15px;
        padding: 10px;
        background: #000;
        border-top: 1px solid #333;
    }
    button {
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        color: white;
    }
    .buyBtn { background: #059669; }
    .sellBtn { background: #dc2626; }
</style>
</head>

<body>

<div id="left">
    <div id="chart"></div>

    <div id="orderButtons">
        <button class="buyBtn" onclick="placeOrder('buy')">Acheter</button>
        <button class="sellBtn" onclick="placeOrder('sell')">Vendre</button>
    </div>

    <div id="bottom">
        <div id="tabs">
            <div class="tab active" onclick="openTab('positions')">Positions</div>
            <div class="tab" onclick="openTab('history')">Historique</div>
        </div>

        <div id="positions">
            <table>
                <thead>
                    <tr>
                        <th>Symbole</th><th>Type</th><th>Prix Entrée</th><th>Prix Actuel</th><th>PNL</th>
                    </tr>
                </thead>
                <tbody id="positionsBody"></tbody>
            </table>
        </div>

        <div id="history">
            <table>
                <thead>
                    <tr>
                        <th>Symbole</th><th>Type</th><th>Prix Entrée</th><th>Prix Sortie</th><th>PNL</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="sidebar">
    <h3>Watchlist</h3>

    <h4>Top 5 Forex</h4>
    <div class="item" onclick="selectSymbol('FX:EURUSD')">EUR/USD</div>
    <div class="item" onclick="selectSymbol('FX:GBPUSD')">GBP/USD</div>
    <div class="item" onclick="selectSymbol('FX:USDJPY')">USD/JPY</div>
    <div class="item" onclick="selectSymbol('FX:USDCHF')">USD/CHF</div>
    <div class="item" onclick="selectSymbol('FX:AUDUSD')">AUD/USD</div>

    <h4>Top 5 Indices (auto ETF)</h4>
    <div class="item" onclick="selectSymbol('INDEX:SPX')">S&P 500</div>
    <div class="item" onclick="selectSymbol('INDEX:NDX')">NASDAQ 100</div>
    <div class="item" onclick="selectSymbol('INDEX:DJI')">Dow Jones</div>
    <div class="item" onclick="selectSymbol('INDEX:DAX')">DAX</div>
    <div class="item" onclick="selectSymbol('INDEX:FTSE')">FTSE 100</div>

    <h4>Or</h4>
    <div class="item" onclick="selectSymbol('COM:GOLD')">OR</div>
</div>

<script>
/* CONFIG API */
const API_KEY = "c9140c9a72264e82bb9f5235b86b2806";
const API_BASE = "https://api.twelvedata.com";

/* APP DATA */
let currentSymbol = "FX:EURUSD";
let tvWidget = null;
let positions = [];
let history = [];
let lastPrices = {};

// MAPPING ETF RENVOYÉ PAR TON API
let dynamicETFMap = {};

function getChartSymbol(symbol) {
    return dynamicETFMap[symbol] ?? symbol;
}

/* API PRICE */
async function apiGetPrice(symbol){
    const raw = symbol.replace(/^FX:|^COM:|^INDEX:/, '');
    const url = `${API_BASE}/price?symbol=${raw}&apikey=${API_KEY}`;

    return fetch(url)
        .then(r => r.json())
        .then(json => {
            const price = Number(json.price ?? json.last ?? json.close);

            // si API renvoie ETF
            if(json.etf) {
                dynamicETFMap[symbol] = json.etf;
            }

            lastPrices[symbol] = price;
            return price;
        })
        .catch(() => {
            const fallback = (lastPrices[symbol] ?? 100) * (1 + (Math.random()-0.5)*0.002);
            return Number(fallback.toFixed(5));
        });
}

/* TRADINGVIEW */
function initChart(symbol){
    if(tvWidget) tvWidget.remove();

    tvWidget = new TradingView.widget({
        container_id: "chart",
        autosize: true,
        symbol: getChartSymbol(symbol),
        interval: "60",
        theme: "dark",
        style: "1",
        hide_side_toolbar: false,
        locale: "fr"
    });
}

/* CHANGE SYMBOL */
function selectSymbol(symbol){
    currentSymbol = symbol;
    initChart(symbol);
}

/* TABS */
function openTab(tab){
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelector(`.tab[onclick="openTab('${tab}')"]`).classList.add("active");

    document.getElementById("positions").style.display = "none";
    document.getElementById("history").style.display = "none";
    document.getElementById(tab).style.display = "block";
}

openTab('positions');

/* PLACE ORDER */
async function placeOrder(type){
    const price = await apiGetPrice(currentSymbol);

    positions.push({
        symbol: currentSymbol,
        type,
        entry: price,
        current: price
    });

    updatePositions();
}

/* UPDATE POSITIONS */
async function updatePositions(){
    for(let p of positions){
        p.current = await apiGetPrice(p.symbol);
    }

    const body = document.getElementById("positionsBody");
    body.innerHTML = "";

    positions.forEach((p, i)=>{
        const pnl = ((p.type === "buy" ? 1 : -1) * (p.current - p.entry)).toFixed(5);

        body.innerHTML += `
            <tr>
                <td>${p.symbol}</td>
                <td>${p.type.toUpperCase()}</td>
                <td>${p.entry}</td>
                <td>${p.current}</td>
                <td>${pnl}</td>
            </tr>
        `;
    });
}

setInterval(updatePositions, 2000);

/* INIT */
initChart(currentSymbol);
</script>
</body>
</html>
