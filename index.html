<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmA Trading - Prop Firm Broker</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS V2.1 */
        :root {
            --bg-dark: #121417; /* Presque noir */
            --bg-medium: #1c2025; /* Arrière-plan des panneaux */
            --bg-light: #2c3138; /* Couleur des headers/input */
            --color-text: #e0e0e0;
            --color-text-light: #9aa0a6;
            --color-green: #00a859;
            --color-red: #ff3347;
            --color-primary: #3b82f6; /* Bleu moderne */
            --border-color: #3e444d;
            --font-family: 'Montserrat', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
        }

        /* --- LAYOUT & HEADER --- */
        .header {
            grid-area: 1 / 1 / 2 / 3;
            background-color: var(--bg-medium);
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.5em;
            font-weight: 700;
            color: var(--color-primary);
        }
        
        .container {
            display: grid;
            grid-template-columns: 300px 1fr;
            grid-template-rows: auto 1fr 280px; /* Row 1: Header, Row 2: Chart, Row 3: Tabs */
            width: 100%;
            height: 100%;
        }

        .left-panel {
            grid-area: 2 / 1 / 4 / 2; /* Chart + Tabs height */
            display: flex;
            flex-direction: column;
            background-color: var(--bg-medium);
            border-right: 1px solid var(--border-color);
            /* overflow-y: auto; */ /* Retiré pour éviter le scroll sur ce panneau s'il est petit */
        }

        .main-chart {
            grid-area: 2 / 2 / 3 / 3;
            background-color: black;
        }

        .bottom-tabs {
            grid-area: 3 / 2 / 4 / 3;
            background-color: var(--bg-medium);
            border-top: 1px solid var(--border-color);
        }

        /* --- BALANCE & WATCHLIST --- */
        .balance-bar {
            padding: 15px;
            background-color: var(--bg-light);
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            color: var(--color-primary);
            text-align: center;
            flex-shrink: 0; /* Empêche de rétrécir */
        }

        .watchlist-header {
            padding: 10px 15px;
            background-color: var(--bg-medium);
            font-weight: 700;
            font-size: 1em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .watchlist {
            flex-grow: 1; /* Prend l'espace restant */
            overflow-y: auto; /* Permet le scroll si trop d'éléments */
            border-bottom: 1px solid var(--border-color); /* Ajouté pour séparer visuellement */
        }

        .asset-item {
            display: grid;
            grid-template-columns: 1fr 100px;
            align-items: center;
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--bg-medium);
            transition: background-color 0.15s, color 0.15s;
        }

        .asset-item:hover, .asset-item.active {
            background-color: var(--bg-light);
            color: white;
        }
        
        .asset-item .symbol {
            font-weight: 600;
        }

        .asset-item .price {
            font-weight: 600;
            text-align: right;
            color: var(--color-green);
        }
        
        /* --- LIMIT ORDER TABLE (Amélioré V2.1) --- */
        .limit-order-panel {
            padding: 15px;
            background-color: var(--bg-medium);
            border-top: 5px solid var(--border-color);
            flex-shrink: 0; /* Empêche de rétrécir et maintient sa taille */
            /* Suppression de flex-grow: 1 pour qu'il soit compact */
        }

        .limit-order-panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1em;
            text-align: center;
            color: white;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--color-primary);
        }

        .order-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px; /* Réduction du gap */
        }
        
        .form-group {
            grid-column: span 2;
            display: flex;
            flex-direction: column;
        }

        .form-group.split {
            grid-column: span 1;
        }

        .form-group label {
            font-size: 0.8em;
            margin-bottom: 4px;
            color: var(--color-text-light);
            font-weight: 600;
        }

        .order-form input, .order-form select {
            padding: 8px; /* Réduction du padding */
            border: 1px solid var(--border-color);
            background-color: var(--bg-light);
            color: var(--color-text);
            border-radius: 6px;
            font-size: 13px; /* Réduction de la taille de police */
            outline: none;
            transition: border-color 0.2s;
        }

        .order-form input:focus, .order-form select:focus {
            border-color: var(--color-primary);
        }

        .order-form button {
            padding: 10px; /* Réduction du padding */
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1em; /* Réduction de la taille de police */
            transition: transform 0.1s, opacity 0.2s;
        }

        .order-form button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .buy-btn {
            background-color: var(--color-green);
        }

        .sell-btn {
            background-color: var(--color-red);
        }

        .lot-info {
            grid-column: span 2;
            text-align: center;
            padding: 8px; /* Réduction du padding */
            background-color: var(--bg-light);
            border-radius: 6px;
            margin-top: 8px; /* Réduction de la marge */
            font-size: 0.85em; /* Réduction de la taille de police */
            font-weight: 600;
        }
        
        /* --- BOTTOM TABS (POSITIONS/HISTORY) --- */
        .tabs-header {
            display: flex;
            background-color: var(--bg-light);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .tab-button {
            padding: 12px 20px;
            cursor: pointer;
            border: none;
            background-color: transparent;
            color: var(--color-text-light);
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: border-bottom-color 0.2s, color 0.2s;
        }

        .tab-button.active {
            border-bottom-color: var(--color-primary);
            color: white;
        }

        .tabs-content {
            padding: 15px;
            overflow-y: auto;
            height: calc(100% - 40px);
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        /* --- TABLE STYLES --- */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        .data-table th, .data-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            background-color: var(--bg-light);
            text-transform: uppercase;
            font-size: 0.8em;
            color: var(--color-text-light);
        }

        .pnl-positive { color: var(--color-green); font-weight: 700; }
        .pnl-negative { color: var(--color-red); font-weight: 700; }
        .action-button {
            padding: 5px 10px;
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.2s;
        }
        .action-button:hover { background-color: #3172d5; }

    </style>
</head>
<body>

    <audio id="orderTakenSound" src="[Placeholder for Order Taken Sound - E.g., a short 'ding']" preload="auto"></audio>
    <audio id="orderRejectedSound" src="[Placeholder for Order Rejected Sound - E.g., a short 'buzz']" preload="auto"></audio>

    <div class="container">
        
        <div class="header">
            AmA Trading 🚀
        </div>

        <div class="left-panel">
            <div class="balance-bar">
                SOLDE DISPONIBLE: <span id="currentBalance">50,000.00 $</span>
            </div>

            <div class="watchlist-header">
                WATCHLIST
            </div>
            <div class="watchlist" id="watchlist">
                </div>

            <div class="limit-order-panel">
                <h3 id="order-panel-asset">Passer un Ordre (EURUSD)</h3>
                
                <form id="orderForm" class="order-form">
                    
                    <div class="form-group split">
                        <label for="lotSize">Lots (Volume)</label>
                        <input type="number" id="lotSize" value="1.0" min="0.01" step="0.01" required>
                    </div>

                    <div class="form-group split">
                        <label for="orderType">Type d'Ordre</label>
                        <select id="orderType" required>
                            <option value="market">Au Marché</option>
                            <option value="limit">Ordre Limite</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="limitPrice">Prix Limite (si Limite)</label>
                        <input type="number" id="limitPrice" placeholder="Prix d'exécution cible" disabled>
                    </div>

                    <div class="form-group split">
                        <label for="stopLoss">Stop Loss (SL)</label>
                        <input type="number" id="stopLoss" placeholder="Prix SL (Optionnel)">
                    </div>
                    
                    <div class="form-group split">
                        <label for="takeProfit">Take Profit (TP)</label>
                        <input type="number" id="takeProfit" placeholder="Prix TP (Optionnel)">
                    </div>

                    <div id="lotInfo" class="lot-info">1.0 Lot EURUSD ≈ 100,000.00 $</div>

                    <button type="button" class="buy-btn" onclick="placeOrder('buy')">ACHETER</button>
                    <button type="button" class="sell-btn" onclick="placeOrder('sell')">VENDRE</button>
                </form>
            </div>
        </div>

        <div class="main-chart">
            <iframe id="tradingViewChart"
                src="https://fr.tradingview.com/widgetembed/?symbol=FX_IDC%3AEURUSD&interval=60&theme=dark&style=1&locale=fr&toolbar_bg=%231c2025&enable_publishing=false&allow_symbol_change=true&container_id=tradingview_widget"
                frameborder="0"
                allowfullscreen
                style="width: 100%; height: 100%;">
            </iframe>
        </div>

        <div class="bottom-tabs">
            <div class="tabs-header">
                <button class="tab-button active" onclick="showTab('positions')">Positions (0)</button>
                <button class="tab-button" onclick="showTab('history')">Historique (0)</button>
            </div>
            
            <div class="tabs-content">
                <div id="positions" class="tab-pane active">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Actif</th>
                                <th>Sens</th>
                                <th>Lots</th>
                                <th>Ouverture</th>
                                <th>Stop/Take</th>
                                <th>PnL (USD)</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="activePositionsTable">
                            <tr><td colspan="7" style="text-align: center; color: var(--color-text-light);">Aucune position ouverte.</td></tr>
                        </tbody>
                    </table>
                </div>

                <div id="history" class="tab-pane">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Actif</th>
                                <th>Sens</th>
                                <th>Lots</th>
                                <th>Ouverture</th>
                                <th>Fermeture</th>
                                <th>Résultat</th>
                            </tr>
                        </thead>
                        <tbody id="positionHistoryTable">
                            <tr><td colspan="6" style="text-align: center; color: var(--color-text-light);">Aucun historique de position.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // JAVASCRIPT
        
        // ----------------------------------------------------
        // --- CONFIGURATION & DATA SIMULATION V2.1 ---
        // ----------------------------------------------------
        const ASSETS = {
            // Forex: 1 Lot standard = 100,000 unités de la devise de base. Valeur nominale en USD.
            'EURUSD': { group: 'Forex', tv_symbol: 'FX_IDC:EURUSD', lot_value_usd: 100000.00, market_coherence: 1.0, current_price: 1.0750, currency: 'USD' },
            'GBPUSD': { group: 'Forex', tv_symbol: 'FX_IDC:GBPUSD', lot_value_usd: 100000.00, market_coherence: 1.2, current_price: 1.2500, currency: 'USD' },
            'USDJPY': { group: 'Forex', tv_symbol: 'FX_IDC:USDJPY', lot_value_usd: 100000.00, market_coherence: 0.9, current_price: 150.00, currency: 'USD' },
            'AUDUSD': { group: 'Forex', tv_symbol: 'FX_IDC:AUDUSD', lot_value_usd: 100000.00, market_coherence: 0.8, current_price: 0.6500, currency: 'USD' },
            'USDCAD': { group: 'Forex', tv_symbol: 'FX_IDC:USDCAD', lot_value_usd: 100000.00, market_coherence: 1.1, current_price: 1.3500, currency: 'USD' },
            // Indices: Valeur de contrat (basée sur 1 point par lot, souvent $1, mais varie pour les indices européens)
            'US100':  { group: 'Index', tv_symbol: 'NASDAQ:NDX', lot_value_usd: 100.00, market_coherence: 20.0, current_price: 17500.00, currency: 'USD' }, // $1/point * 100 points (approximation pour simuler valeur lot)
            'US30':   { group: 'Index', tv_symbol: 'DOWJONES:DJI', lot_value_usd: 100.00, market_coherence: 15.0, current_price: 38000.00, currency: 'USD' }, // $1/point
            'DE40':   { group: 'Index', tv_symbol: 'XETR:DAX', lot_value_usd: 135.00, market_coherence: 18.0, current_price: 18000.00, currency: 'EUR' }, // ~€1/point * 100 (approximation pour simuler valeur lot)
            'UK100':  { group: 'Index', tv_symbol: 'LSE:UKX', lot_value_usd: 120.00, market_coherence: 10.0, current_price: 7800.00, currency: 'GBP' }, // ~£1/point * 100 (approximation pour simuler valeur lot)
            'FR40':   { group: 'Index', tv_symbol: 'EURONEXT:PX1', lot_value_usd: 110.00, market_coherence: 12.0, current_price: 8000.00, currency: 'EUR' }, // ~€1/point * 100 (approximation pour simuler valeur lot)
            // Or: 1 Lot standard = 100 onces (troy)
            'XAUUSD': { group: 'Metal', tv_symbol: 'TVC:GOLD', lot_value_usd: 200000.00, market_coherence: 1.0, current_price: 2000.00, currency: 'USD' } // 100 oz * $2000/oz (simulé)
        };

        // --- Variables Globales ---
        const TV_BASE_URL = "https://fr.tradingview.com/widgetembed/?interval=60&theme=dark&style=1&locale=fr&toolbar_bg=%231c2025&enable_publishing=false&allow_symbol_change=true&container_id=tradingview_widget&symbol=";
        let currentAsset = 'EURUSD';
        let balance = 50000.00; // Solde initial 50 K
        let positions = [];
        let history = [];
        let positionIdCounter = 1;
        let pnlInterval;
        
        // --- Fonctions Utilitaires ---

        function updateBalance(amount) {
            balance += amount;
            document.getElementById('currentBalance').textContent = balance.toFixed(2) + ' $';
        }

        function playSound(type) {
            // Implémentation du son (nécessite des fichiers audio valides)
            const soundElement = document.getElementById(type === 'taken' ? 'orderTakenSound' : 'orderRejectedSound');
            if (soundElement && soundElement.src && soundElement.src.includes('http')) {
                 soundElement.play().catch(e => console.error("Audio playback error:", e));
            } else {
                 console.log(`Sound (${type}) simulation: You need to set valid audio files.`);
            }
        }
        
        function formatLotValue(value) {
            // Formate pour l'affichage (avec K, M, etc.)
            if (value >= 1000000) return (value / 1000000).toFixed(1) + ' M $';
            if (value >= 1000) return (value / 1000).toFixed(1) + ' K $';
            return value.toFixed(2) + ' $';
        }

        // Simule le prix actuel (remplace l'appel API)
        function fetchCurrentPrice(symbol) {
            const asset = ASSETS[symbol];
            const basePrice = asset.current_price;
            
            // Simule une fluctuation basée sur la cohérence du marché
            let fluctuation = (Math.random() - 0.5) * 0.001; 
            if (asset.group === 'Index') {
                 fluctuation = (Math.random() - 0.5) * 5; // Variation plus importante pour les indices
            }
            
            const newPrice = basePrice + (fluctuation * asset.market_coherence);
            asset.current_price = newPrice;
            return newPrice;
        }

        // --- Watchlist & Chart ---

        function renderWatchlist() {
            const watchlistEl = document.getElementById('watchlist');
            watchlistEl.innerHTML = '';

            Object.keys(ASSETS).forEach(symbol => {
                const asset = ASSETS[symbol];
                const item = document.createElement('div');
                item.className = `asset-item ${symbol === currentAsset ? 'active' : ''}`;
                item.setAttribute('data-symbol', symbol);
                
                // Détermine le nombre de décimales
                const decimals = (asset.group === 'Index' || asset.group === 'Metal') ? 2 : 5; 

                item.innerHTML = `
                    <span class="symbol">${symbol}</span>
                    <span class="price" id="price-${symbol}">${asset.current_price.toFixed(decimals)}</span>
                `;
                item.onclick = () => selectAsset(symbol);
                watchlistEl.appendChild(item);
            });
            // Démarre la simulation des prix en direct
            setInterval(updateWatchlistPrices, 3000);
        }

        function updateWatchlistPrices() {
            Object.keys(ASSETS).forEach(symbol => {
                const price = fetchCurrentPrice(symbol);
                const priceEl = document.getElementById(`price-${symbol}`);
                if (priceEl) {
                    const decimals = (ASSETS[symbol].group === 'Index' || ASSETS[symbol].group === 'Metal') ? 2 : 5;
                    priceEl.textContent = price.toFixed(decimals);
                    // Simuler la couleur de changement
                    const lastPrice = parseFloat(priceEl.getAttribute('data-last-price') || price);
                    if (price > lastPrice) {
                        priceEl.style.color = 'var(--color-green)';
                    } else if (price < lastPrice) {
                        priceEl.style.color = 'var(--color-red)';
                    }
                    priceEl.setAttribute('data-last-price', price);
                }
            });
        }

        function selectAsset(symbol) {
            currentAsset = symbol;
            
            // 1. Mettre à jour l'iFrame TradingView
            const tvSymbol = ASSETS[symbol].tv_symbol;
            document.getElementById('tradingViewChart').src = TV_BASE_URL + tvSymbol;

            // 2. Mettre à jour l'affichage de la Watchlist
            document.querySelectorAll('.asset-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`.asset-item[data-symbol="${symbol}"]`).classList.add('active');

            // 3. Mettre à jour le panneau de prise d'ordre
            const assetInfo = ASSETS[symbol];
            document.getElementById('order-panel-asset').textContent = `Passer un Ordre (${symbol})`;
            document.getElementById('lotInfo').textContent = 
                `1.0 Lot ${symbol} ≈ ${assetInfo.lot_value_usd.toLocaleString('fr-FR', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 })}`;
        }

        // --- Gestion des Ordres ---
        
        function placeOrder(direction) {
            const symbol = currentAsset;
            const lotSize = parseFloat(document.getElementById('lotSize').value);
            const orderType = document.getElementById('orderType').value;
            const limitPrice = parseFloat(document.getElementById('limitPrice').value);
            const stopLoss = parseFloat(document.getElementById('stopLoss').value);
            const takeProfit = parseFloat(document.getElementById('takeProfit').value);
            const assetInfo = ASSETS[symbol];
            const currentPrice = assetInfo.current_price;

            if (isNaN(lotSize) || lotSize <= 0.0) {
                 alert("REFUSÉ: Le volume (Lots) doit être positif.");
                 playSound('rejected');
                 return;
            }

            // 1. Vérification Marge (Valeur Nominale)
            // On vérifie que l'exposition totale ne dépasse pas le solde (vérification simplifiée pour la prop firm)
            const requiredMargin = lotSize * assetInfo.lot_value_usd; 
            if (requiredMargin > balance) {
                alert(`REFUSÉ: Marge insuffisante. ${lotSize} Lots sur ${symbol} nécessite une exposition de ${requiredMargin.toFixed(2)}$ qui dépasse votre solde de ${balance.toFixed(2)}$.`);
                playSound('rejected');
                return;
            }

            // 2. Traitement de l'Ordre
            if (orderType === 'market') {
                const newPosition = {
                    id: positionIdCounter++,
                    symbol: symbol,
                    direction: direction,
                    lots: lotSize,
                    openPrice: currentPrice,
                    sl: isNaN(stopLoss) ? null : stopLoss,
                    tp: isNaN(takeProfit) ? null : takeProfit,
                    openTime: new Date(),
                    pnl: 0.00
                };
                positions.push(newPosition);
                updatePositionsDisplay();
                playSound('taken');
            } else if (orderType === 'limit') {
                if (isNaN(limitPrice) || limitPrice <= 0) {
                     alert("REFUSÉ: Vous devez spécifier un Prix Limite valide pour un ordre Limite.");
                     playSound('rejected');
                     return;
                }
                // Simulation d'Ordre Limite
                alert(`Ordre Limite de ${lotSize} lots ${direction.toUpperCase()} sur ${symbol} au prix de ${limitPrice.toFixed(4)} est en attente.`);
                playSound('taken');
            }
        }
        
        // --- PnL, Stop/TP & Fermeture ---
        
        function calculateAndCheckPnL() {
            if (positions.length === 0) return;

            // Mettre à jour les prix une fois pour tous les actifs
            updateWatchlistPrices(); 

            positions = positions.filter(pos => {
                const currentPrice = ASSETS[pos.symbol].current_price;
                const assetInfo = ASSETS[pos.symbol];
                
                // Facteur de cohérence du marché pour le PnL (plus la coherence est élevée, plus le PnL fluctue rapidement)
                // C'est la valeur du pip/point pour 1 lot dans la devise du compte ($)
                let pipsValue; 
                if (assetInfo.group === 'Forex') {
                    // 1 pip (0.0001) vaut 10$ pour un lot standard (approximation)
                    pipsValue = 10.0; 
                } else if (assetInfo.group === 'Metal') {
                    // 1 point (0.01) vaut 10$ pour 1 lot standard (approximation)
                    pipsValue = 10.0;
                } else {
                    // Indices (Valeur du point approx. $1 * market_coherence)
                    pipsValue = 1.0 * (assetInfo.lot_value_usd / 100); 
                }

                let priceChange;
                if (pos.direction === 'buy') {
                    priceChange = currentPrice - pos.openPrice;
                } else {
                    priceChange = pos.openPrice - currentPrice;
                }
                
                // PnL = (Changement de prix / Taille du pas de prix) * (Valeur du pip/point * Lots)
                // Pour Forex (pas de 0.0001)
                const priceStep = (assetInfo.group === 'Forex') ? 0.0001 : (assetInfo.group === 'Index' ? 1.0 : 0.01); 

                let pnl = (priceChange / priceStep) * pipsValue * pos.lots;
                pos.pnl = pnl;

                // 1. Check Stop Loss / Take Profit (Logique maintenue)
                if ((pos.sl && pos.direction === 'buy' && currentPrice <= pos.sl) || 
                    (pos.sl && pos.direction === 'sell' && currentPrice >= pos.sl)) {
                    closePosition(pos.id, 'SL', currentPrice);
                    return false; 
                }
                if ((pos.tp && pos.direction === 'buy' && currentPrice >= pos.tp) || 
                    (pos.tp && pos.direction === 'sell' && currentPrice <= pos.tp)) {
                    closePosition(pos.id, 'TP', currentPrice);
                    return false; 
                }
                return true; 
            });

            updatePositionsDisplay();
        }

        function closePosition(id, reason = 'Manuelle', closePrice = null) {
            const index = positions.findIndex(p => p.id === id);
            if (index === -1) return;

            const closedPos = positions.splice(index, 1)[0];
            const finalPnl = closedPos.pnl; 

            updateBalance(finalPnl);

            history.push({
                ...closedPos,
                closePrice: closePrice || ASSETS[closedPos.symbol].current_price,
                closeTime: new Date(),
                result: finalPnl,
