<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>AmA Broker — Web Trader Demo</title>
<style>
/* ... Reste inchangé ... */
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">AmA <span>Broker</span></div>
    <div class="controls">
      <label>Actif :
        <select id="symbolSelect">
          <optgroup label="Indices">
            <option value="SPX">S&P 500</option>
            <option value="DJI">Dow Jones</option>
            <option value="NDX">NASDAQ 100</option>
            <option value="FTSE">FTSE 100</option>
            <option value="DAX">DAX 40</option>
            <option value="FCHI">CAC 40</option>
            <option value="NKY">Nikkei 225</option>
          </optgroup>
          <optgroup label="Forex">
            <option value="EUR/USD">EUR/USD</option>
            <option value="GBP/USD">GBP/USD</option>
            <option value="USD/JPY">USD/JPY</option>
            <option value="AUD/USD">AUD/USD</option>
            <option value="USD/CAD">USD/CAD</option>
          </optgroup>
          <optgroup label="Métaux">
            <option value="XAU/USD">Or (Gold)</option>
          </optgroup>
        </select>
      </label>
      <div class="price">Prix actuel : <span id="priceDisplay">—</span></div>
      <label>Lots :
        <input type="number" id="lotInput" value="1" min="1" step="1" style="width:70px;text-align:center;">
      </label>
    </div>
  </header>

  <main class="layout">
    <section class="chart">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0;color:#22d3ee;">Graphique</h3>
        <button class="full-btn" onclick="toggleFullscreen()">⛶ Plein écran</button>
      </div>
      <iframe id="tradingviewIframe"
        src="https://s.tradingview.com/widgetembed/?symbol=INDEX:SPX&interval=1&theme=dark&hide_side_toolbar=1"></iframe>

      <div class="tradebox">
        <button class="buy" onclick="placeOrder('buy')">ACHETER</button>
        <button class="sell" onclick="placeOrder('sell')">VENDRE</button>
      </div>
    </section>

    <aside class="sidebar">
      <div class="panel">
        <h3 style="color:#22d3ee;">Positions Ouvertes</h3>
        <table id="positionsTable">
          <thead><tr><th>Sym</th><th>Side</th><th>Lots</th><th>Entrée</th><th>Dernier</th><th>PnL</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <div id="totalPnl" class="total-pnl">PnL total : 0.0000</div>
      </div>
    </aside>
  </main>

  <footer>© 2025 AmA Broker • Données Stooq • Graphiques TradingView</footer>
</div>

<script>
const SYMBOL_MAP_STOOQ = {
  SPX:"^SPX",
  DJI:"^DJI",
  NDX:"^NDX",
  FTSE:"^FTSE",
  DAX:"^GDAXI",
  FCHI:"^FCHI",
  NKY:"^N225",
  "EUR/USD":"EURUSD",
  "GBP/USD":"GBPUSD",
  "USD/JPY":"USDJPY",
  "AUD/USD":"AUDUSD",
  "USD/CAD":"USDCAD",
  "XAU/USD":"GC.F"
};

const SYMBOL_MAP_TV = {
  SPX: "INDEX:SPX",             // S&P 500 [finance:S&P 500]
  DJI: "INDEX:DJI",             // Dow Jones [finance:Dow Jones Industrial Average]
  NDX: "INDEX:NDX",             // NASDAQ 100 [finance:NASDAQ 100]
  FTSE: "INDEX:UKX",            // FTSE 100 [finance:FTSE 100]
  DAX: "XETR:DAX40",            // DAX 40 [finance:DAX]
  FCHI: "EURONEXT:FCHI",        // CAC 40 [finance:CAC 40]
  NKY: "INDEX:NKY",             // Nikkei 225 [finance:Nikkei 225]
  "EUR/USD": "FX:EURUSD",
  "GBP/USD": "FX:GBPUSD",
  "USD/JPY": "FX:USDJPY",
  "AUD/USD": "FX:AUDUSD",
  "USD/CAD": "FX:USDCAD",
  "XAU/USD": "TVC:GOLD"
};

const CORS_PROXY = "https://corsproxy.io/?";

let positions = [];
let currentSymbol = "SPX";
let lastPrices = {};

async function fetchStooqPrice(symbol){
  try{
    const stooqSymbol = SYMBOL_MAP_STOOQ[symbol];
    const url = CORS_PROXY + encodeURIComponent(`https://stooq.com/q/l/?s=${stooqSymbol}&f=sd2t2ohlcv&h&e=csv`);
    const res = await fetch(url);
    if(!res.ok) return null;
    const text = await res.text();
    if(text.includes("N/D")) return null;
    const line = text.split("\n")[1];
    if(!line) return null;
    const last = parseFloat(line.split(",")[6]);
    return isNaN(last)?null:last;
  }catch(e){console.error(e);return null;}
}

async function refreshAllPrices(){
  const needed = new Set();
  needed.add(currentSymbol);
  positions.forEach(p=>needed.add(p.symbol));

  for(const sym of needed){
    const price = await fetchStooqPrice(sym);
    if(price) lastPrices[sym]=price;
  }

  if(lastPrices[currentSymbol]){
    document.getElementById("priceDisplay").innerText = lastPrices[currentSymbol].toFixed(4);
  }

  updatePnL();
}
setInterval(refreshAllPrices,1000);
refreshAllPrices();

async function placeOrder(side){
  const price = await fetchStooqPrice(currentSymbol);
  if(!price) return alert("Impossible d'obtenir le prix.");
  const qty = parseInt(document.getElementById("lotInput").value)||1;
  positions.push({id:Date.now(),symbol:currentSymbol,side,qty,entry:price,pnl:0});
  renderPositions();
}

function closePosition(id){
  positions = positions.filter(p=>p.id!==id);
  renderPositions();
}

function updatePnL(){
  let total=0;
  positions.forEach(p=>{
    const price = lastPrices[p.symbol];
    if(!price) return;
    const dir = p.side==="buy"?1:-1;
    p.pnl = (price-p.entry)*dir*p.qty;
    total+=p.pnl;
  });
  renderPositions(total);
}

function renderPositions(total=0){
  const tbody=document.querySelector("#positionsTable tbody");
  tbody.innerHTML="";
  positions.forEach(p=>{
    const last = lastPrices[p.symbol]??null;
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${p.symbol}</td>
      <td>${p.side}</td>
      <td>${p.qty}</td>
      <td>${p.entry.toFixed(4)}</td>
      <td>${last?last.toFixed(4):"—"}</td>
      <td style="color:${p.pnl>0?"#10b981":p.pnl<0?"#ef4444":"white"}">${p.pnl.toFixed(4)}</td>
      <td><button onclick="closePosition(${p.id})" style="background:#334155;color:white;border:0;padding:4px 8px;border-radius:6px;cursor:pointer;">✖</button></td>
    `;
    tbody.appendChild(tr);
  });

  const t=document.getElementById("totalPnl");
  t.innerText="PnL total : "+total.toFixed(4);
  t.style.color=total>0?"#10b981":total<0?"#ef4444":"#22d3ee";
}

document.getElementById("symbolSelect").addEventListener("change", e=>{
  currentSymbol=e.target.value;
  const tv=SYMBOL_MAP_TV[currentSymbol];
  document.getElementById("tradingviewIframe").src=`https://s.tradingview.com/widgetembed/?symbol=${tv}&interval=1&theme=dark&hide_side_toolbar=1`;
  refreshAllPrices();
});

function toggleFullscreen(){
  document.getElementById("tradingviewIframe").classList.toggle("fullscreen");
}
</script>
</body>
</html>
