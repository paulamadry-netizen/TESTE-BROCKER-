<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forex Trading Simulator</title>
<style>
:root{
--bg:#0a0e27;
--panel:#111827;
--border:#1f2937;
--text:#e5e7eb;
--text-dim:#9ca3af;
--accent:#3b82f6;
--accent-hover:#2563eb;
--success:#10b981;
--danger:#ef4444;
--warning:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
background:var(--bg);
color:var(--text);
overflow:hidden;
}
.container{
display:grid;
grid-template-columns:280px 1fr 320px;
grid-template-rows:60px 1fr 200px;
height:100vh;
gap:1px;
background:var(--border);
}
header{
grid-column:1/4;
background:var(--panel);
padding:0 20px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--border);
}
.logo{
font-size:24px;
font-weight:700;
background:linear-gradient(135deg,#3b82f6,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.header-controls{
display:flex;
gap:15px;
align-items:center;
}
.balance-display{
display:flex;
gap:20px;
font-size:14px;
}
.balance-item{
display:flex;
flex-direction:column;
}
.balance-label{
color:var(--text-dim);
font-size:11px;
text-transform:uppercase;
letter-spacing:.5px;
}
.balance-value{
font-weight:600;
font-size:16px;
margin-top:2px;
}
.ws-status{
width:8px;
height:8px;
border-radius:50%;
background:var(--danger);
}
.ws-status.connected{background:var(--success)}
.sidebar{
background:var(--panel);
overflow-y:auto;
}
.sidebar-section{
padding:15px;
border-bottom:1px solid var(--border);
}
.section-title{
font-size:12px;
text-transform:uppercase;
color:var(--text-dim);
letter-spacing:1px;
margin-bottom:10px;
font-weight:600;
}
.watchlist{
display:flex;
flex-direction:column;
gap:2px;
}
.watchlist-item{
padding:10px;
background:var(--bg);
border-radius:6px;
cursor:pointer;
transition:all .2s;
display:flex;
justify-content:space-between;
align-items:center;
}
.watchlist-item:hover{
background:var(--border);
transform:translateX(2px);
}
.watchlist-item.active{
background:var(--accent);
color:white;
}
.symbol-name{
font-weight:600;
font-size:14px;
}
.symbol-price{
font-size:13px;
font-family:'Courier New',monospace;
}
.main-chart{
background:var(--panel);
position:relative;
overflow:hidden;
}
#tradingview_chart{
width:100%;
height:100%;
}
.right-panel{
background:var(--panel);
display:flex;
flex-direction:column;
}
.trade-panel{
padding:20px;
border-bottom:1px solid var(--border);
}
.price-display{
text-align:center;
margin-bottom:20px;
}
.current-price{
font-size:32px;
font-weight:700;
font-family:'Courier New',monospace;
}
.price-change{
font-size:14px;
margin-top:5px;
}
.price-change.positive{color:var(--success)}
.price-change.negative{color:var(--danger)}
.trade-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}
.btn{
padding:12px;
border:none;
border-radius:8px;
font-weight:600;
cursor:pointer;
transition:all .2s;
font-size:14px;
}
.btn-buy{
background:var(--success);
color:white;
}
.btn-buy:hover{
background:#059669;
transform:translateY(-1px);
}
.btn-sell{
background:var(--danger);
color:white;
}
.btn-sell:hover{
background:#dc2626;
transform:translateY(-1px);
}
.btn-secondary{
background:var(--border);
color:var(--text);
}
.btn-secondary:hover{
background:var(--accent);
}
.input-group{
margin-bottom:15px;
}
.input-group label{
display:block;
font-size:12px;
color:var(--text-dim);
margin-bottom:5px;
text-transform:uppercase;
letter-spacing:.5px;
}
.input-group input{
width:100%;
padding:10px;
background:var(--bg);
border:1px solid var(--border);
border-radius:6px;
color:var(--text);
font-size:14px;
}
.input-group input:focus{
outline:none;
border-color:var(--accent);
}
.positions-panel{
flex:1;
overflow-y:auto;
padding:15px;
}
.position-card{
background:var(--bg);
border-radius:8px;
padding:12px;
margin-bottom:10px;
border-left:3px solid var(--accent);
}
.position-card.long{border-left-color:var(--success)}
.position-card.short{border-left-color:var(--danger)}
.position-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:8px;
}
.position-symbol{
font-weight:600;
font-size:14px;
}
.position-type{
font-size:11px;
padding:3px 8px;
border-radius:12px;
text-transform:uppercase;
font-weight:600;
}
.position-type.long{
background:var(--success);
color:white;
}
.position-type.short{
background:var(--danger);
color:white;
}
.position-details{
font-size:12px;
color:var(--text-dim);
display:grid;
grid-template-columns:1fr 1fr;
gap:5px;
}
.position-pnl{
margin-top:8px;
padding-top:8px;
border-top:1px solid var(--border);
display:flex;
justify-content:space-between;
align-items:center;
}
.pnl-value{
font-weight:700;
font-size:14px;
}
.pnl-value.positive{color:var(--success)}
.pnl-value.negative{color:var(--danger)}
.close-btn{
padding:4px 12px;
background:var(--danger);
color:white;
border:none;
border-radius:4px;
cursor:pointer;
font-size:11px;
font-weight:600;
}
.close-btn:hover{
background:#dc2626;
}
.bottom-panel{
grid-column:1/4;
background:var(--panel);
border-top:1px solid var(--border);
}
.tabs{
display:flex;
border-bottom:1px solid var(--border);
}
.tab{
padding:12px 24px;
cursor:pointer;
font-size:13px;
font-weight:600;
color:var(--text-dim);
border-bottom:2px solid transparent;
transition:all .2s;
}
.tab:hover{
color:var(--text);
}
.tab.active{
color:var(--accent);
border-bottom-color:var(--accent);
}
.tab-content{
display:none;
padding:15px;
height:calc(100% - 45px);
overflow-y:auto;
}
.tab-content.active{
display:block;
}
table{
width:100%;
border-collapse:collapse;
font-size:13px;
}
th{
text-align:left;
padding:10px;
color:var(--text-dim);
font-weight:600;
text-transform:uppercase;
font-size:11px;
letter-spacing:.5px;
border-bottom:1px solid var(--border);
}
td{
padding:10px;
border-bottom:1px solid var(--border);
}
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
z-index:1000;
align-items:center;
justify-content:center;
}
.modal.active{
display:flex;
}
.modal-content{
background:var(--panel);
border-radius:12px;
padding:30px;
max-width:500px;
width:90%;
border:1px solid var(--border);
}
.modal-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}
.modal-title{
font-size:20px;
font-weight:700;
}
.close-modal{
background:none;
border:none;
color:var(--text-dim);
font-size:24px;
cursor:pointer;
padding:0;
width:30px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
}
.close-modal:hover{
color:var(--text);
}
::-webkit-scrollbar{
width:8px;
}
::-webkit-scrollbar-track{
background:var(--panel);
}
::-webkit-scrollbar-thumb{
background:var(--border);
border-radius:4px;
}
::-webkit-scrollbar-thumb:hover{
background:var(--accent);
}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">⚡ ForexSim Pro</div>
<div class="header-controls">
<div class="balance-display">
<div class="balance-item">
<span class="balance-label">Balance</span>
<span class="balance-value" id="balance">$50,000.00</span>
</div>
<div class="balance-item">
<span class="balance-label">Equity</span>
<span class="balance-value" id="equity">$50,000.00</span>
</div>
</div>
<div class="ws-status" id="wsStatus"></div>
</div>
</header>
<aside class="sidebar">
<div class="sidebar-section">
<h3 class="section-title">Watchlist</h3>
<div class="watchlist" id="watchlist"></div>
</div>
</aside>
<main class="main-chart">
<div id="tradingview_chart"></div>
</main>
<aside class="right-panel">
<div class="trade-panel">
<div class="price-display">
<div class="current-price" id="currentPrice">-.----</div>
<div class="price-change" id="priceChange">+0.00%</div>
</div>
<div class="input-group">
<label>Lot Size</label>
<input type="number" id="lotSize" value="1" min="0.01" step="0.01">
</div>
<div class="input-group">
<label>Stop Loss (pips)</label>
<input type="number" id="stopLoss" value="50" min="0">
</div>
<div class="input-group">
<label>Take Profit (pips)</label>
<input type="number" id="takeProfit" value="100" min="0">
</div>
<div class="trade-buttons">
<button class="btn btn-buy" onclick="openPosition('long')">BUY</button>
<button class="btn btn-sell" onclick="openPosition('short')">SELL</button>
</div>
</div>
<div class="positions-panel">
<h3 class="section-title">Open Positions</h3>
<div id="positionsList"></div>
</div>
</aside>
<div class="bottom-panel">
<div class="tabs">
<div class="tab active" onclick="switchTab('history')">History</div>
<div class="tab" onclick="switchTab('orders')">Orders</div>
<div class="tab" onclick="switchTab('debug')">Debug</div>
</div>
<div class="tab-content active" id="history-content">
<table id="historyTable">
<thead>
<tr>
<th>Time</th>
<th>Symbol</th>
<th>Type</th>
<th>Lots</th>
<th>Open</th>
<th>Close</th>
<th>P&L</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
<div class="tab-content" id="orders-content">
<table id="ordersTable">
<thead>
<tr>
<th>Symbol</th>
<th>Type</th>
<th>Lots</th>
<th>Entry</th>
<th>SL</th>
<th>TP</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
<div class="tab-content" id="debug-content">
<div id="debugLog" style="font-family:monospace;font-size:11px;"></div>
</div>
</div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const WATCHLIST=['EUR_USD','GBP_USD','USD_JPY','USD_CHF','AUD_USD','USD_CAD','NZD_USD','EUR_GBP','EUR_JPY','GBP_JPY','AUD_CAD','AUD_NZD','NZD_JPY','CHF_JPY','XAU_USD','XAG_USD','COPPER','ZINC','COFFEE','WTI','SPY','DIA','QQQ'];
const PIP_STEPS={
EUR_USD:1e-4,GBP_USD:1e-4,USD_JPY:1e-2,USD_CHF:1e-4,AUD_USD:1e-4,
USD_CAD:1e-4,NZD_USD:1e-4,EUR_GBP:1e-4,EUR_JPY:1e-2,GBP_JPY:1e-2,
AUD_CAD:1e-4,AUD_NZD:1e-4,NZD_JPY:1e-2,CHF_JPY:1e-2,
XAU_USD:.01,XAG_USD:.001,COPPER:.0001,ZINC:.0001,COFFEE:.01,WTI:.01,
SPY:.01,DIA:.01,QQQ:.01
};
const CFG={ws:'wss://finnhub-proxy-477220862918.europe-west1.run.app',wsNew:'wss://finnhub-proxy-29-44407447466.europe-west1.run.app',keepalive:2e4,reconBase:2e3,reconMax:3e4,baseLot:1e5,leverage:20};
const NEW_SYMBOLS=['AUD_CAD','AUD_NZD','NZD_JPY','CHF_JPY','XAU_USD','XAG_USD','COPPER','ZINC','COFFEE','WTI','SPY','DIA','QQQ'];
let ws,wsNew,wsConnected=false,wsNewConnected=false,reconDelay=CFG.reconBase,reconDelayNew=CFG.reconBase,reconAttempts=0,reconAttemptsNew=0,reconTimer,reconTimerNew,keepaliveTimer,keepaliveTimerNew,currentSymbol=WATCHLIST[0],priceCache={},lastPriceUpdate={},positions=[],history=[],orders=[],simBalance=50000,availableBalance=50000,tvWidget,lwChart,lwSeries,debugMode=false,activeModalId=null;

function log(...args){
const ts=new Date().toISOString().substr(11,12);
console.log(`[${ts}]`,...args);
if(debugMode){
const debugLog=document.getElementById('debugLog');
if(debugLog){
const msg=`[${ts}] ${args.join(' ')}\n`;
debugLog.textContent+=msg;
debugLog.scrollTop=debugLog.scrollHeight;
}
}
}

const startKeepalive=()=>{
if(keepaliveTimer)clearInterval(keepaliveTimer);
keepaliveTimer=setInterval(()=>{
if(ws&&ws.readyState===WebSocket.OPEN){
try{ws.send(JSON.stringify({type:'ping'}));log('Ping old')}
catch(e){log(`Keepalive error old: ${e.message}`)}
}
},CFG.keepalive);
};

const startKeepaliveNew=()=>{
if(keepaliveTimerNew)clearInterval(keepaliveTimerNew);
keepaliveTimerNew=setInterval(()=>{
if(wsNew&&wsNew.readyState===WebSocket.OPEN){
try{wsNew.send(JSON.stringify({type:'ping'}));log('Ping new')}
catch(e){log(`Keepalive error new: ${e.message}`)}
}
},CFG.keepalive);
};

const stopKeepalive=()=>{if(keepaliveTimer){clearInterval(keepaliveTimer);keepaliveTimer=null}};
const stopKeepaliveNew=()=>{if(keepaliveTimerNew){clearInterval(keepaliveTimerNew);keepaliveTimerNew=null}};

const scheduleReconnect=()=>{
stopKeepalive();
if(reconTimer)clearTimeout(reconTimer);
reconAttempts++;
reconDelay=Math.min(CFG.reconMax,CFG.reconBase*Math.pow(1.5,reconAttempts));
log(`Reconnect old in ${reconDelay}ms (attempt ${reconAttempts})`);
reconTimer=setTimeout(startWebSocket,reconDelay);
};

const scheduleReconnectNew=()=>{
stopKeepaliveNew();
if(reconTimerNew)clearTimeout(reconTimerNew);
reconAttemptsNew++;
reconDelayNew=Math.min(CFG.reconMax,CFG.reconBase*Math.pow(1.5,reconAttemptsNew));
log(`Reconnect new in ${reconDelayNew}ms (attempt ${reconAttemptsNew})`);
reconTimerNew=setTimeout(startWebSocketNew,reconDelayNew);
};

const setWsStatus=(status)=>{
const el=document.getElementById('wsStatus');
const anyConnected=wsConnected||wsNewConnected;
if(status==='connected'&&anyConnected){
el.className='status-badge connected';
el.innerHTML='<div class="status-dot"></div><span>Connecté</span>';
}else if(status==='connecting'){
el.className='status-badge connecting';
el.innerHTML='<div class="status-dot"></div><span>Connexion...</span>';
}else{
el.className='status-badge disconnected';
el.innerHTML='<div class="status-dot"></div><span>Déconnecté</span>';
}
};

const startWebSocket=()=>{
if(ws&&(ws.readyState===WebSocket.CONNECTING||ws.readyState===WebSocket.OPEN))return;
try{
log(`Connecting old: ${CFG.ws}`);
setWsStatus('connecting');
ws=new WebSocket(CFG.ws);
ws.onopen=()=>{
log('Old WS connected');
wsConnected=true;
setWsStatus('connected');
reconAttempts=0;
reconDelay=CFG.reconBase;
WATCHLIST.forEach(w=>{
if(!NEW_SYMBOLS.includes(w)){
try{ws.send(JSON.stringify({type:'subscribe',symbol:`OANDA:${w}`}))}
catch(e){log(`Subscribe error old: ${e.message}`)}
}
});
startKeepalive();
};
ws.onmessage=(evt)=>{try{handleWsMessage(JSON.parse(evt.data))}catch(e){log(`Parse error old: ${e.message}`)}};
ws.onerror=(err)=>{log(`WS error old: ${err}`)};
ws.onclose=()=>{
log('Old WS closed');
wsConnected=false;
setWsStatus('disconnected');
scheduleReconnect();
};
}catch(e){
log(`Connection error old: ${e.message}`);
scheduleReconnect();
}
};

const startWebSocketNew=()=>{
if(wsNew&&(wsNew.readyState===WebSocket.CONNECTING||wsNew.readyState===WebSocket.OPEN))return;
try{
log(`Connecting new: ${CFG.wsNew}`);
setWsStatus('connecting');
wsNew=new WebSocket(CFG.wsNew);
wsNew.onopen=()=>{
log('New WS connected');
wsNewConnected=true;
setWsStatus('connected');
reconAttemptsNew=0;
reconDelayNew=CFG.reconBase;
NEW_SYMBOLS.forEach(sym=>{
try{wsNew.send(JSON.stringify({type:'subscribe',symbol:`OANDA:${sym}`}))}
catch(e){log(`Subscribe error new: ${e.message}`)}
});
startKeepaliveNew();
};
wsNew.onmessage=(evt)=>{try{handleWsMessage(JSON.parse(evt.data))}catch(e){log(`Parse error new: ${e.message}`)}};
wsNew.onerror=(err)=>{log(`WS error new: ${err}`)};
wsNew.onclose=()=>{
log('New WS closed');
wsNewConnected=false;
setWsStatus('disconnected');
scheduleReconnectNew();
};
}catch(e){
log(`Connection error new: ${e.message}`);
scheduleReconnectNew();
}
};

function handleWsMessage(msg){
if(msg.type==='trade'&&msg.data){
msg.data.forEach(t=>{
const sym=t.s.replace('OANDA:','');
const price=t.p;
if(WATCHLIST.includes(sym)){
priceCache[sym]=price;
lastPriceUpdate[sym]=Date.now();
if(sym===currentSymbol){
updatePriceDisplay(price);
}
updateWatchlistItem(sym,price);
}
});
updatePositions();
}
}

function updatePriceDisplay(price){
const el=document.getElementById('currentPrice');
if(el)el.textContent=price.toFixed(getPipDecimals(currentSymbol));
}

function getPipDecimals(sym){
const step=PIP_STEPS[sym]||1e-4;
return step>=1?2:step>=.01?2:step>=.001?3:step>=1e-4?4:5;
}

function updateWatchlistItem(sym,price){
const el=document.querySelector(`[data-symbol="${sym}"] .symbol-price`);
if(el)el.textContent=price.toFixed(getPipDecimals(sym));
}

function updatePositions(){
let totalPnL=0;
positions.forEach(pos=>{
const currentPrice=priceCache[pos.symbol];
if(!currentPrice)return;
const mult=pos.type==='long'?1:-1;
const priceDiff=mult*(currentPrice-pos.openPrice);
const pipValue=CFG.baseLot*pos.lots*(PIP_STEPS[pos.symbol]||1e-4);
pos.pnl=priceDiff/pipValue*(CFG.baseLot*pos.lots/CFG.baseLot)*10;
totalPnL+=pos.pnl;
// Check SL/TP
if(pos.stopLoss&&((pos.type==='long'&&currentPrice<=pos.stopLoss)||(pos.type==='short'&&currentPrice>=pos.stopLoss))){
closePosition(pos.id,'Stop Loss');
}else if(pos.takeProfit&&((pos.type==='long'&&currentPrice>=pos.takeProfit)||(pos.type==='short'&&currentPrice<=pos.takeProfit))){
closePosition(pos.id,'Take Profit');
}
});
renderPositions();
const equity=simBalance+totalPnL;
document.getElementById('balance').textContent='$'+simBalance.toFixed(2);
document.getElementById('equity').textContent='$'+equity.toFixed(2);
}

function renderPositions(){
const container=document.getElementById('positionsList');
if(!container)return;
if(positions.length===0){
container.innerHTML='<p style="color:var(--text-dim);text-align:center;padding:20px;">No open positions</p>';
return;
}
container.innerHTML=positions.map(pos=>{
const pnlClass=pos.pnl>=0?'positive':'negative';
return`
<div class="position-card ${pos.type}">
<div class="position-header">
<span class="position-symbol">${pos.symbol}</span>
<span class="position-type ${pos.type}">${pos.type}</span>
</div>
<div class="position-details">
<div>Lots: ${pos.lots}</div>
<div>Entry: ${pos.openPrice.toFixed(getPipDecimals(pos.symbol))}</div>
<div>SL: ${pos.stopLoss?pos.stopLoss.toFixed(getPipDecimals(pos.symbol)):'--'}</div>
<div>TP: ${pos.takeProfit?pos.takeProfit.toFixed(getPipDecimals(pos.symbol)):'--'}</div>
</div>
<div class="position-pnl">
<span class="pnl-value ${pnlClass}">$${pos.pnl.toFixed(2)}</span>
<button class="close-btn" onclick="closePosition(${pos.id})">Close</button>
</div>
</div>
`;
}).join('');
}

function openPosition(type){
const price=priceCache[currentSymbol];
if(!price){
alert('No price data available');
return;
}
const lots=parseFloat(document.getElementById('lotSize').value)||1;
const slPips=parseFloat(document.getElementById('stopLoss').value)||0;
const tpPips=parseFloat(document.getElementById('takeProfit').value)||0;
const pipStep=PIP_STEPS[currentSymbol]||1e-4;
const position={
id:Date.now(),
symbol:currentSymbol,
type:type,
lots:lots,
openPrice:price,
openTime:new Date(),
stopLoss:slPips>0?(type==='long'?price-slPips*pipStep:price+slPips*pipStep):null,
takeProfit:tpPips>0?(type==='long'?price+tpPips*pipStep:price-tpPips*pipStep):null,
pnl:0
};
positions.push(position);
log(`Opened ${type} ${lots} lots ${currentSymbol} @ ${price}`);
renderPositions();
}

function closePosition(id,reason='Manual'){
const pos=positions.find(p=>p.id===id);
if(!pos)return;
const closePrice=priceCache[pos.symbol];
if(!closePrice)return;
simBalance+=pos.pnl;
history.unshift({
closeTime:new Date(),
...pos,
closePrice:closePrice,
reason:reason
});
positions=positions.filter(p=>p.id!==id);
log(`Closed ${pos.type} ${pos.lots} lots ${pos.symbol} P&L: $${pos.pnl.toFixed(2)} (${reason})`);
renderPositions();
renderHistory();
}

function renderHistory(){
const tbody=document.querySelector('#historyTable tbody');
if(!tbody)return;
tbody.innerHTML=history.slice(0,50).map(h=>{
const pnlClass=h.pnl>=0?'positive':'negative';
return`
<tr>
<td>${h.closeTime.toLocaleTimeString()}</td>
<td>${h.symbol}</td>
<td>${h.type.toUpperCase()}</td>
<td>${h.lots}</td>
<td>${h.openPrice.toFixed(getPipDecimals(h.symbol))}</td>

<td class="pnl-value ${pnlClass}">$${h.pnl.toFixed(2)}</td>
</tr>
`;
}).join('');
}

function switchTab(tabName){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
event.target.classList.add('active');
document.getElementById(`${tabName}-content`).classList.add('active');
}

function selectSymbol(sym){
currentSymbol=sym;
document.querySelectorAll('.watchlist-item').forEach(el=>{
el.classList.toggle('active',el.dataset.symbol===sym);
});
const price=priceCache[sym];
if(price)updatePriceDisplay(price);
log(`Selected ${sym}`);
}

function initWatchlist(){
const container=document.getElementById('watchlist');
container.innerHTML=WATCHLIST.map(sym=>`
<div class="watchlist-item ${sym===currentSymbol?'active':''}" data-symbol="${sym}" onclick="selectSymbol('${sym}')">
<span class="symbol-name">${sym}</span>
<span class="symbol-price">-.----</span>
</div>
`).join('');
}

function init(){
log('Initializing ForexSim Pro');
initWatchlist();
startWebSocket();startWebSocketNew();
setInterval(updatePositions,1000);
}

if(document.readyState==='loading'){
document.addEventListener('DOMContentLoaded',init);
}else{
init();
}
</script>
