<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Mini Broker Prop Firm</title>
  <style>
    body { display: flex; flex-direction: column; font-family: Arial, sans-serif; margin: 0; padding: 0; height: 100vh; }
    #main { display: flex; flex: 1; }
    #chart { flex: 2; border-right: 1px solid #ccc; }
    #sidebar { flex: 1; display: flex; flex-direction: column; padding: 10px; }
    #watchlist { margin-bottom: 20px; }
    #limit-orders { margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 5px; text-align: left; }
    #bottom { height: 200px; border-top: 1px solid #ccc; padding: 10px; display: flex; flex-direction: column; }
    #tabs { margin-bottom: 10px; }
    .tab-button { margin-right: 10px; cursor: pointer; }
    .tab-content { flex: 1; overflow: auto; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="main">
    <div id="chart">
      <!-- TradingView Chart Widget -->
      <div class="tradingview-widget-container" style="height:100%; width:100%">
        <div id="tv_chart" class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
        {
          "autosize": true,
          "symbol": "FX:EURUSD",
          "interval": "60",
          "timezone": "Etc/UTC",
          "theme": "light",
          "style": "1",
          "locale": "fr",
          "toolbar_bg": "#f1f3f6",
          "allow_symbol_change": true,
          "save_image": false,
          "container_id": "tv_chart"
        }
        </script>
      </div>
    </div>

    <div id="sidebar">
      <div id="watchlist">
        <h3>Watchlist</h3>
        <ul id="symbols">
          <!-- Les symboles seront injectés par JS -->
        </ul>
      </div>

      <div id="limit-orders">
        <h3>Ordres Limites</h3>
        <table>
          <thead>
            <tr><th>Actif</th><th>Prix Limite</th><th>Type</th><th>Lots</th><th>Placer</th></tr>
          </thead>
          <tbody id="limit-orders-body">
            <!-- Lignes dynamiques -->
          </tbody>
        </table>
        <button id="add-order">Ajouter un ordre limite</button>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div id="tabs">
      <button class="tab-button" data-tab="positions">Positions</button>
      <button class="tab-button" data-tab="history">Historique</button>
    </div>
    <div id="positions" class="tab-content">
      <h4>Positions ouvertes</h4>
      <table>
        <thead><tr><th>Actif</th><th>Lots</th><th>Prix d'entrée</th><th>PnL</th><th>SL</th><th>TP</th><th>Fermer</th></tr></thead>
        <tbody id="positions-body"></tbody>
      </table>
    </div>
    <div id="history" class="tab-content hidden">
      <h4>Historique des positions</h4>
      <table>
        <thead><tr><th>Actif</th><th>Lots</th><th>Prix d'entrée</th><th>Prix de sortie</th><th>PnL</th></tr></thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Sons -->
  <audio id="sound-open" src="https://freesound.org/data/previews/66/66717_931655-lq.mp3"></audio>
  <audio id="sound-reject" src="https://freesound.org/data/previews/66/66718_931655-lq.mp3"></audio>

  <script>
    // --- CONFIGURATION ---
    const API_KEY = "8906aa7f29ca470da317f72ae7efab51";  // ta clé Twelve Data
    const SYMBOLS = [
      "EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "USD/CAD",  // Forex
      "SPX", "NDX", "DAX", "FTSE", "NIKKEI",                   // Indices (nom fictif, à adapter)
      "XAU/USD"  // Or
    ];
    // Lot size par symbole (valeur en $ pour 1 lot)
    const LOT_VALUE = {
      "XAU/USD": 4000,
      "EUR/USD": 100000,
      "GBP/USD": 100000,
      "USD/JPY": 100000,
      "AUD/USD": 100000,
      "USD/CAD": 100000,
      "SPX": 50,  // exemple, à adapter
      "NDX": 20,
      "DAX": 25,
      "FTSE": 10,
      "NIKKEI": 10
    };

    // Etat global
    let limitOrders = [];
    let positions = [];
    let history = [];

    // Afficher la watchlist
    const symbolsListEl = document.getElementById("symbols");
    SYMBOLS.forEach(sym => {
      const li = document.createElement("li");
      li.textContent = sym;
      li.style.cursor = "pointer";
      li.onclick = () => selectSymbol(sym);
      symbolsListEl.appendChild(li);
    });

    let selectedSymbol = SYMBOLS[0];

    function selectSymbol(sym) {
      selectedSymbol = sym;
      console.log("Symbole sélectionné :", sym);
      // ici on pourrait mettre à jour le graphique TradingView via une API si on permet le changement de symbole
      // mais avec le widget standard ce n'est pas trivial : nécessite de recréer le widget ou d'utiliser l'option allow_symbol_change
    }

    // Ajouter un ordre limite
    document.getElementById("add-order").onclick = () => {
      const tbody = document.getElementById("limit-orders-body");
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><select class="order-symbol">${SYMBOLS.map(s => `<option>${s}</option>`).join("")}</select></td>
        <td><input type="number" class="order-price" /></td>
        <td><select class="order-type"><option value="buy">Buy</option><option value="sell">Sell</option></select></td>
        <td><input type="number" class="order-lots" /></td>
        <td><button class="place-order">Placer</button></td>
      `;
      tbody.appendChild(tr);

      tr.querySelector(".place-order").onclick = () => {
        const sym = tr.querySelector(".order-symbol").value;
        const price = parseFloat(tr.querySelector(".order-price").value);
        const type = tr.querySelector(".order-type").value;
        const lots = parseFloat(tr.querySelector(".order-lots").value);
        placeLimitOrder(sym, price, type, lots);
        tr.remove();  // on supprime la ligne d'entrée
      };
    };

    function placeLimitOrder(symbol, price, type, lots) {
      // On peut valider ou rejeter selon des règles simples (ex: pas de prix négatif, etc.)
      if (!SYMBOLS.includes(symbol) || price <= 0 || lots <= 0) {
        rejectOrder();
        return;
      }
      limitOrders.push({ symbol, price, type, lots });
      console.log("Ordre limite ajouté :", symbol, price, type, lots);
      playSound("open");
    }

    function rejectOrder() {
      console.log("Ordre rejeté");
      playSound("reject");
    }

    function playSound(name) {
      const audio = document.getElementById(name === "open" ? "sound-open" : "sound-reject");
      audio.play();
    }

    // Gestion des onglets Positions / Historique
    document.querySelectorAll(".tab-button").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tab-content").forEach(tc => tc.classList.add("hidden"));
        document.getElementById(btn.dataset.tab).classList.remove("hidden");
      };
    });

    // Fonction pour ouvrir une position (simulé ici quand un ordre limite est “touché”)
    async function checkLimitOrdersAndExecute() {
      // On récupère le prix actuel du symbole pour tous les ordres limites
      for (let i = limitOrders.length - 1; i >= 0; i--) {
        const ord = limitOrders[i];
        const current = await fetchPrice(ord.symbol);
        if (!current) continue;
        if (ord.type === "buy" && current <= ord.price) {
          openPosition(ord.symbol, ord.lots, current);
          limitOrders.splice(i, 1);
        } else if (ord.type === "sell" && current >= ord.price) {
          openPosition(ord.symbol, ord.lots, current, "sell");
          limitOrders.splice(i, 1);
        }
      }
      renderPositions();
    }

    async function fetchPrice(symbol) {
      // appeler l'API Twelve Data pour récupérer le prix actuel
      // le symbole doit correspondre au format de Twelve Data (ex: "EUR/USD", "XAU/USD", ou indices selon leur API)
      const url = `https://api.twelvedata.com/price?symbol=${encodeURIComponent(symbol)}&apikey=${API_KEY}`;
      try {
        const resp = await fetch(url);
        const data = await resp.json();
        if (data && data.price) {
          return parseFloat(data.price);
        } else {
          console.error("Erreur prix", data);
          return null;
        }
      } catch (e) {
        console.error("Erreur fetch price", e);
        return null;
      }
    }

    function openPosition(symbol, lots, entryPrice, side = "buy") {
      const pos = {
        symbol,
        lots,
        entryPrice,
        side,
        sl: null,
        tp: null,
        // on calcule la valeur notionnelle
        notional: LOT_VALUE[symbol] * lots,
        pnl: 0
      };
      positions.push(pos);
      console.log("Position ouverte :", pos);
    }

    function closePosition(index, exitPrice) {
      const pos = positions[index];
      const pnl = (exitPrice - pos.entryPrice) * (pos.lots * LOT_VALUE[pos.symbol]) * (pos.side === "buy" ? 1 : -1);
      history.push({ ...pos, exitPrice, pnl });
      positions.splice(index, 1);
      renderHistory();
    }

    function renderPositions() {
      const tbody = document.getElementById("positions-body");
      tbody.innerHTML = "";
      positions.forEach((pos, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${pos.symbol}</td>
          <td>${pos.lots}</td>
          <td>${pos.entryPrice.toFixed(5)}</td>
          <td>${pos.pnl.toFixed(2)}</td>
          <td><input type="number" placeholder="SL" class="sl-input" /></td>
          <td><input type="number" placeholder="TP" class="tp-input" /></td>
          <td><button class="close-btn">Fermer</button></td>
        `;
        tbody.appendChild(tr);

        tr.querySelector(".close-btn").onclick = async () => {
          const exit = await fetchPrice(pos.symbol);
          closePosition(i, exit);
          playSound("open");
        };
      });
    }

    function renderHistory() {
      const tbody = document.getElementById("history-body");
      tbody.innerHTML = "";
      history.forEach(h => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${h.symbol}</td>
          <td>${h.lots}</td>
          <td>${h.entryPrice.toFixed(5)}</td>
          <td>${h.exitPrice.toFixed(5)}</td>
          <td>${h.pnl.toFixed(2)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Boucle régulière pour checker les ordres limites
    setInterval(checkLimitOrdersAndExecute, 5000);

    // Boucle régulière pour mettre à jour le PnL des positions ouvertes
    setInterval(async () => {
      for (const pos of positions) {
        const current = await fetchPrice(pos.symbol);
        if (current != null) {
          pos.pnl = (current - pos.entryPrice) * (pos.lots * LOT_VALUE[pos.symbol]) * (pos.side === "buy" ? 1 : -1);
        }
      }
      renderPositions();
    }, 5000);

  </script>
</body>
</html>
