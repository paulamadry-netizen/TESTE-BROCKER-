<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mini Broker — WS Live (TwelveData)</title>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<style>
  :root{--bg:#071423;--muted:#9aa4b2;--accent:#00c4a7;--radius:12px;font-family:Inter,system-ui,Arial;}
  body{margin:0;height:100vh;background:linear-gradient(180deg,#071025,#071423);color:#e6eef6;padding:14px;box-sizing:border-box}
  .layout{display:grid;grid-template-columns:1fr 320px;grid-template-rows:1fr 320px;gap:14px;height:calc(100vh - 28px)}
  .card{background:rgba(255,255,255,0.02);border-radius:var(--radius);padding:12px;box-shadow:0 8px 28px rgba(0,0,0,0.6);overflow:hidden}
  .header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .symbol-badge{background:rgba(255,255,255,0.03);padding:8px 12px;border-radius:10px;font-weight:700;color:var(--accent)}
  .controls{display:flex;gap:8px}
  .btn{padding:8px 12px;border-radius:8px;border:0;cursor:pointer;font-weight:700}
  .btn-buy{background:linear-gradient(90deg,#0ea5a3,#00c4a7);color:#022}
  .btn-sell{background:linear-gradient(90deg,#ff6b6b,#ff8a8a);color:#111}
  .small{font-size:13px;color:var(--muted)}
  .watchlist{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
  .wl-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
  .status{font-weight:700;padding:6px 10px;border-radius:8px}
  .status.connected{background:rgba(0,196,167,0.08);color:var(--accent)}
  .status.disconnected{background:rgba(255,99,99,0.06);color:#ff8a8a}
  table{width:100%;border-collapse:collapse}
  td,th{padding:8px;text-align:left;border-bottom:1px dashed rgba(255,255,255,0.03);font-size:13px}
  .positive{color:#0f5132;background:rgba(16,185,129,0.07);padding:6px;border-radius:6px;font-weight:700}
  .negative{color:#7c1d1d;background:rgba(255,99,99,0.06);padding:6px;border-radius:6px;font-weight:700}
  #tv_chart_container{height:420px;border-radius:8px;overflow:hidden}
  @media (max-width:1000px){ .layout{grid-template-columns:1fr;grid-template-rows:auto auto auto} .watchlist{max-height:200px} }
</style>
</head>
<body>
<div class="layout">
  <div class="card" id="mainCard">
    <div class="header-row">
      <div style="display:flex;gap:12px;align-items:center">
        <div class="symbol-badge" id="currentSymbolBadge">OANDA:EURUSD</div>
        <div>
          <div style="font-weight:900" id="currentSymbolTitle">EUR / USD</div>
          <div class="small" id="currentPriceMini">Prix: —</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div id="wsStatus" class="status disconnected">WS: Disconnected</div>
        <div class="controls">
          <button id="refreshBtn" class="btn">Refresh</button>
          <button id="buyBtn" class="btn btn-buy">BUY</button>
          <button id="sellBtn" class="btn btn-sell">SELL</button>
        </div>
      </div>
    </div>

    <div id="tv_chart_container"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:800">Watchlist</div>
      <div class="small">Demo · minimize REST</div>
    </div>

    <div id="wlList" class="watchlist"></div>

    <div style="margin-top:10px">
      <div style="font-weight:800;margin-bottom:6px">Ordres Limites</div>
      <table>
        <thead><tr><th>Symbole</th><th>Side</th><th>Prix</th><th>Size</th><th></th></tr></thead>
        <tbody id="ordersBody"></tbody>
      </table>

      <div style="display:flex;gap:8px;margin-top:8px">
        <select id="ordSymbol" style="flex:1"></select>
        <select id="ordSide" style="width:80px"><option>BUY</option><option>SELL</option></select>
        <input id="ordPrice" placeholder="Prix" style="width:90px"/>
        <input id="ordSize" placeholder="Size" style="width:60px" value="1"/>
        <button id="addOrderBtn" class="btn btn-buy">Placer</button>
      </div>
    </div>
  </div>

  <div class="card" style="grid-column:1/3">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:800">Positions & Historique</div>
      <div class="small">Balance: <span id="simBalance">10000.00</span> USD · PnL total: <span id="totalPnl">0.00</span></div>
    </div>

    <div style="display:flex;gap:12px">
      <div style="flex:1">
        <div style="font-weight:700;margin-bottom:6px">Positions Ouvertes</div>
        <table><thead><tr><th>Symbole</th><th>Side</th><th>Entry</th><th>Actuel</th><th>PNL</th><th></th></tr></thead><tbody id="positionsBody"></tbody></table>
      </div>
      <div style="width:340px">
        <div style="font-weight:700;margin-bottom:6px">Historique</div>
        <table style="width:100%"><thead><tr><th>Symbole</th><th>Side</th><th>PNL</th></tr></thead><tbody id="historyBody"></tbody></table>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------- CONFIG ---------- */
const API_KEY = 'c9140c9a72264e82bb9f5235b86b2806'; // Remplacez par votre clé si nécessaire
const WS_ENDPOINT = 'wss://ws.twelvedata.com/v1/quotes';
const USE_WS = true;               // Activer/désactiver WS
const KEEPALIVE_INTERVAL = 25000;  // ping interval ms
const RECONNECT_MAX = 60000;       // max backoff
/* ---------- WATCHLIST ---------- */
const WATCHLIST = [
  {tv:'OANDA:EURUSD', label:'EUR / USD', api:'EUR/USD'},
  {tv:'OANDA:USDJPY', label:'USD / JPY', api:'USD/JPY'},
  {tv:'OANDA:GBPUSD', label:'GBP / USD', api:'GBP/USD'},
  {tv:'OANDA:USDCHF', label:'USD / CHF', api:'USD/CHF'},
  {tv:'OANDA:AUDUSD', label:'AUD / USD', api:'AUD/USD'},
  {tv:'OANDA:XAUUSD', label:'XAU / USD', api:'XAU/USD'},
  {tv:'INDEX:SPX', label:'S&P 500', api:'SPX'}
];

/* ---------- STATE ---------- */
let currentSymbol = WATCHLIST[0];
let priceCache = {};    // canonical 'EUR/USD' -> price
let positions = [];     // open positions
let history = [];       // closed trades
let orders = [];        // limit orders
let simBalance = 10000;
let tvWidget = null;

/* WS state */
let ws = null;
let wsConnected = false;
let reconnectDelay = 1000;
let keepaliveTimer = null;
let subscribeSent = false;

/* ---------- UTIL ---------- */
function escapeId(s){ return s.replace(/[^\w]/g,'_'); }
function formatPrice(x){ if(x===undefined||x===null) return '—'; const f=Number(x).toFixed(5); return f.replace(/\.0+$|0+$/,'').replace(/\.$/,''); }
function formatMoney(x){ return (x===undefined||x===null)?'0.00':Number(x).toFixed(2); }
function normalizeApiSymbol(s){
  if(!s) return s; s=String(s).toUpperCase();
  if(s.includes('/')) return s.replace('_','/');
  if(s.includes('_')) return s.replace('_','/');
  if(s.length===6) return s.slice(0,3)+'/'+s.slice(3);
  if(s.length>3) return s.slice(0,s.length-3)+'/'+s.slice(s.length-3);
  return s;
}
function now(){ return new Date().toISOString(); }

/* ---------- UI BUILD ---------- */
const wlList = document.getElementById('wlList');
WATCHLIST.forEach(w=>{
  const el = document.createElement('div'); el.className='wl-item';
  el.innerHTML = `<div><div style="font-weight:800">${w.label}</div><div class="small">${w.tv}</div></div><div style="text-align:right"><div id="price_${escapeId(w.api)}" class="small">—</div></div>`;
  el.addEventListener('click',()=>selectSymbol(w));
  wlList.appendChild(el);
});
const ordSymbol = document.getElementById('ordSymbol');
WATCHLIST.forEach(w=> { const o=document.createElement('option'); o.value=w.api; o.text=w.label; ordSymbol.appendChild(o); });

/* ---------- TradingView ---------- */
function initTradingView(){
  try{ if(tvWidget && typeof tvWidget.remove === 'function'){ tvWidget.remove(); tvWidget=null; document.getElementById('tv_chart_container').innerHTML=''; } }catch(e){}
  if(typeof TradingView==='undefined'){ console.warn('TradingView lib non chargée'); return; }
  try{
    tvWidget = new TradingView.widget({
      container_id: 'tv_chart_container',
      autosize: true,
      symbol: currentSymbol.tv,
      interval: '15',
      timezone: 'Etc/UTC',
      theme: 'dark',
      locale: 'fr'
    });
  }catch(e){ console.warn('TradingView init error', e); }
}
function selectSymbol(sym){
  currentSymbol = sym;
  document.getElementById('currentSymbolBadge').innerText = sym.tv;
  document.getElementById('currentSymbolTitle').innerText = sym.label;
  const p = priceCache[sym.api];
  document.getElementById('currentPriceMini').innerText = 'Prix: ' + (p?formatPrice(p):'—');
  initTradingView();
}

/* ---------- WS helpers ---------- */
function buildSubscribeSymbols(){ return WATCHLIST.map(w=> w.api.replace('/','') ).join(','); }

function setWsStatus(connected){
  const el = document.getElementById('wsStatus');
  wsConnected = !!connected;
  if(wsConnected){ el.className='status connected'; el.innerText='WS: Connected'; }
  else { el.className='status disconnected'; el.innerText='WS: Disconnected'; }
}

/* ---------- WS: start/subscribe/ping/reconnect ---------- */
async function startWebSocket(){
  if(!USE_WS) return;
  try{
    const url = `${WS_ENDPOINT}?apikey=${API_KEY}`;
    console.log(now(),'Attempt WS connect ->', url);
    ws = new WebSocket(url);

    ws.addEventListener('open', ()=>{
      console.log(now(),'WS OPEN');
      setWsStatus(true);
      reconnectDelay = 1000;
      subscribeSent = false;
      sendSubscribe();        // send subscription immediately
      startKeepalive();       // start pinging
    });

    ws.addEventListener('message', ev=>{
      // parse and handle
      try{
        const msg = JSON.parse(ev.data);
        // Very verbose logging to debug subscribe issues
        // Console will show if server acknowledges subscribe
        console.debug(now(),'WS MSG', msg);
        handleWsMessage(msg);
      }catch(ex){ console.warn('WS parse error', ex, ev.data); }
    });

    ws.addEventListener('close', evt=>{
      console.warn(now(),'WS CLOSED', evt.code, evt.reason);
      setWsStatus(false);
      stopKeepalive();
      scheduleReconnect();
    });

    ws.addEventListener('error', err=>{
      console.error(now(),'WS ERROR', err);
      setWsStatus(false);
      try{ ws.close(); }catch(e){}
      stopKeepalive();
      scheduleReconnect();
    });

  }catch(e){
    console.error(now(),'WS start exception', e);
    scheduleReconnect();
  }
}

function sendSubscribe(){
  if(!ws || ws.readyState !== WebSocket.OPEN) return;
  const symbolsPlain = buildSubscribeSymbols(); // e.g. EURUSD,USDJPY,XAUUSD,SPX
  // TwelveData expects action: "subscribe" and params.symbols as CSV, channel likely "price" or "quote"
  const msg = { action: 'subscribe', params: { symbols: symbolsPlain, channel: 'price' } };
  try{
    ws.send(JSON.stringify(msg));
    subscribeSent = true;
    console.log(now(),'Subscribe sent:', msg);
    // Also request an initial quote to get immediate snapshot
    const q = { action: 'quote', params:{ symbols: symbolsPlain } };
    ws.send(JSON.stringify(q));
    console.log(now(),'Quote request sent');
  }catch(e){ console.warn('sendSubscribe failed', e); }
}

function startKeepalive(){
  stopKeepalive();
  keepaliveTimer = setInterval(()=>{
    try{
      if(ws && ws.readyState===WebSocket.OPEN){
        // Some providers accept a ping action; if not, send a lightweight quote heartbeat
        const pingMsg = { action:'ping' };
        ws.send(JSON.stringify(pingMsg));
        // Also re-send subscribe periodically if not acknowledged
        if(!subscribeSent) sendSubscribe();
        // Debug
        console.debug(now(),'WS keepalive sent');
      }
    }catch(e){ console.warn('keepalive send failed', e); }
  }, KEEPALIVE_INTERVAL);
}
function stopKeepalive(){ if(keepaliveTimer){ clearInterval(keepaliveTimer); keepaliveTimer=null; } }

function scheduleReconnect(){
  stopKeepalive();
  if(reconnectDelay > RECONNECT_MAX) reconnectDelay = RECONNECT_MAX;
  console.log(now(),`Reconnecting WS in ${reconnectDelay}ms`);
  setTimeout(()=>{ reconnectDelay = Math.min(RECONNECT_MAX, Math.floor(reconnectDelay * 1.8)); startWebSocket(); }, reconnectDelay);
}

/* ---------- WS message handling ---------- */
function handleWsMessage(msg){
  if(!msg) return;
  // TwelveData responses vary — handle multiple shapes:
  // { action:'subscribed', ... } or { symbol:'EURUSD', price:1.1 } or { data:[{...}] } or { price: { EURUSD:... } }
  if(Array.isArray(msg)){ msg.forEach(m=>handleWsMessage(m)); return; }
  if(msg.action && msg.action.toLowerCase().includes('subscribed')) {
    console.log(now(),'Subscribed ack:', msg);
    subscribeSent = true;
    return;
  }
  if(msg.message) {
    // possible server message
    console.log(now(),'Server message:', msg.message);
  }
  // payload extraction
  const dataArr = msg.data || (msg.price && typeof msg.price==='object' ? null : null);
  if(Array.isArray(dataArr)){
    dataArr.forEach(d=>handleWsMessage(d));
    return;
  }

  // handle mapping price: { EURUSD:1.12, ...}
  if(msg.price && typeof msg.price === 'object' && !msg.symbol){
    Object.keys(msg.price).forEach(k=>{
      const p = Number(msg.price[k]);
      if(!Number.isNaN(p)){
        const normalized = normalizeApiSymbol(k);
        priceCache[normalized] = p;
        updatePriceUI(normalized);
        checkOrdersForSymbol(normalized);
        updatePositionsForSymbol(normalized, p);
      }
    });
    renderPositions(); renderTotals();
    return;
  }

  // direct payload object
  const payload = msg.quote || msg.price || msg;
  const symRaw = msg.symbol || msg.s || payload.symbol || payload.sym || null;
  let price = payload.price || payload.p || payload.last || payload.l || payload.close || payload.c || payload.ask || payload.bid || null;

  if(price && typeof price === 'object'){
    if(price.bid && price.ask) price = (Number(price.bid)+Number(price.ask))/2;
    else price = price.last || price.p || null;
  }

  if(symRaw && (price!==null && price!==undefined)){
    const normalized = normalizeApiSymbol(symRaw);
    const numeric = Number(price);
    if(!Number.isNaN(numeric)){
      priceCache[normalized] = numeric;
      updatePriceUI(normalized);
      checkOrdersForSymbol(normalized);
      updatePositionsForSymbol(normalized, numeric);
      renderPositions(); renderTotals();
    }
  }
}

/* ---------- PRICE UI & FALLBACK ---------- */
function updatePriceUI(normalized){
  const el = document.getElementById('price_' + escapeId(normalized));
  if(el) el.innerText = formatPrice(priceCache[normalized]);
  if(normalized === currentSymbol.api) document.getElementById('currentPriceMini').innerText = 'Prix: ' + formatPrice(priceCache[normalized]);
}

// minimal REST fallback (rare) - does not poll continuously
async function fetchPriceREST(symbolApi){
  const candidates = [symbolApi, symbolApi.replace('/',''), symbolApi.replace('/','_')];
  for(const s of candidates){
    try{
      const url = `https://api.twelvedata.com/price?symbol=${encodeURIComponent(s)}&apikey=${API_KEY}`;
      const r = await fetch(url);
      if(!r.ok) continue;
      const j = await r.json();
      const p = Number(j.price || j.value);
      if(!Number.isNaN(p)){ priceCache[normalizeApiSymbol(symbolApi)] = p; updatePriceUI(normalizeApiSymbol(symbolApi)); return p; }
    }catch(e){}
  }
  return null;
}

/* ---------- ORDERS / POSITIONS ---------- */
function computePnl(pos, currentPrice){
  const delta = (pos.side==='BUY') ? (currentPrice - pos.entry) : (pos.entry - currentPrice);
  return Number(delta * pos.size);
}
function updatePositionsForSymbol(symbolApi, newPrice){
  let changed=false;
  positions.forEach(p=>{
    if(p.symbol.api === symbolApi){
      p.current = newPrice;
      p.pnl = computePnl(p, newPrice);
      changed=true;
    }
  });
  if(changed){ renderPositions(); renderTotals(); }
}

async function openPosition(symObj, side, size=1, entryPrice=null){
  let price = (entryPrice!==null)?entryPrice: priceCache[symObj.api];
  if(price===undefined || price===null){
    // try REST once
    const fetched = await fetchPriceREST(symObj.api);
    if(fetched!==null) price = fetched;
  }
  if(price===undefined || price===null){ alert('Prix non disponible — réessayez'); return; }
  const pos = { id:'pos_'+Math.random().toString(36,9).slice(2,9), symbol:symObj, side, entry:price, size:Number(size), openAt:Date.now(), current:price, pnl:0};
  positions.push(pos);
  renderPositions(); renderTotals();
}

function closePosition(id){
  const i = positions.findIndex(p=>p.id===id); if(i===-1) return;
  const p = positions[i];
  const closePrice = priceCache[p.symbol.api]!==undefined?priceCache[p.symbol.api]:p.current;
  const pnl = computePnl(p, closePrice);
  history.unshift({ symbol:p.symbol, side:p.side, entry:p.entry, close:closePrice, pnl, closedAt:Date.now() });
  simBalance += pnl;
  positions.splice(i,1);
  renderPositions(); renderHistory(); renderTotals();
}

/* Limit orders */
function addLimitOrder(symbolApi, side, price, size){
  const ord = { id:'ord_'+Math.random().toString(36).slice(2,9), symbol:symbolApi, side, price:Number(price), size:Number(size), placedAt:Date.now() };
  orders.push(ord); renderOrders();
}
function removeOrder(id){ orders = orders.filter(o=>o.id!==id); renderOrders(); }
function checkOrdersForSymbol(symbolApi){
  const p = priceCache[symbolApi]; if(p===undefined) return;
  const matches = orders.filter(o => o.symbol===symbolApi && ((o.side==='BUY' && p<=o.price) || (o.side==='SELL' && p>=o.price)));
  matches.forEach(m=>{
    const symObj = WATCHLIST.find(w=>w.api===m.symbol) || {api:m.symbol,label:m.symbol,tv:m.symbol};
    openPosition(symObj, m.side, m.size, m.price);
    removeOrder(m.id);
  });
}

/* ---------- RENDER ---------- */
function renderPositions(){
  const tbody = document.getElementById('positionsBody'); tbody.innerHTML='';
  positions.forEach(p=>{
    const tr = document.createElement('tr');
    const cls = (p.pnl>=0)?'positive':'negative';
    tr.innerHTML = `<td><strong>${p.symbol.label}</strong><div class="small">${p.symbol.tv}</div></td>
                    <td>${p.side}</td>
                    <td>${formatPrice(p.entry)}</td>
                    <td>${formatPrice(p.current)}</td>
                    <td><span class="${cls}">${formatMoney(p.pnl)}</span></td>
                    <td><button class="btn" onclick="closePosition('${p.id}')">Close</button></td>`;
    tbody.appendChild(tr);
  });
}
function renderHistory(){
  const tbody = document.getElementById('historyBody'); tbody.innerHTML='';
  history.forEach(h=>{
    const tr = document.createElement('tr');
    const cls = (h.pnl>=0)?'positive':'negative';
    tr.innerHTML = `<td>${h.symbol.label}</td><td>${h.side}</td><td><span class="${cls}">${formatMoney(h.pnl)}</span></td>`;
    tbody.appendChild(tr);
  });
}
function renderOrders(){
  const tbody = document.getElementById('ordersBody'); tbody.innerHTML='';
  orders.forEach(o=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${o.symbol}</td><td>${o.side}</td><td>${formatPrice(o.price)}</td><td>${o.size}</td><td><button class="btn" onclick="removeOrder('${o.id}')">X</button></td>`;
    tbody.appendChild(tr);
  });
}
function renderTotals(){
  const totalPnl = positions.reduce((s,p)=> s + computePnl(p,p.current), 0);
  document.getElementById('totalPnl').innerText = formatMoney(totalPnl);
  document.getElementById('simBalance').innerText = formatMoney(simBalance);
}

/* ---------- UI EVENTS ---------- */
document.getElementById('addOrderBtn').addEventListener('click', ()=>{
  const sym = document.getElementById('ordSymbol').value;
  const side = document.getElementById('ordSide').value;
  const price = document.getElementById('ordPrice').value;
  const size = document.getElementById('ordSize').value || 1;
  if(!sym || !price) return alert('Renseignez symbole et prix');
  addLimitOrder(sym, side, price, size);
});

document.getElementById('refreshBtn').addEventListener('click', ()=>{
  if(ws && ws.readyState===WebSocket.OPEN){
    sendSubscribe(); // re-request snapshot
  } else {
    // lightweight local refresh
    renderPositions(); renderOrders(); renderTotals();
  }
});

document.getElementById('buyBtn').addEventListener('click', async ()=> { await openPosition(currentSymbol,'BUY',1); });
document.getElementById('sellBtn').addEventListener('click', async ()=> { await openPosition(currentSymbol,'SELL',1); });

/* expose some functions globally for inline buttons */
window.closePosition = closePosition;
window.removeOrder = removeOrder;

/* ---------- INIT ---------- */
function init(){
  // fill ordSymbol select already done earlier
  initTradingView();
  renderPositions(); renderOrders(); renderHistory(); renderTotals();
  if(USE_WS) startWebSocket();
  // populate any missing initial prices by one-shot REST to avoid empty UI (lightweight)
  WATCHLIST.forEach(async w=>{
    if(priceCache[w.api]===undefined){
      const p = await fetchPriceREST(w.api);
      if(p) { priceCache[w.api]=p; updatePriceUI(w.api); }
    }
  });
}
init();

/* ---------- NOTES ----------
 - Si sur votre dashboard TwelveData vous voyez beaucoup de "requests", regardez la colonne "action" et vérifiez si l'abonnement a été correctement ack-qué (msg.action contains "subscribed").
 - La console (F12) affiche tous les messages WS et les réponses du serveur. Si subscribe n'est pas ack, vérifiez la clé API ou le format du message.
 - Si TwelveData exige 'channel' plutôt que 'channels' ou 'params.channel' différent, la console vous montrera l'erreur renvoyée par le serveur. Ajustez 'sendSubscribe' selon l'erreur.
--------------------------------- */
</script>
</body>
</html>
