<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Broker Pro - Prop Firm</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

    <style>
        /* ==========================================================
           STYLE (CSS)
           ========================================================== */
        :root {
            --bg-primary: #121419;
            --bg-secondary: #1e2129;
            --text-color: #e5e9f0;
            --accent-color: #5d5dff;
            --positive-color: #00b894;
            --negative-color: #ff6348;
            --border-color: #3f444c;
            --font-mono: 'Roboto Mono', monospace;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header & Footer */
        .header {
            background-color: var(--bg-secondary);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            flex-shrink: 0;
        }
        
        .footer {
            background-color: var(--bg-primary);
            color: #6c757d;
            padding: 5px 20px;
            text-align: right;
            font-size: 0.75em;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.5em;
            margin: 0;
            color: var(--accent-color);
        }

        #account-info {
            font-family: var(--font-mono);
            font-size: 1.1em;
        }

        /* Layout Principal */
        .trading-interface {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Sidebar (Watchlist & Ordres) */
        .sidebar {
            width: 320px;
            background-color: var(--bg-secondary);
            padding: 15px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .panel {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            background-color: #1a1e26;
        }

        .panel h3 {
            margin-top: 0;
            color: var(--accent-color);
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
            font-size: 1.1em;
        }

        /* Watchlist */
        #watchlist {
            list-style: none;
            padding: 0;
        }

        .watchlist-item {
            display: grid;
            grid-template-columns: 2fr 1fr;
            padding: 8px 10px;
            cursor: pointer;
            border-bottom: 1px solid #2c323a;
            transition: background-color 0.1s, border-left 0.1s;
        }
        
        .watchlist-item.selected, .watchlist-item:hover {
            background-color: #2c323a;
            border-left: 3px solid var(--accent-color);
        }

        .asset-symbol { font-weight: bold; }
        .asset-price { 
            font-family: var(--font-mono); 
            text-align: right;
            font-weight: 500;
            color: var(--text-color);
        }

        .price-up { color: var(--positive-color); }
        .price-down { color: var(--negative-color); }
        .pnl-positive { color: var(--positive-color); }
        .pnl-negative { color: var(--negative-color); }

        /* Styles d'Ordre et d'Exécution (simplifiés) */
        .limit-order-panel, .trade-execution-panel {
            /* Styles d'entrée et de bouton omis pour la concision */
        }
        
        .limit-actions button, .execution-controls button {
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }

        .buy-btn, .limit-buy-btn { background-color: var(--positive-color); color: white; }
        .sell-btn, .limit-sell-btn { background-color: var(--negative-color); color: white; }

        /* Main Content (Chart & Tabs) */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-primary);
        }

        /* Chart */
        .chart-container {
            height: 60%; 
            min-height: 400px;
            background-color: black;
            flex-shrink: 0;
        }

        /* Trade Execution Panel */
        .trade-execution-panel {
            padding: 10px 20px;
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .execution-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #asset-price-display {
            font-family: var(--font-mono);
            font-size: 1.3em;
            font-weight: bold;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #bid-price, #ask-price {
            padding: 5px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        #bid-price { color: var(--negative-color); background: rgba(255, 99, 72, 0.1); } 
        #ask-price { color: var(--positive-color); background: rgba(0, 184, 148, 0.1); } 

        /* Tabs and Tables */
        .position-history-tabs {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* Styles de tableaux et de modaux omis pour la concision */
    </style>
</head>
<body>

    <header class="header">
        <h1>Broker Prop Firm 📈</h1>
        <div id="account-info">
            Solde: <span id="balance" class="pnl-positive">$50,000.00</span> | PnL Total: <span id="total-pnl" class="pnl-neutral">$0.00</span>
        </div>
    </header>

    <main class="trading-interface">

        <section class="sidebar">
            
            <div class="panel watchlist-panel">
                <h3>Watchlist (Actif Sélectionné : <span id="selected-asset-info">EUR/USD</span>)</h3>
                <ul id="watchlist">
                    </ul>
            </div>

            <div class="panel limit-order-panel">
                <h3>Passer un Ordre Limite</h3>
                <div class="limit-actions">
                    <button class="limit-buy-btn" onclick="placeLimitOrder('BUY')">Acheter Limite</button>
                    <button class="limit-sell-btn" onclick="placeLimitOrder('SELL')">Vendre Limite</button>
                </div>
            </div>
            
        </section>

        <section class="main-content">
            
            <div id="tv_chart_container" class="chart-container">
                </div>

            <div class="trade-execution-panel">
                <div class="execution-controls">
                    <input type="number" id="market-lots" min="0.01" step="0.01" value="1.00" style="width: 80px; text-align: center;">
                    <button class="sell-btn" onclick="executeMarketOrder('SELL')">VENDRE</button>
                    <button class="buy-btn" onclick="executeMarketOrder('BUY')">ACHETER</button>
                </div>
                <div id="asset-price-display">
                    <span id="current-asset">EUR/USD</span>
                    BID: <span id="bid-price">1.10000</span> 
                    ASK: <span id="ask-price">1.10005</span>
                </div>
            </div>

            <div class="position-history-tabs">
                </div>
        </section>

    </main>
    
    <footer class="footer">
        Version du Code : **V10 (Fiabilité TradingView)**
    </footer>
    
    <script>
        // ====================================================================
        // LOGIQUE (JAVASCRIPT)
        // ====================================================================

        let balance = 50000.00;
        let totalPnL = 0.00;
        let openPositions = [];
        let currentAsset = 'EUR/USD';
        let tvWidget = null; 
        let isChartInitialized = false; // Nouveau drapeau de vérification simple

        // Mapping des symboles TradingView (inchangé)
        const TV_SYMBOLS = {
            'EUR/USD': 'FX_IDC:EURUSD',
            'GBP/USD': 'FX_IDC:GBPUSD',
            'USD/JPY': 'FX_IDC:USDJPY',
            'AUD/USD': 'FX_IDC:AUDUSD',
            'USD/CHF': 'FX_IDC:USDCHF',
            'XAU/USD': 'TVC:GOLD', 
            'US30': 'FOREXCOM:US30', 
            'US100': 'FOREXCOM:US100',
            'US500': 'FOREXCOM:SPX500',
            'DE40': 'EUREX:FDAX1!', 
            'FR40': 'INDEX:CAC40', 
        };

        // Données des prix (inchangé)
        let currentPrices = {
            'EUR/USD': { bid: 1.08000, ask: 1.08005 },
            'GBP/USD': { bid: 1.25000, ask: 1.25005 },
            'USD/JPY': { bid: 145.000, ask: 145.005 },
            'AUD/USD': { bid: 0.65000, ask: 0.65005 },
            'USD/CHF': { bid: 0.90000, ask: 0.90005 },
            'XAU/USD': { bid: 1950.00, ask: 1950.50 }, 
            'US30': { bid: 34500.00, ask: 34505.00 },
            'US100': { bid: 15000.00, ask: 15005.00 },
            'US500': { bid: 4400.00, ask: 4400.50 },
            'DE40': { bid: 16000.00, ask: 16005.00 },
            'FR40': { bid: 7300.00, ask: 7303.00 },
        };

        const LOT_VALUES = {
            'EUR/USD': { units: 100000, pipValueUSD: 10.00, isForex: true, precision: 5 }, 
            'GBP/USD': { units: 100000, pipValueUSD: 10.00, isForex: true, precision: 5 },
            'USD/JPY': { units: 100000, pipValueUSD: 10.00, isForex: true, precision: 3 }, 
            'AUD/USD': { units: 100000, pipValueUSD: 10.00, isForex: true, precision: 5 },
            'USD/CHF': { units: 100000, pipValueUSD: 10.00, isForex: true, precision: 5 },
            'XAU/USD': { units: 100, pipValueUSD: 1.00, isForex: false, precision: 2 }, 
            'US30': { units: 1, pipValueUSD: 1.00, isForex: false, precision: 2 }, 
            'US100': { units: 1, pipValueUSD: 2.00, isForex: false, precision: 2 },
            'US500': { units: 1, pipValueUSD: 50.00, isForex: false, precision: 2 },
            'DE40': { units: 1, pipValueUSD: 1.00, isForex: false, precision: 2 },
            'FR40': { units: 1, pipValueUSD: 1.00, isForex: false, precision: 2 },
        };

        // ====================================================================
        // INITIALISATION
        // ====================================================================

        document.addEventListener('DOMContentLoaded', () => {
            updateWatchlist();
            // Utilisation du premier actif comme actif initial.
            initTradingView(Object.keys(currentPrices)[0]); 
            
            updateAccountInfo();
            // Sélectionne et affiche l'actif par défaut
            selectAsset(currentAsset); 
            
            // Démarrer la mise à jour des prix pour simuler l'activité
            setInterval(updatePricesAndPnL, 2000); 
        });

        /**
         * Initialise le widget TradingView.
         * @param {string} assetKey - La clé interne (ex: 'EUR/USD').
         */
        function initTradingView(assetKey) {
            const tvSymbol = TV_SYMBOLS[assetKey] || assetKey; 
            
            tvWidget = new TradingView.widget({
                "container_id": "tv_chart_container",
                "symbol": tvSymbol, 
                "interval": "60",
                "timezone": "Europe/Paris",
                "theme": "dark",
                "style": "1",
                "locale": "fr",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "allow_symbol_change": true, // Doit être true pour que setSymbol fonctionne correctement
                "hide_side_toolbar": true,
                "autosize": true,
                "client_id": "tradingview.com", 
                "user_id": "test_user"
            });
            
            // L'événement le plus fiable pour indiquer que l'API est prête
            tvWidget.onChartReady(() => {
                console.log("TradingView Chart est prêt à recevoir des commandes.");
                isChartInitialized = true; // L'API Chart est disponible
                // Assurez-vous que le symbole initial est bien chargé
                if (currentAsset !== assetKey) {
                     // Si l'utilisateur a cliqué sur un autre actif entre temps
                    selectAsset(currentAsset); 
                }
            });
        }

        function updateWatchlist() {
            const watchlistEl = document.getElementById('watchlist');
            watchlistEl.innerHTML = '';

            const assets = Object.keys(currentPrices);

            assets.forEach(asset => {
                const assetSpec = LOT_VALUES[asset];
                const price = currentPrices[asset];
                
                const item = document.createElement('li');
                item.className = 'watchlist-item';
                item.dataset.asset = asset;
                item.setAttribute('onclick', `selectAsset('${asset}')`);
                
                // Mettre le premier élément en sélectionné par défaut
                if (asset === currentAsset) {
                    item.classList.add('selected');
                }

                item.innerHTML = `
                    <span class="asset-symbol">${asset}</span>
                    <span class="asset-price" id="price-${asset}">${price.bid.toFixed(assetSpec.precision)}</span>
                `;
                watchlistEl.appendChild(item);
            });
        }

        /**
         * Change l'actif actuellement regardé et sélectionné.
         * Utilise le drapeau `isChartInitialized` pour garantir l'exécution.
         * @param {string} asset - Le nouveau symbole.
         */
        function selectAsset(asset) {
            currentAsset = asset;
            const tvSymbol = TV_SYMBOLS[asset] || asset;

            // 1. Mise à jour de la classe CSS pour la watchlist
            document.querySelectorAll('.watchlist-item').forEach(item => {
                item.classList.remove('selected');
                if (item.dataset.asset === asset) {
                    item.classList.add('selected');
                }
            });

            // 2. Mise à jour du graphique TradingView (Le point crucial)
            // On vérifie que le widget est là, qu'il est initialisé et que la fonction setSymbol existe.
            if (isChartInitialized && tvWidget && typeof tvWidget.chart === 'function' && typeof tvWidget.chart().setSymbol === 'function') {
                tvWidget.chart().setSymbol(tvSymbol);
                console.log(`Symbole changé avec succès pour : ${asset}`);
            } else {
                console.warn(`Le graphique n'est pas prêt pour setSymbol. Réessayez bientôt.`);
            }

            // 3. Mise à jour des panneaux d'exécution
            document.getElementById('current-asset').textContent = asset;
            document.getElementById('selected-asset-info').textContent = asset;
            
            updatePriceDisplay(asset);
        }

        // ====================================================================
        // LOGIQUE DE PRIX ET PNL (Simplifiée pour la concision)
        // ====================================================================

        function fetchPriceSimulation(asset) {
            const current = currentPrices[asset];
            if (!current) return { bid: 0, ask: 0 };
            const volatility = LOT_VALUES[asset].isForex ? 0.00005 : 0.5; 
            const change = (Math.random() - 0.5) * volatility;
            current.bid += change;
            current.ask = current.bid + (current.ask - current.bid); 
            return current;
        }

        function updatePricesAndPnL() {
            totalPnL = 0;
            
            Object.keys(currentPrices).forEach(asset => {
                const newPrice = fetchPriceSimulation(asset);
                const precision = LOT_VALUES[asset]?.precision || 5;

                const priceEl = document.getElementById(`price-${asset}`);
                if (priceEl) {
                    const oldPrice = parseFloat(priceEl.textContent);
                    const priceToDisplay = newPrice.bid.toFixed(precision);
                    priceEl.textContent = priceToDisplay;
                    priceEl.className = newPrice.bid > oldPrice ? 'asset-price price-up' : (newPrice.bid < oldPrice ? 'asset-price price-down' : 'asset-price');
                }
            });

            // Mettre à jour les prix pour l'actif actuellement affiché
            updatePriceDisplay(currentAsset);
            
            // Mise à jour simplifiée du PnL (les boucles de positions sont omises)
            updateAccountInfo();
        }

        function updatePriceDisplay(asset) {
            const prices = currentPrices[asset] || { bid: 0, ask: 0 };
            const precision = LOT_VALUES[asset]?.precision || 5;

            document.getElementById('current-asset').textContent = asset;
            document.getElementById('bid-price').textContent = prices.bid.toFixed(precision);
            document.getElementById('ask-price').textContent = prices.ask.toFixed(precision);
        }

        function updateAccountInfo() {
            document.getElementById('balance').textContent = `$${balance.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",")}`;
            document.getElementById('total-pnl').textContent = `$${totalPnL.toFixed(2)}`;
            document.getElementById('total-pnl').className = totalPnL >= 0 ? 'pnl-positive' : 'pnl-negative';
        }
        
        // Les fonctions de trading (executeMarketOrder, placeLimitOrder, etc.) sont conservées 
        // comme des stubs pour le fonctionnement, mais leur corps est omis ici pour la concision.
        function executeMarketOrder(type) {
            console.log(`Ordre de marché ${type} sur ${currentAsset} exécuté.`);
            // Logique complète omise.
        }
        function placeLimitOrder(type) {
            console.log(`Ordre Limite ${type} sur ${document.getElementById('limit-asset').value} placé.`);
            // Logique complète omise.
        }

    </script>
</body>
</html>
