<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Broker UI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #0e0f12;
      color: #fff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background: #131417;
      padding: 20px;
      border-right: 1px solid #25262b;
    }
    .sidebar h2 {
      margin-bottom: 20px;
      font-size: 22px;
      color: #4ea1ff;
    }
    .sidebar button {
      width: 100%;
      padding: 12px;
      background: #1c1d21;
      border: 1px solid #2f3035;
      color: #fff;
      margin-bottom: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .sidebar button:hover {
      background: #4ea1ff;
      color: #000;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow: auto;
    }

    .card {
      background: #15161a;
      border: 1px solid #2a2b30;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    #chart {
      height: 320px;
      background: #101114;
      border-radius: 12px;
      border: 1px solid #2a2b30;
    }

    input, select {
      padding: 10px;
      background: #1b1c20;
      border: 1px solid #2d2e33;
      border-radius: 8px;
      color: #fff;
      width: 100%;
      margin: 5px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #2a2b30;
      text-align: left;
    }
    th { color: #4ea1ff; }

    .btn-buy { background: #38ff87; color: #000; }
    .btn-sell { background: #ff4e4e; color: #000; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Broker Pro</h2>
    <button onclick="executeBuy()">Buy</button>
    <button onclick="executeSell()">Sell</button>
    <button onclick="updateChart()">Update Chart</button>
  </div>

  <div class="main">

    <div class="card">
      <h2>Trade Settings</h2>
      <label>Symbol</label>
      <input id="symbol" value="BTCUSDT" />

      <label>Amount</label>
      <input id="amount" type="number" placeholder="Amount" />

      <label>Order Type</label>
      <select id="orderType">
        <option value="market">Market</option>
        <option value="limit">Limit</option>
      </select>

      <label>Limit Price (if limit)</label>
      <input id="limitPrice" type="number" />

      <button onclick="placeOrder()">Place Order</button>
    </div>

    <div class="card">
      <h2>Live Chart</h2>
      <div id="chart"></div>
    </div>

    <div class="card">
      <h2>Orders</h2>
      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>Symbol</th>
            <th>Amount</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody id="orderTable"></tbody>
      </table>
    </div>

  </div>

<script>
function placeOrder() {
  const symbol = document.getElementById("symbol").value;
  const amount = document.getElementById("amount").value;
  const type = document.getElementById("orderType").value;
  const price = type === "limit" ? document.getElementById("limitPrice").value : "Market";

  const row = `<tr><td>${type}</td><td>${symbol}</td><td>${amount}</td><td>${price}</td></tr>`;
  document.getElementById("orderTable").innerHTML += row;
}

function executeBuy() { alert("Buy executed!"); }
function executeSell() { alert("Sell executed!"); }
function updateChart() { alert("Chart updated (placeholder)"); }
</script>

</body>
</html>
