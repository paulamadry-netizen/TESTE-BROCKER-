<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Broker — Graphique & Watchlist</title>

  <!-- Google font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#9aa6bf;
      --accent:#2dd4bf;
      --danger:#ff6b6b;
      --glass: rgba(255,255,255,0.03);
      --glass-2: rgba(255,255,255,0.02);
      --text:#e6eef8;
    }
    html,body{height:100%; margin:0; font-family:Inter,system-ui,Arial; background: linear-gradient(180deg,#071025 0%, #071427 100%); color:var(--text); -webkit-font-smoothing:antialiased;}
    .app {
      display:flex;
      flex-direction:column;
      height:100vh;
      gap:12px;
      padding:14px;
      box-sizing:border-box;
    }
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .brand{display:flex;gap:12px;align-items:center;}
    .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#60a5fa);display:flex;align-items:center;justify-content:center;font-weight:700;color:#042;}
    .title{font-weight:600;font-size:18px;}
    .subtitle{font-size:13px;color:var(--muted);margin-top:2px;}
    .main{display:flex;gap:14px;flex:1;min-height:0;}
    .chart-area{flex:1.6;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:12px;padding:12px;box-shadow:0 6px 24px rgba(2,6,23,0.6);display:flex;flex-direction:column;min-width:0;}
    .side{width:320px;max-width:36%;min-width:240px;background:var(--card);border-radius:12px;padding:12px;box-shadow:0 6px 20px rgba(2,6,23,0.6);display:flex;flex-direction:column;gap:10px;}
    .chart-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
    .symbol-big{font-size:16px;font-weight:700;}
    .controls{display:flex;gap:8px;align-items:center;}
    .btn{padding:8px 12px;border-radius:8px;background:var(--glass);border:1px solid rgba(255,255,255,0.03);color:var(--text);cursor:pointer;font-weight:600;}
    .btn.primary{background:linear-gradient(90deg,#0ea5a7,#60a5fa);color:#042;border:none;}
    .btn.buy{background:linear-gradient(90deg,#10b981,#34d399);color:#042;border:none;}
    .btn.sell{background:linear-gradient(90deg,#ef4444,#fb7185);color:white;border:none;}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);}
    #tv_chart_container{flex:1;min-height:380px;border-radius:10px;overflow:hidden;background:var(--glass-2);}
    .watch-title{font-weight:700;font-size:14px;margin-bottom:6px;}
    .watchlist{display:flex;flex-direction:column;gap:8px;overflow:auto;padding-right:6px;}
    .watch-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px;cursor:pointer;transition:all .12s;background:transparent;}
    .watch-item:hover{transform:translateY(-3px);background:linear-gradient(90deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));}
    .small-muted{color:var(--muted);font-size:13px;}
    .bottom{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
    .tabs{display:flex;gap:8px;align-items:center;}
    .tab-btn{padding:8px 12px;border-radius:10px;cursor:pointer;background:transparent;color:var(--muted);border:1px solid transparent;font-weight:600;}
    .tab-btn.active{background:linear-gradient(90deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));color:var(--text);border:1px solid rgba(255,255,255,0.03);}
    .panel{background:linear-gradient(180deg,rgba(255,255,255,0.01),rgba(255,255,255,0.00));border-radius:10px;padding:12px;min-height:120px;overflow:auto;}
    .pos-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:8px;background:rgba(255,255,255,0.01);margin-bottom:8px;}
    .pnl{font-weight:700;}
    @media (max-width:960px){.main{flex-direction:column;}.side{width:100%;max-width:100%;order:2;}.chart-area{order:1;min-height:420px;}}
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">MB</div>
        <div>
          <div class="title">Mini Broker</div>
          <div class="subtitle">Graphique · Watchlist · Positions</div>
        </div>
      </div>
      <div class="controls">
        <div class="small-muted">Données : Twelve Data</div>
        <button class="btn ghost" id="refreshPrices">Rafraîchir</button>
      </div>
    </div>

    <div class="main">
      <div class="chart-area">
        <div class="chart-header">
          <div>
            <div class="symbol-big" id="currentSymbol">EUR/USD</div>
            <div class="small-muted" id="currentPriceSmall">Prix: --</div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn buy" id="btnBuy">Acheter</button>
            <button class="btn sell" id="btnSell">Vendre</button>
          </div>
        </div>
        <div id="tv_chart_container"></div>

        <div class="bottom">
          <div class="tabs">
            <div class="tab-btn active" data-tab="positions">Positions</div>
            <div class="tab-btn" data-tab="history">Historique</div>
          </div>

          <div class="panel" id="panelPositions">
            <div id="positionsList"><div class="small-muted">Aucune position ouverte.</div></div>
          </div>
          <div class="panel" id="panelHistory" style="display:none;">
            <div id="historyList"><div class="small-muted">Aucun historique.</div></div>
          </div>
        </div>
      </div>

      <aside class="side">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div class="watch-title">Watchlist</div>
            <div class="small-muted">Forex · Indices · Or</div>
          </div>
          <div class="small-muted">Temps réel</div>
        </div>

        <div class="watchlist" id="watchlist"></div>

        <div style="margin-top:auto;display:flex;gap:8px;align-items:center;justify-content:space-between;">
          <div class="small-muted">Dernière MAJ: <span id="lastUpdate">--</span></div>
          <div><button class="btn" id="btnRefreshWatch">Refresh</button></div>
        </div>
      </aside>
    </div>
  </div>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
const API_KEY = 'c9140c9a72264e82bb9f5235b86b2806';
const API_BASE = 'https://api.twelvedata.com';
const WATCHLIST = [
  { id:'EUR/USD', label:'EURUSD' }, { id:'USD/JPY', label:'USDJPY' },
  { id:'GBP/USD', label:'GBPUSD' }, { id:'AUD/USD', label:'AUDUSD' },
  { id:'USD/CAD', label:'USDCAD' }, { id:'SPX', label:'S&P 500' },
  { id:'NDX', label:'NASDAQ' }, { id:'DJI', label:'DOW JONES' },
  { id:'DAX', label:'DAX' }, { id:'FTSE', label:'FTSE 100' },
  { id:'XAU/USD', label:'Or (XAUUSD)' },
];
let tvWidget=null,currentSymbol='EUR/USD',lastPrices={},positions=[],history=[];
const fmt=(n,d=5)=>n==null?'--':Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const now=()=>new Date().toLocaleString('fr-FR');

function apiGetPrice(symbol){
  return fetch(`${API_BASE}/price?symbol=${encodeURIComponent(symbol)}&apikey=${API_KEY}`)
  .then(r=>r.json())
  .then(j=>{
    if(j && j.price)return{price:Number(j.price),source:'twelvedata'};
    throw new Error('Invalid');
  })
  .catch(()=>{
    const base=lastPrices[symbol]??1.1;const f=base*(1+(Math.random()-0.5)*0.001);
    return{price:f,source:'fallback'};
  });
}

function renderWatchlist(){
  const c=document.getElementById('watchlist');c.innerHTML='';
  WATCHLIST.forEach(w=>{
    const el=document.createElement('div');
    el.className='watch-item';
    el.innerHTML=`<div><div style="font-weight:700">${w.label}</div><div class="small-muted" style="font-size:12px">${w.id}</div></div>
    <div style="text-align:right"><div id="price_${w.label}" class="price-small">--</div><div id="src_${w.label}" class="small-muted">--</div></div>`;
    el.onclick=()=>setChartSymbol(w.id);
    c.appendChild(el);
  });
}

async function refreshWatchPrices(){
  await Promise.all(WATCHLIST.map(async w=>{
    const r=await apiGetPrice(w.id);lastPrices[w.id]=r.price;
    document.getElementById(`price_${w.label}`).textContent=fmt(r.price,r.price>100?2:5);
    document.getElementById(`src_${w.label}`).textContent=r.source;
  }));
  document.getElementById('lastUpdate').textContent=now();
  if(lastPrices[currentSymbol])document.getElementById('currentPriceSmall').textContent='Prix: '+fmt(lastPrices[currentSymbol]);
}

function initTradingView(sym){
  document.getElementById('tv_chart_container').innerHTML='';
  tvWidget=new TradingView.widget({autosize:true,symbol:sym,interval:"60",theme:"dark",locale:"fr",container_id:"tv_chart_container"});
  tvWidget.onChartReady(()=>{document.getElementById('currentSymbol').textContent=sym;refreshWatchPrices();});
}
function setChartSymbol(sym){currentSymbol=sym;initTradingView(sym);}
function computePnl(p,pr){return(p.side==='BUY'?1:-1)*(pr-p.entryPrice)*p.qty;}
function openPosition(o){positions.push(o);renderPositions();}
function closePosition(id){
  const p=positions.find(x=>x.id===id);if(!p)return;
  const cur=lastPrices[p.symbol]??p.entryPrice;const pnl=computePnl(p,cur);
  history.unshift({...p,exitPrice:cur,pnl});positions=positions.filter(x=>x.id!==id);
  renderPositions();renderHistory();
}
function renderPositions(){
  const l=document.getElementById('positionsList');l.innerHTML='';
  if(!positions.length)return l.innerHTML='<div class="small-muted">Aucune position ouverte.</div>';
  positions.forEach(p=>{
    const cur=lastPrices[p.symbol]??p.entryPrice;const pnl=computePnl(p,cur);
    l.innerHTML+=`<div class="pos-row"><div><div>${p.symbol}</div><div class="small-muted">Entrée ${fmt(p.entryPrice)} / Actuel ${fmt(cur)}</div></div>
    <div style="text-align:right"><div class="pnl" style="color:${pnl>=0?'#34d399':'#fb7185'}">${pnl>=0?'+':''}${fmt(pnl,2)}</div>
    <button class="btn ghost" onclick="closePosition('${p.id}')">Fermer</button></div></div>`;
  });
}
function renderHistory(){
  const l=document.getElementById('historyList');l.innerHTML='';
  if(!history.length)return l.innerHTML='<div class="small-muted">Aucun historique.</div>';
  history.forEach(h=>{
    l.innerHTML+=`<div class="pos-row"><div>${h.symbol}<div class="small-muted">${fmt(h.entryPrice)}→${fmt(h.exitPrice)}</div></div>
    <div style="text-align:right"><div class="pnl" style="color:${h.pnl>=0?'#34d399':'#fb7185'}">${h.pnl>=0?'+':''}${fmt(h.pnl,2)}</div><div>${h.side}</div></div></div>`;
  });
}

async function handleOrder(side){
  const qty=Number(prompt(`Ordre ${side} - ${currentSymbol}\nQuantité:`,`1000`));
  if(!qty)return;
  const r=await apiGetPrice(currentSymbol);
  openPosition({id:'pos_'+Date.now(),symbol:currentSymbol,side,qty,entryPrice:r.price});
  alert(`${side} ${currentSymbol} @ ${fmt(r.price)}`);
}

document.getElementById('btnBuy').onclick=()=>handleOrder('BUY');
document.getElementById('btnSell').onclick=()=>handleOrder('SELL');
document.getElementById('btnRefreshWatch').onclick=refreshWatchPrices;
document.getElementById('refreshPrices').onclick=refreshWatchPrices;
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('panelPositions').style.display=b.dataset.tab==='positions'?'block':'none';
  document.getElementById('panelHistory').style.display=b.dataset.tab==='history'?'block':'none';
});

async function boot(){
  renderWatchlist();
  initTradingView(currentSymbol);
  await refreshWatchPrices();
  renderPositions();renderHistory();
  setInterval(refreshWatchPrices,8000);
}
window.closePosition=closePosition;
boot();
  </script>
</body>
</html>
