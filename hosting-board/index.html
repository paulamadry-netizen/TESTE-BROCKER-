<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMA Dash Board</title>
  <style>
    html,body{margin:0;height:100%;width:100%;background:#0b0f19;color:#e8edf4;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,'Helvetica Neue',sans-serif;}
    a{color:#00d4aa;}
    .bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(11,15,25,0.88);backdrop-filter: blur(10px);border-bottom:1px solid rgba(255,255,255,0.08)}
    .bar-title{font-weight:800;letter-spacing:0.2px}
    .bar-actions{display:flex;gap:10px;align-items:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:#e8edf4;text-decoration:none;font-size:13px}
    .btn:hover{background:rgba(255,255,255,0.08)}
    .frame{position:fixed;left:0;right:0;bottom:0;top:56px;width:100%;height:calc(100% - 56px);border:0;background:#0b0f19}
    .loader{position:fixed;left:0;right:0;bottom:0;top:56px;display:flex;align-items:center;justify-content:center;padding:20px;}
    .loader-card{max-width:560px;width:100%;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.04);border-radius:18px;padding:18px 18px 16px;box-shadow:0 16px 40px rgba(0,0,0,0.45)}
    .loader-title{font-weight:900;font-size:18px;margin:0 0 6px}
    .loader-sub{margin:0;color:rgba(232,237,244,0.75);line-height:1.6;font-size:13px}
    .loader-row{display:flex;align-items:center;gap:10px;margin-top:14px}
    .spinner{width:18px;height:18px;border-radius:999px;border:2px solid rgba(255,255,255,0.18);border-top-color:#00d4aa;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .muted{color:rgba(232,237,244,0.65)}
  </style>
</head>
<body>
  <div class="bar">
    <div class="bar-title">AMA Dash Board</div>
    <div class="bar-actions">
      <a class="btn" href="https://teste-brocker-dash.onrender.com" target="_blank" rel="noopener noreferrer">Ouvrir dans un nouvel onglet</a>
    </div>
  </div>
  <div class="loader" id="loader">
    <div class="loader-card">
      <h2 class="loader-title">Chargement du dashboard…</h2>
      <p class="loader-sub">Le service démarre. Ceci peut prendre quelques secondes lors du premier accès.</p>
      <div class="loader-row">
        <div class="spinner" aria-hidden="true"></div>
        <div class="muted" id="loaderStatus">Vérification du serveur…</div>
      </div>
    </div>
  </div>
  <iframe class="frame" id="dashFrame" title="AMA Dash Board" style="display:none"></iframe>

  <script>
    const RENDER_URL = 'https://teste-brocker-dash.onrender.com';
    const READY_ENDPOINT = 'https://us-central1-teste-brocker.cloudfunctions.net/renderDashboardReady';

    const loaderEl = document.getElementById('loader');
    const statusEl = document.getElementById('loaderStatus');
    const frameEl = document.getElementById('dashFrame');

    let tries = 0;
    let consecutiveReady = 0;
    const REQUIRED_CONSECUTIVE_READY = 2;

    async function checkReady() {
      tries += 1;
      if (statusEl) statusEl.textContent = `Démarrage du serveur… (${tries})`;

      try {
        const resp = await fetch(READY_ENDPOINT, { cache: 'no-store' });
        const data = await resp.json();
        if (data && data.ready) {
          consecutiveReady += 1;
          if (statusEl) statusEl.textContent = `Serveur prêt… (${consecutiveReady}/${REQUIRED_CONSECUTIVE_READY})`;
          if (consecutiveReady >= REQUIRED_CONSECUTIVE_READY) {
            if (statusEl) statusEl.textContent = 'Ouverture du dashboard…';
            if (frameEl) {
              const sep = RENDER_URL.includes('?') ? '&' : '?';
              frameEl.src = `${RENDER_URL}${sep}embed=1&t=${Date.now()}`;
              frameEl.style.display = 'block';
            }
            if (loaderEl) loaderEl.style.display = 'none';
            return;
          }
        } else {
          consecutiveReady = 0;
        }
      } catch (e) {
        consecutiveReady = 0;
        // ignore, retry
      }

      setTimeout(checkReady, Math.min(1500 + tries * 250, 3500));
    }

    checkReady();
  </script>
</body>
</html>
