name: Deploy functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - functions/**
      - firebase.json
      - .firebaserc

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies (functions)
        run: npm ci --prefix functions

      - name: Build (functions)
        run: npm run build --prefix functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Check Firebase service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TESTE_BROCKER }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GitHub Secret FIREBASE_SERVICE_ACCOUNT_TESTE_BROCKER (service account JSON). Add it in Repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TESTE_BROCKER }}

      - name: Deploy Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only functions --project teste-brocker
