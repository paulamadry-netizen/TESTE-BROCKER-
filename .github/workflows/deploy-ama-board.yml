name: Deploy ama-board

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies (dashboard)
        run: npm ci --prefix dashboard

      - name: Build (dashboard)
        run: npm run build --prefix dashboard

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Check Firebase service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TESTE_BROCKER }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GitHub Secret FIREBASE_SERVICE_ACCOUNT_TESTE_BROCKER (service account JSON). Add it in Repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TESTE_BROCKER }}

      - name: Deploy to Firebase Hosting (ama-board)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only hosting:ama-board --project teste-brocker
