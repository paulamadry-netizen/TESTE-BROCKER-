# Google Cloud Build configuration for IG Price Engine
# This file automates the build and deployment to Cloud Run

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ig-price-engine:latest'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ig-price-engine:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ig-price-engine'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ig-price-engine:latest'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--set-secrets'
      - 'IG_API_KEY=ig-api-key:latest,IG_IDENTIFIER=ig-identifier:latest,IG_PASSWORD=ig-password:latest'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '1000'

images:
  - 'gcr.io/$PROJECT_ID/ig-price-engine:latest'

options:
  logging: CLOUD_LOGGING_ONLY
